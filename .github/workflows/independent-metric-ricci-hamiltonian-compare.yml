name: Diagnostic - metric Ricci Hamiltonian residual comparison

on:
  push:
    branches:
      - diag/independent-metric-ricci-audit
    paths:
      - diagnostics/curvature_consistency/independent_metric_ricci_hamiltonian_compare.py
      - .github/workflows/independent-metric-ricci-hamiltonian-compare.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Hamiltonian curvature comparison
        run: python -m py_compile diagnostics/curvature_consistency/independent_metric_ricci_hamiltonian_compare.py
      - name: Run same-state Hamiltonian comparison (N=40/80/160, fixed dt)
        run: python diagnostics/curvature_consistency/independent_metric_ricci_hamiltonian_compare.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-metric-ricci-hamiltonian-compare
          path: runs/independent-metric-ricci-hamiltonian-compare/report.json
          if-no-files-found: error
          retention-days: 90
