name: Radiation four-force execution gate

on:
  push:
    branches:
      - diag/radiation-four-force-counterfactual-2026-10-12
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radiation-four-force-gate
  cancel-in-progress: false

jobs:
  regression-and-counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Focused radiation null-identity regression
        run: python -m pytest -q tests/test_radiation_four_force_null_identity.py
      - name: Existing test suite
        run: python -m pytest -q tests
      - name: Four one-step counterfactual comparisons
        run: python tools/diag_radiation_four_force_counterfactual.py
      - name: Preserve JSON and SHA-256
        if: always()
        run: |
          if [ -f artifacts/radiation_four_force_counterfactual.json ]; then
            sha256sum artifacts/radiation_four_force_counterfactual.json | tee artifacts/radiation_four_force_counterfactual.sha256
          else
            echo "Counterfactual artifact not produced; see earlier failed step logs." > artifacts-run-status.txt
          fi
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radiation-four-force-counterfactual
          path: |
            artifacts/radiation_four_force_counterfactual.json
            artifacts/radiation_four_force_counterfactual.sha256
            artifacts-run-status.txt
          if-no-files-found: warn
