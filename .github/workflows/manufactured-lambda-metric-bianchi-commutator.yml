name: Diagnostic - manufactured Lambda metric Bianchi commutator

on:
  push:
    branches: [diag/full-profile-propagation-candidate-ci-2026-10-24]
    paths:
      - tools/audit_manufactured_lambda_metric_commutator.py
      - docs/research/manufactured_lambda_metric_bianchi_commutator_2026-10-25.md
      - .github/workflows/manufactured-lambda-metric-bianchi-commutator.yml

permissions:
  contents: read

concurrency:
  group: manufactured-lambda-metric-bianchi-commutator
  cancel-in-progress: false

jobs:
  manufactured-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: "4aec88d0e3ff028e0a65a8ac36b30948625df792"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out diagnostic branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fail closed on protected-source or vendor-pin drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT")" = "$SOURCE_COMMIT"
          test "$(git rev-parse "HEAD:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          protected_diff="$(git diff --name-only "$SOURCE_COMMIT" HEAD -- engine vendor .gitmodules requirements.txt)"
          if [[ -n "$protected_diff" ]]; then
            echo "Unexpected changes to protected production/vendor/dependency paths:"
            echo "$protected_diff"
            exit 1
          fi
          echo "SOURCE_COMMIT=$SOURCE_COMMIT"
          echo "VENDOR_COMMIT=$VENDOR_COMMIT"
          echo "PROTECTED_SOURCE_DIFF=empty"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependency
        run: python -m pip install numpy

      - name: Compile and run manufactured metric commutator control
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/audit_manufactured_lambda_metric_commutator.py
          mkdir -p results/manufactured-lambda-metric-bianchi-commutator-2026-10-25
          python tools/audit_manufactured_lambda_metric_commutator.py \
            --output results/manufactured-lambda-metric-bianchi-commutator-2026-10-25/summary.json

      - name: Upload machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manufactured-lambda-metric-bianchi-commutator-2026-10-25
          path: results/manufactured-lambda-metric-bianchi-commutator-2026-10-25/
          if-no-files-found: warn
          retention-days: 90
