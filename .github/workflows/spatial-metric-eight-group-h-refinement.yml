name: "[0star] spatial metric a-b-X H refinement"

on:
  push:
    branches:
      - diag/discrete-consistent-initial-review

permissions:
  contents: read

jobs:
  spatial-metric-eight-group:
    if: contains(github.event.head_commit.message, '[run-spatial-metric-eight-group]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Re-run candidate initializer admission tests
        run: python -m pytest -q tests/test_discrete_consistent_initial.py

      - name: Run spatial metric a/b/X eight-group refinement audit
        run: python -m engine.spatial_metric_eight_group_h_refinement

      - name: Upload spatial metric refinement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-metric-eight-group-refinement
          path: runs/spatial-metric-eight-group-h-refinement/report.json
          if-no-files-found: warn
