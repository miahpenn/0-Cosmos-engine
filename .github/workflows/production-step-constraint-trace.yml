name: Diagnostic - production one-step constraint stage trace

on:
  push:
    branches:
      - diag/independent-metric-ricci-audit
    paths:
      - tools/trace_production_step_constraints.py
      - .github/workflows/production-step-constraint-trace.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: production-step-constraint-trace
  cancel-in-progress: true

jobs:
  one-step-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:source
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout diagnostic tools and helper code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact production source and pinned vendor
        uses: actions/checkout@v4
        with:
          ref: fix/strict-campaign-admission-2026-10-12
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Download t=12 production checkpoints
        uses: actions/download-artifact@v4
        with:
          name: v55-production-t12-n40-n60-n80
          path: runs/t12
          repository: miahpenn/0-Cosmos-engine
          run-id: 38208253687
          github-token: ${{ github.token }}

      - name: Compile stage tracer
        run: python -m py_compile tools/trace_production_step_constraints.py

      - name: Trace one production step from t=0 and saved t~10 states
        run: python tools/trace_production_step_constraints.py

      - name: Upload signed stage trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-one-step-constraint-stage-trace
          path: results/production-single-step-stage-trace/
          if-no-files-found: warn
          retention-days: 90
