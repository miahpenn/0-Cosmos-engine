name: Diagnostic - uniform quadrature independent Ricci split

on:
  push:
    branches:
      - diag/uniform-quadrature-independent-ricci-split-2026-10-13
    paths:
      - "tools/audit_uniform_quadrature_independent_ricci_split.py"
      - "tools/audit_uniform_radial_quadrature_initial_profile.py"
      - ".github/workflows/uniform-quadrature-independent-ricci-split.yml"

permissions:
  contents: read

concurrency:
  group: uniform-quadrature-independent-ricci-split-2026-10-13
  cancel-in-progress: false

jobs:
  frozen-initial-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: 6d8b3f2790644591326df57c55908863f994cb0c
      VENDOR_COMMIT: d6052d605673ce9d82cdc99b0df79855fa2ea215

    steps:
      - name: Checkout isolated diagnostic branch and pinned submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned-source dependencies
        run: python -m pip install -r requirements.txt

      - name: Fail closed on production source or vendor drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_COMMIT"
          test "$(git rev-parse "HEAD:engine/production_kernel.py")" = "$(git rev-parse "$SOURCE_COMMIT:engine/production_kernel.py")"
          test "$(git rev-parse "HEAD:engine/v55_initial.py")" = "$(git rev-parse "$SOURCE_COMMIT:engine/v55_initial.py")"
          test "$(git rev-parse "HEAD:engine/v55_pirk_adapter.py")" = "$(git rev-parse "$SOURCE_COMMIT:engine/v55_pirk_adapter.py")"
          test "$(git rev-parse "HEAD:engine/valencia.py")" = "$(git rev-parse "$SOURCE_COMMIT:engine/valencia.py")"
          test "$(git rev-parse "HEAD:engine/matter_system.py")" = "$(git rev-parse "$SOURCE_COMMIT:engine/matter_system.py")"
          test "$(git rev-parse "HEAD:engine/scalar_system.py")" = "$(git rev-parse "$SOURCE_COMMIT:engine/scalar_system.py")"
          test "$(git rev-parse "HEAD:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          printf 'SOURCE_COMMIT=%s\nVENDOR_COMMIT=%s\n' "$SOURCE_COMMIT" "$VENDOR_COMMIT"

      - name: Compile diagnostic and exact initializer helper
        run: |
          python -m py_compile tools/audit_uniform_quadrature_independent_ricci_split.py
          python -m py_compile tools/audit_uniform_radial_quadrature_initial_profile.py

      - name: Compare vendor operators with independent sampled-metric formula
        run: PYTHONPATH=. python tools/audit_uniform_quadrature_independent_ricci_split.py

      - name: Record source provenance and report digest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/uniform-quadrature-independent-ricci-split
          printf '%s\n' "$SOURCE_COMMIT" > results/uniform-quadrature-independent-ricci-split/SOURCE_COMMIT.txt
          printf '%s\n' "$VENDOR_COMMIT" > results/uniform-quadrature-independent-ricci-split/VENDOR_COMMIT.txt
          git rev-parse HEAD > results/uniform-quadrature-independent-ricci-split/DIAGNOSTIC_COMMIT.txt
          if test -f results/uniform-quadrature-independent-ricci-split/report.json; then
            (cd results/uniform-quadrature-independent-ricci-split && sha256sum report.json > REPORT_SHA256SUM.txt)
          fi

      - name: Upload decomposition evidence even if the diagnostic fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniform-quadrature-independent-ricci-split
          path: results/uniform-quadrature-independent-ricci-split/
          if-no-files-found: warn
          retention-days: 90
