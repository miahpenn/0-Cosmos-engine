name: Diagnostic - strong-D production metric Ricci and H audit

on:
  push:
    branches:
      - diag/independent-metric-ricci-audit
    paths:
      - diagnostics/curvature_consistency/strong_D_production_metric_ricci_H_audit.py
      - .github/workflows/strong-D-production-metric-ricci-H-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile strong-D production curvature/H diagnostic
        run: python -m py_compile diagnostics/curvature_consistency/strong_D_production_metric_ricci_H_audit.py
      - name: Run production-initialized strong-D audit (N=160, r_max=80, t=22.5)
        run: python diagnostics/curvature_consistency/strong_D_production_metric_ricci_H_audit.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strong-D-production-metric-ricci-H-audit
          path: runs/strong-D-production-metric-ricci-H-audit/report.json
          if-no-files-found: error
          retention-days: 90
