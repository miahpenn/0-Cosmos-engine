name: Diagnostic - flat LCDM cosmology smoke test

on:
  push:
    branches:
      - "diag/bond-sweep-self-consistent"
    paths:
      - "diagnostics/flat_lcdm_smoke.py"
      - ".github/workflows/flat-lcdm-smoke.yml"

permissions:
  contents: read

jobs:
  flat-lcdm:
    if: contains(github.event.head_commit.message, '[flat-lcdm-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run flat LCDM analytic comparison
        run: python diagnostics/flat_lcdm_smoke.py
      - name: Upload diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: flat-lcdm-smoke
          path: runs/flat_lcdm_smoke/flat_lcdm_smoke.json
          if-no-files-found: error
