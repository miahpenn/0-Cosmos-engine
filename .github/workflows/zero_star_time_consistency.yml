name: 0-star central-clock time-consistency campaign
# Explicit campaign trigger: [0star-time]

on:
  workflow_dispatch:
  push:
    branches: [0star-central-clock]

env:
  PYTHONPATH: .

jobs:
  low-cfl-central-clock:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[0star-time]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run repository tests
        run: python -m pytest -q

      - name: Run central proper-time consistency campaign
        run: |
          python - <<'PY'
          from engine.campaign import CampaignConfig
          from engine.production_kernel import V55ProductionKernel
          from engine.run_production import run_campaign
          from engine.zero_star_clock_gauge import solve_central_proper_time_lapse

          class CentralProperTimeKernel(V55ProductionKernel):
              def _solve_lapse(self, grid, geometry, scalars, matter):
                  return solve_central_proper_time_lapse(
                      grid, geometry, scalars, matter
                  )

          config = CampaignConfig(
              resolutions=(80, 120, 160),
              r_max=160.0,
              cfl=0.0075,
              final_time=22.5,
              output_dir='runs/0star-time-consistency',
          )
          results = run_campaign(
              kernel=CentralProperTimeKernel(),
              config=config,
          )
          for result in results:
              print(result)
          PY

      - name: Upload time-consistency outputs
        uses: actions/upload-artifact@v4
        with:
          name: 0star-central-clock-time-consistency
          path: runs/0star-time-consistency/
          if-no-files-found: error
