name: Diagnostic - semi-discrete momentum constraint tangent

on:
  push:
    branches:
      - diag/lambda-connection-budget-2026-10-12
    paths:
      - tools/semidiscrete_momentum_tangent.py
      - .github/workflows/semidiscrete-momentum-tangent.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: semidiscrete-momentum-tangent
  cancel-in-progress: true

jobs:
  momentum-tangent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout diagnostic code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact production source and pinned vendor
        uses: actions/checkout@v4
        with:
          ref: 6d8b3f2790644591326df57c55908863f994cb0c
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Download admitted production checkpoints
        uses: actions/download-artifact@v4
        with:
          name: v55-production-t12-n40-n60-n80
          path: runs/t12
          repository: miahpenn/0-Cosmos-engine
          run-id: 38208253687
          github-token: ${{ github.token }}

      - name: Compile diagnostic
        run: python -m py_compile tools/semidiscrete_momentum_tangent.py

      - name: Evaluate semi-discrete momentum residual tangent
        run: python tools/semidiscrete_momentum_tangent.py

      - name: Upload tangent and actual one-step comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semidiscrete-momentum-tangent
          path: results/semidiscrete-momentum-tangent/
          if-no-files-found: warn
          retention-days: 90
