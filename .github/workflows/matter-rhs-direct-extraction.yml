name: Direct matter RHS extraction contract

on:
  push:
    branches:
      - fix/matter-rhs-direct-extraction-main-2026-10-12
    paths:
      - engine/matter_system.py
      - engine/matter_rhs.py
      - tests/test_matter_rhs_direct_extraction.py
      - tests/test_covariant_beta_source_one_step_ab.py
      - .github/workflows/matter-rhs-direct-extraction.yml
  pull_request:
    branches:
      - main
    paths:
      - engine/matter_system.py
      - engine/matter_rhs.py
      - tests/test_matter_rhs_direct_extraction.py
      - tests/test_covariant_beta_source_one_step_ab.py
      - .github/workflows/matter-rhs-direct-extraction.yml

permissions:
  contents: read

concurrency:
  group: matter-rhs-direct-extraction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify pinned geometry/PIRK vendor
        run: |
          expected="d6052d605673ce9d82cdc99b0df79855fa2ea215"
          actual="$(git rev-parse HEAD:vendor/bb-palatini-unified-r0)"
          test "$actual" = "$expected"
      - name: Compile changed modules and tests
        run: |
          python -m py_compile engine/matter_system.py engine/matter_rhs.py
          python -m py_compile tests/test_matter_rhs_direct_extraction.py tests/test_covariant_beta_source_one_step_ab.py
      - name: Run focused direct-RHS contract tests
        run: python -m pytest -q tests/test_matter_rhs_direct_extraction.py
      - name: Run matched covariant source A/B witnesses
        run: python -m pytest -q -s tests/test_covariant_beta_source_one_step_ab.py
      - name: Run complete repository test suite
        run: python -m pytest -q
