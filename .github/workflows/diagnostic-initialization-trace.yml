name: Diagnostic initial-state identity trace

on:
  pull_request:
    paths:
      - "tools/diagnostic_initialization_trace.py"
      - ".github/workflows/diagnostic-initialization-trace.yml"
      - "engine/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-initialization-trace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  init-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "7f47669a1c0edfafef9fc5f27b2db80840d3f035"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
    steps:
      - name: Check out candidate tree and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out historical source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up exact Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"

      - name: Install pinned source dependencies and recorded numerical environment
        run: |
          python -m pip install -r source/requirements.txt
          python -m pip install numpy==2.5.4 scipy==1.18.1 sympy==1.14.0 mpmath==1.3.0 pytest==9.1.1 threadpoolctl

      - name: Verify historical and vendor pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"

      - name: Compile diagnostic runner
        run: python -m py_compile tools/diagnostic_initialization_trace.py

      - name: Trace candidate and historical initial states
        id: trace
        continue-on-error: true
        run: |
          mkdir -p results/initial-state-identity-trace
          python tools/diagnostic_initialization_trace.py \
            --engine-root "$GITHUB_WORKSPACE" \
            --historical-root "$GITHUB_WORKSPACE/source" \
            --output "$GITHUB_WORKSPACE/results/initial-state-identity-trace/candidate_init_trace.json"

      - name: Record environment and git provenance
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p results/initial-state-identity-trace
          {
            echo "candidate_commit=$(git rev-parse HEAD)"
            echo "candidate_status:"
            git status --short --ignored
            echo "historical_commit=$(git -C source rev-parse HEAD)"
            echo "vendor_candidate=$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)"
            echo "vendor_historical=$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)"
            python -m pip freeze
            python -m threadpoolctl -i numpy
            python - <<'PY'
import numpy as np
np.show_config()
PY
          } > results/initial-state-identity-trace/environment.txt 2>&1

      - name: Upload init trace even after digest failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: initial-state-identity-trace
          path: results/initial-state-identity-trace/
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve fail-closed status
        if: steps.trace.outcome == 'failure'
        run: exit 1
