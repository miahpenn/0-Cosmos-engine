name: Strict campaign plus radiation retry integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: strict-retry-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrated-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete repository suite
        run: python -m pytest -q

      - name: Run bounded full-machine production smoke
        run: |
          python - <<'PY'
          import json
          from engine.campaign import CampaignConfig
          from engine.run_production import run_campaign

          config = CampaignConfig(
              resolutions=(40,),
              r_max=40.0,
              cfl=0.03,
              final_time=0.03,
              checkpoint_interval=0.1,
              output_dir="runs/strict-retry-smoke",
          )
          results = run_campaign(config=config)
          assert len(results) == 1
          assert results[0].status == "completed"
          assert abs(results[0].t_final - config.final_time) <= 1.0e-12
          with open("runs/strict-retry-smoke/campaign_summary.json") as handle:
              summary = json.load(handle)
          assert summary["admission"]["passed"] is True
          print("STRICT_RETRY_INTEGRATION_SMOKE_PASS", results[0])
          PY

      - name: Preserve smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-retry-integration-smoke
          path: runs/strict-retry-smoke/
          if-no-files-found: warn
