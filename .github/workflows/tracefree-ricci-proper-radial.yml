name: Diagnostic - trace-free Ricci / proper-radial reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/audit_tracefree_ricci_proper_radial.py
      - tests/test_tracefree_ricci_proper_radial.py
      - diagnostics/tracefree-ricci-proper-radial-refresh-2026-10-15.md
      - .github/workflows/tracefree-ricci-proper-radial.yml
      - engine/**
      - vendor/**
      - .gitmodules
      - requirements.txt

permissions:
  contents: read

concurrency:
  group: tracefree-ricci-proper-radial-current-main-2026-10-15
  cancel-in-progress: false

jobs:
  tracefree-ricci-proper-radial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "fcb32b6b4025d5674e0560b8fb24581933f7f23c"
      SOURCE_KERNEL_BLOB: "9685e76bb5a6f26d6bf383e240de24f37523f265"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
    steps:
      - name: Checkout exact PR head and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Decide whether this diff needs the expensive source-pinned diagnostic
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA...HEAD")"
          printf 'Changed paths relative to PR base:\\n%s\\n' "$changed"
          if printf '%s\\n' "$changed" | grep -Eq '^(tools/audit_tracefree_ricci_proper_radial\\.py|diagnostics/tracefree-ricci-proper-radial-refresh-2026-10-15\\.md|engine/|vendor/|\\.gitmodules$|requirements\\.txt$)'; then
            echo "run_diagnostic=true" >> "$GITHUB_OUTPUT"
            echo "Diagnostic-affecting paths changed; source-pinned run is required."
          else
            echo "run_diagnostic=false" >> "$GITHUB_OUTPUT"
            echo "No diagnostic-affecting paths changed; standard PR checks cover this test-only/workflow-only diff."
          fi

      - name: Set up Python
        if: steps.scope.outputs.run_diagnostic == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository requirements
        if: steps.scope.outputs.run_diagnostic == 'true'
        run: python -m pip install -r requirements.txt

      - name: Compile diagnostic
        if: steps.scope.outputs.run_diagnostic == 'true'
        run: python -m py_compile tools/audit_tracefree_ricci_proper_radial.py

      - name: Fail closed on source/vendor drift and physics edits
        if: steps.scope.outputs.run_diagnostic == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_COMMIT"
          source_blob="$(git rev-parse "$SOURCE_COMMIT:engine/production_kernel.py")"
          head_blob="$(git rev-parse "HEAD:engine/production_kernel.py")"
          test "$source_blob" = "$SOURCE_KERNEL_BLOB"
          test "$head_blob" = "$SOURCE_KERNEL_BLOB"
          test "$(git rev-parse "$SOURCE_COMMIT:engine/v55_initial.py")" = "7db2e1a10cf16fb40e4221b0df504fdf39aae611"
          test "$(git rev-parse "HEAD:engine/v55_initial.py")" = "7db2e1a10cf16fb40e4221b0df504fdf39aae611"
          test "$(git rev-parse "$SOURCE_COMMIT:engine/v55_pirk_adapter.py")" = "eeee0492d80889d70e52b0946563eee5054c0f11"
          test "$(git rev-parse "HEAD:engine/v55_pirk_adapter.py")" = "eeee0492d80889d70e52b0946563eee5054c0f11"
          test "$(git rev-parse "$SOURCE_COMMIT:engine/cmc_gauge.py")" = "7b49b5751abebd4faf0130208032cd2080b71f64"
          test "$(git rev-parse "HEAD:engine/cmc_gauge.py")" = "7b49b5751abebd4faf0130208032cd2080b71f64"
          test "$(git rev-parse "$SOURCE_COMMIT:engine/v55_matter.py")" = "acc8f8ceae28d82511c9a5ad9d2ca670e09fb0f7"
          test "$(git rev-parse "HEAD:engine/v55_matter.py")" = "acc8f8ceae28d82511c9a5ad9d2ca670e09fb0f7"
          test "$(git rev-parse "$SOURCE_COMMIT:engine/stress_energy.py")" = "ac3e7518c62bb72e2218a61489fa486bb787809f"
          test "$(git rev-parse "HEAD:engine/stress_energy.py")" = "ac3e7518c62bb72e2218a61489fa486bb787809f"
          test "$(git rev-parse "HEAD:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          changed="$(git diff --name-only "$SOURCE_COMMIT" HEAD -- engine vendor .gitmodules requirements.txt)"
          if [ -n "$changed" ]; then
            printf 'Unexpected production/vendor/dependency changes:\n%s\n' "$changed"
            exit 1
          fi
          printf 'SOURCE_COMMIT=%s\nSOURCE_KERNEL_BLOB=%s\nVENDOR_COMMIT=%s\n' \
            "$SOURCE_COMMIT" "$SOURCE_KERNEL_BLOB" "$VENDOR_COMMIT"

      - name: Run full repository regression suite
        if: steps.scope.outputs.run_diagnostic == 'true'
        run: python -m pytest -q

      - name: Capture trace-free Ricci / proper-radial witnesses at actual PIRK L2 stages
        if: steps.scope.outputs.run_diagnostic == 'true'
        run: python tools/audit_tracefree_ricci_proper_radial.py

      - name: Upload report and radial profiles
        if: always() && steps.scope.outputs.run_diagnostic == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tracefree-ricci-proper-radial-2026-10-15
          path: results/tracefree-ricci-proper-radial-2026-10-15/
          if-no-files-found: warn
          retention-days: 90
