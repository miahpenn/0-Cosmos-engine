name: Diagnostic - trace-free Ricci / proper-radial reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/audit_tracefree_ricci_proper_radial.py
      - tests/test_tracefree_ricci_proper_radial.py
      - diagnostics/tracefree-ricci-proper-radial-refresh-2026-10-15.md
      - .github/workflows/tracefree-ricci-proper-radial.yml
      - engine/**
      - vendor/**
      - .gitmodules
      - requirements.txt

permissions:
  contents: read

concurrency:
  group: tracefree-ricci-proper-radial-current-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  tracefree-ricci-proper-radial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "e6b501fb19c4f2e21ad9c655662840a3d2582d54"
      SOURCE_KERNEL_BLOB: "9685e76bb5a6f26d6bf383e240de24f37523f265"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
    steps:
      - name: Checkout exact PR head and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Decide whether this diff needs the expensive source-pinned diagnostic
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA...HEAD")"
          printf 'Changed paths relative to PR base:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(tools/audit_tracefree_ricci_proper_radial\.py|diagnostics/tracefree-ricci-proper-radial-refresh-2026-10-15\.md|engine/|vendor/|\.gitmodules$|requirements\.txt$)'; then
            echo "run_diagnostic=true" >> "$GITHUB_OUTPUT"
            echo "Diagnostic-affecting paths changed; source-pinned run is required."
          else
            echo "run_diagnostic=false" >> "$GITHUB_OUTPUT"
            echo "No diagnostic-affecting paths changed; standard PR checks cover this test-only/workflow-only diff."
          fi

      - name: Set up Python
        if: steps.scope.outputs.run_diagnostic == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository requirements
        if: steps.scope.outputs.run_diagnostic == 'true'
        run: python -m pip install -r requirements.txt

      - name: Compile diagnostic
        if: steps.scope.outputs.run_diagnostic == 'true'
        run: python -m py_compile tools/audit_tracefree_ricci_proper_radial.py

      - name: Fail closed on source/vendor drift and physics edits
        if: steps.scope.outputs.run_diagnostic == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_COMMIT"
          declare -A blobs=(
            ["engine/production_kernel.py"]="9685e76bb5a6f26d6bf383e240de24f37523f265"
            ["engine/matter_system.py"]="e52a117690253ddad7b24d116145a65474a351d2"
            ["engine/matter_rhs.py"]="f41180efbcff2c72cf36477a765318ab539fac80"
            ["engine/scalar_system.py"]="ffc119b1a6f2d495d972323901f76a85783b0a1b"
            ["engine/v55_matter.py"]="0ee3c51fac7dc46c63feba2747a750542bcee3d0"
            ["engine/v55_pirk_adapter.py"]="eeee0492d80889d70e52b0946563eee5054c0f11"
            ["engine/cmc_gauge.py"]="7b49b5751abebd4faf0130208032cd2080b71f64"
            ["engine/v55_initial.py"]="7db2e1a10cf16fb40e4221b0df504fdf39aae611"
            ["engine/stress_energy.py"]="ac3e7518c62bb72e2218a61489fa486bb787809f"
            ["engine/valencia.py"]="03ed86398f424c03d9d6a3e646da9222a34fac5c"
            ["engine/worldtube.py"]="aea19090cb0fd2ebe5481a8b7af0d26f119a9ad6"
          )
          declare -A authorized_heads=(
            ["engine/production_kernel.py"]="cc4ae0f58dd5df4e05f596f6e677526586956f26"
            ["engine/v55_pirk_adapter.py"]="be28ceea63fa1b59efc5cc5c460b9df19ae1cbc3"
          )
          declare -A authorized_cmc_centre_row_heads=(
            ["engine/cmc_gauge.py"]="c56c077e1fe339bb0699b79d71d407f26dcb3475"
          )
          declare -A authorized_initializer_origin_heads=(
            ["engine/v55_initial.py"]="75e5f2cb7794520ad7d278e17496b9c03fbf635e"
          )
          declare -A authorized_sd_quartic_heads=(
            ["engine/scalar_system.py"]="9c5ca6ee296315c1f631bababdd2964b6edc9fde"
            ["engine/v55_initial.py"]="d127e1f8ff4213eed1eb3369b0f16b66a5e203c7"
          )
          declare -A authorized_shared_constants_heads=(
            ["engine/scalar_system.py"]="9898f75a418456b54fa0255a9ca3873ef39af0bc"
            ["engine/production_kernel.py"]="8c77065e64ef14e50e7fd08e2a8cc165d58e055d"
          )
          declare -A authorized_hand_floor_step2_heads=(
            ["engine/scalar_system.py"]="01a440955ccacf9a89bd0d68cec08c984216e9e8"
            ["engine/production_kernel.py"]="21e40c004938353e9b43bdbc9abf943f1deb5eef"
            ["engine/v55_initial.py"]="80e73e07916be87cc09abc017c3e16ed45525dc8"
          )
          declare -A authorized_lattice_wall_heads=(
            ["engine/production_kernel.py"]="2d9a085667b2ef4adc96e32b6d57dbd610ee0eef"
          )
          declare -A authorized_pocket_fixtures_wall_heads=(
            ["engine/production_kernel.py"]="4e6029eb5a7c12a9e905f27a17625325d9ed09ed"
            ["engine/v55_initial.py"]="9f8b2a038ebd53d1a6e18f0482dba99f4363e1e8"
          )
          declare -A authorized_ledger_shift_heads=(
            ["engine/production_kernel.py"]="216ba0a4fbfe2590bf704cae3ddc801dc8655ae0"
            ["engine/worldtube.py"]="c263a786b2057f4a427243899ae507e8a0c0c8c5"
          )
          declare -A authorized_lane_b_heads=(
            ["engine/matter_system.py"]="0969f4d996e4f8e0fc5b70a7dff147f024907302"
            ["engine/matter_rhs.py"]="0153c232ee15b5a9d3dbac37ea858e4d2d730011"
            ["engine/scalar_system.py"]="e2c2dae9a016b4d6454cf74a9eae8b0167d5733d"
            ["engine/production_kernel.py"]="1720615628a98a8d7cfc9fcadcc984fe28c88be1"
          )
          for path in "${!blobs[@]}"; do
            expected="${blobs[$path]}"
            source_blob="$(git rev-parse "$SOURCE_COMMIT:$path")"
            head_blob="$(git rev-parse "HEAD:$path")"
            test "$source_blob" = "$expected"
            authorized="${authorized_heads[$path]:-}"
            lane_b_authorized="${authorized_lane_b_heads[$path]:-}"
            cmc_centre_row_authorized="${authorized_cmc_centre_row_heads[$path]:-}"
            initializer_origin_authorized="${authorized_initializer_origin_heads[$path]:-}"
            ledger_shift_authorized="${authorized_ledger_shift_heads[$path]:-}"
            sd_quartic_authorized="${authorized_sd_quartic_heads[$path]:-}"
            shared_constants_authorized="${authorized_shared_constants_heads[$path]:-}"
            hand_floor_step2_authorized="${authorized_hand_floor_step2_heads[$path]:-}"
            lattice_wall_authorized="${authorized_lattice_wall_heads[$path]:-}"
            pocket_fixtures_wall_authorized="${authorized_pocket_fixtures_wall_heads[$path]:-}"
            if [ "$head_blob" != "$pocket_fixtures_wall_authorized" ] && [ "$head_blob" != "$lattice_wall_authorized" ] && [ "$head_blob" != "$hand_floor_step2_authorized" ] && [ "$head_blob" != "$shared_constants_authorized" ] && [ "$head_blob" != "$sd_quartic_authorized" ] && [ "$head_blob" != "$expected" ] && [ "$head_blob" != "$authorized" ] && [ "$head_blob" != "$lane_b_authorized" ] && [ "$head_blob" != "$cmc_centre_row_authorized" ] && [ "$head_blob" != "$initializer_origin_authorized" ] && [ "$head_blob" != "$ledger_shift_authorized" ]; then
              printf 'Unapproved head blob for protected runtime path %s: %s\n' "$path" "$head_blob"
              exit 1
            fi
          done
          test "$(git rev-parse "HEAD:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          changed="$(git diff --name-only "$SOURCE_COMMIT" HEAD -- engine vendor .gitmodules requirements.txt)"
          unexpected=""
          if [ -n "$changed" ]; then
            unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(engine/native_geometry/__init__\.py|engine/native_geometry/constraints\.py|engine/native_geometry/geometry\.py|engine/native_geometry/operators\.py|engine/native_geometry/evolution\.py|engine/production_kernel\.py|engine/v55_pirk_adapter\.py|engine/matter_system\.py|engine/matter_rhs\.py|engine/scalar_system\.py|engine/cmc_gauge\.py|engine/v55_initial\.py)$' || true)"
          fi
          # Engine files outside this audit's runtime set, each authorized as one exact head blob
          # (same table as tools/audit_tracefree_ricci_proper_radial.py); any other content still
          # fails closed. local.py: provenance-only (row-5 decision), after #441 and #457. true_cmc_reference.py:
          # even-ghost CMC centre row (#442). coupled_engine.py / bidirectional_production.py:
          # thin drivers over V55ProductionKernel; worldtube.py: Misner-Sharp shift-flux helper; run_controls.py: provenance label
          # (re-authorized with cosmos.py and model_constants.py for the dark-matter replacement, Nov 16 2026: S-D matter
          # in two parts in the COSMOS lane, nine-slot state)
          # (this audit imports none of them, except lattice_wall.py: the zero-flux wall, imported through
          # production_kernel.py but not exercised, since the audit runs on the reference path with the open edge).
          declare -A authorized_off_audit_heads=(
            ["engine/local.py"]="421ab84c1e67b815f0573958cab63939c7fca78f"
            ["engine/true_cmc_reference.py"]="5cbac98225ce711dab80e5db97672012885fe47c"
            ["engine/coupled_engine.py"]="4fd5def0a84db375a06c09170a0618c070fdd122"
            ["engine/bidirectional_production.py"]="21e55a57f2029713225cce9b590db57817d4e4f1"
            ["engine/worldtube.py"]="c263a786b2057f4a427243899ae507e8a0c0c8c5"
            ["engine/run_controls.py"]="c553a80d027d923434356ca37bdfe239c5c672ff"
            ["engine/model_constants.py"]="65abb1028f51678c04dcb0309828418664614196"
            ["engine/cosmos.py"]="7f7ca759e5678c1f9a4b184cd3426560f3f2bc4e"
            ["engine/lattice_wall.py"]="a3becc6332d384eab3af662ba82d01512e6213e7"
          )
          for path in "${!authorized_off_audit_heads[@]}"; do
            if [ -n "$unexpected" ] && [ "$(git rev-parse "HEAD:$path" 2>/dev/null)" = "${authorized_off_audit_heads[$path]}" ]; then
              unexpected="$(printf '%s\n' "$unexpected" | grep -Fxv "$path" || true)"
            fi
          done
          if [ -n "$unexpected" ]; then
            printf 'Unexpected production/vendor/dependency changes:\n%s\n' "$unexpected"
            exit 1
          fi
          for path in engine/native_geometry/__init__.py engine/native_geometry/constraints.py engine/native_geometry/geometry.py engine/native_geometry/operators.py engine/native_geometry/evolution.py; do
            if printf '%s\n' "$changed" | grep -Fxq "$path"; then
              if git cat-file -e "$SOURCE_COMMIT:$path" 2>/dev/null; then
                printf 'Native candidate path is not additive relative to pinned source: %s\n' "$path"
                exit 1
              fi
              printf 'Allowing isolated additive native-core candidate path; exact-head tests still apply: %s\n' "$path"
            fi
          done
          printf 'SOURCE_COMMIT=%s\nVENDOR_COMMIT=%s\n' "$SOURCE_COMMIT" "$VENDOR_COMMIT"

      - name: Run full repository regression suite
        if: steps.scope.outputs.run_diagnostic == 'true'
        run: python -m pytest -q

      - name: Capture trace-free Ricci / proper-radial witnesses at actual PIRK L2 stages
        if: steps.scope.outputs.run_diagnostic == 'true'
        run: python tools/audit_tracefree_ricci_proper_radial.py

      - name: Upload report and radial profiles
        if: always() && steps.scope.outputs.run_diagnostic == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tracefree-ricci-proper-radial-2026-10-15
          path: results/tracefree-ricci-proper-radial-2026-10-15/
          if-no-files-found: warn
          retention-days: 90
