name: "[0star] production to COSMOS geometry bridge"

on:
  workflow_dispatch:
  push:
    branches: [0star-central-clock]

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  bridge:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-geometry-bridge]')
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Repository tests
        run: python -m pytest -q

      - name: Run N=80 production geometry bridge
        run: python -m engine.production_geometry_bridge

      - name: Upload bridge report
        uses: actions/upload-artifact@v4
        with:
          name: 0star-production-geometry-bridge
          path: runs/production-geometry-bridge/report.json
          if-no-files-found: error
