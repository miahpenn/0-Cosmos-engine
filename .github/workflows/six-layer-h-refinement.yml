name: "[0star] six-layer Hamiltonian time refinement"

on:
  push:
    branches:
      - diag/discrete-consistent-initial-review

permissions:
  contents: read

jobs:
  six-layer-h-refinement:
    if: contains(github.event.head_commit.message, '[run-six-layer-h-refinement]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Re-run candidate initializer admission tests
        run: python -m pytest -q tests/test_discrete_consistent_initial.py

      - name: Run six-layer Hamiltonian full/half/quarter refinement audit
        run: python -m engine.six_layer_h_refinement

      - name: Upload six-layer H refinement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-layer-h-refinement
          path: runs/six-layer-h-refinement/report.json
          if-no-files-found: warn
