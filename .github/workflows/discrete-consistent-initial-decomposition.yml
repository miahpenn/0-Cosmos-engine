name: "[0star] discrete-consistent matched Hamiltonian drift decomposition"

on:
  push:
    branches:
      - diag/discrete-consistent-initial-review

permissions:
  contents: read

jobs:
  matched-drift-attribution:
    if: contains(github.event.head_commit.message, '[run-discrete-consistent-decomposition]') || contains(github.event.head_commit.message, '[run-baseline-decomposition]') || contains(github.event.head_commit.message, '[run-n80-decomposition-pair]') || contains(github.event.head_commit.message, '[run-n160-candidate-convergence]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Confirm candidate solver admission tests
        run: python -m pytest -q tests/test_discrete_consistent_initial.py

      - name: Attribute matched baseline/candidate Hamiltonian drift at selected resolution
        env:
          GITHUB_SHA: ${{ github.sha }}
          RUN_MODE: ${{ contains(github.event.head_commit.message, '[run-baseline-decomposition]') && 'baseline' || contains(github.event.head_commit.message, '[run-n80-decomposition-pair]') && 'both' || 'candidate' }}
          RESOLUTION: ${{ contains(github.event.head_commit.message, '[run-n80-decomposition-pair]') && '80' || contains(github.event.head_commit.message, '[run-n160-candidate-convergence]') && '160' || '40' }}
        run: python -m engine.discrete_consistent_initial_decomposition --mode "$RUN_MODE" --resolution "$RESOLUTION"

      - name: Upload per-step attribution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discrete-consistent-initial-drift-decomposition
          path: |
            runs/discrete-consistent-initial-decomposition/report.json
            runs/discrete-consistent-initial-decomposition-baseline/report.json
          if-no-files-found: warn
