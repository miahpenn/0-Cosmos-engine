name: Issue #4 manufactured-profile stencil/parity discriminator

on:
  pull_request:
    paths:
      - "tools/audit_issue4_rhs_stencil_parity.py"
      - "tests/test_issue4_stencil_parity_contract.py"
      - ".github/workflows/issue4-manufactured-stencil-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue4-manufactured-stencil-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-manufactured-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "0c40172f32b72a8149549adadf63d668a2f24f3e"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      COSMOS_PINNED_SOURCE_ROOT: ${{ github.workspace }}/source
    steps:
      - name: Check out diagnostic branch and vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out exact production source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install pinned source dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Fail closed on source, vendor, and diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          printf 'PRODUCTION_SOURCE=%s\n' "$(git -C source rev-parse HEAD)"
          printf 'PRODUCTION_VENDOR=%s\n' "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)"
          printf 'DIAGNOSTIC_HEAD=%s\n' "$(git rev-parse HEAD)"
          changed="$(git diff --name-only "$BASE_SHA...HEAD" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/issue4-manufactured-stencil-parity.yml' \
            '.github/workflows/lightweight_validation.yml' \
            'tests/test_issue4_stencil_parity_contract.py' \
            'tools/audit_issue4_rhs_stencil_parity.py' | sort)"
          test "$changed" = "$expected"

      - name: Compile bounded audit and contract tests
        run: |
          python -m py_compile tools/audit_issue4_rhs_stencil_parity.py
          python -m py_compile tests/test_issue4_stencil_parity_contract.py

      - name: Run regular-profile operator/parity controls
        run: python -m pytest -q tests/test_issue4_stencil_parity_contract.py

      - name: Run one frozen manufactured-profile RHS tangent audit; zero production steps
        run: |
          mkdir -p results/issue4-manufactured-stencil-parity
          python tools/audit_issue4_rhs_stencil_parity.py \
            --resolution 64 \
            --r-max 40 \
            --output-dir results/issue4-manufactured-stencil-parity

      - name: Hash and retain diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d results ]]; then
            find results -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > results/SHA256SUMS.txt
          fi

      - name: Upload signed budget and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue4-manufactured-stencil-parity
          path: results/
          if-no-files-found: warn
          retention-days: 90
