name: Diagnostic - discrete-consistent initial Lambda Ricci sensitivity

on:
  push:
    branches:
      - diag/discrete-consistent-initial-production-test-2026-10-12
    paths:
      - tools/audit_discrete_consistent_initial_lambda_ricci_sensitivity.py
      - .github/workflows/discrete-consistent-initial-lambda-ricci-sensitivity.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: discrete-consistent-initial-lambda-ricci-sensitivity-2026-10-12
  cancel-in-progress: false

jobs:
  frozen-lambda-ricci-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact production source and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          ref: 6d8b3f2790644591326df57c55908863f994cb0c
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Download matched production A/B checkpoints through t=2.16
        uses: actions/download-artifact@v4
        with:
          name: discrete-consistent-initial-production-ab-t2p16
          repository: miahpenn/0-Cosmos-engine
          run-id: 38284401548
          github-token: ${{ github.token }}
          path: production-ab-artifact

      - name: Compile the frozen Lambda/Ricci sensitivity audit
        run: python -m py_compile tools/audit_discrete_consistent_initial_lambda_ricci_sensitivity.py

      - name: Compare current and discrete metric-derived Lambda on frozen states
        run: python tools/audit_discrete_consistent_initial_lambda_ricci_sensitivity.py

      - name: Upload Ricci and original constraint sensitivity profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discrete-consistent-initial-lambda-ricci-sensitivity
          path: results/discrete-consistent-initial-lambda-ricci-sensitivity/
          if-no-files-found: warn
          retention-days: 90
