name: Issue 4 Valencia covariant exchange-source coefficient audit

on:
  pull_request:
    paths:
      - "tools/audit_valencia_covariant_exchange_source.py"
      - ".github/workflows/issue4-valencia-exchange-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue4-valencia-exchange-source-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-coefficient-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "7f47669a1c0edfafef9fc5f27b2db80840d3f035"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
    steps:
      - name: Check out diagnostic branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out exact production source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install pinned production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Fail closed on exact production and vendor source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          for path in engine/production_kernel.py engine/matter_system.py engine/matter_rhs.py engine/scalar_system.py engine/v55_matter.py engine/v55_pirk_adapter.py engine/cmc_gauge.py engine/v55_initial.py engine/stress_energy.py engine/valencia.py engine/worldtube.py; do
            test "$(git rev-parse "HEAD:$path")" = "$(git -C source rev-parse "HEAD:$path")"
          done
          printf 'PRODUCTION_SOURCE=%s\n' "$(git -C source rev-parse HEAD)"
          printf 'VENDOR_SOURCE=%s\n' "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)"

      - name: Compile the read-only exchange audit
        run: python -m py_compile tools/audit_valencia_covariant_exchange_source.py

      - name: Run source-pinned covariant exchange coefficient audit
        id: audit
        continue-on-error: true
        run: |
          mkdir -p results/valencia-exchange-source
          COSMOS_PINNED_SOURCE_ROOT="$GITHUB_WORKSPACE/source" python tools/audit_valencia_covariant_exchange_source.py \
            --resolution 160 \
            --r-max 24 \
            --output results/valencia-exchange-source/report.json

      - name: Hash and upload report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find results/valencia-exchange-source -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > results/valencia-exchange-source/SHA256SUMS.txt

      - name: Upload source-level matter source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valencia-exchange-source-audit
          path: results/valencia-exchange-source/
          if-no-files-found: warn
          retention-days: 90

      - name: Require complete controls while leaving science gate closed
        if: always()
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          test "$AUDIT_OUTCOME" = "success"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("results/valencia-exchange-source/report.json").read_text(encoding="utf-8"))
          assert report["status"] == "completed_diagnostic_only"
          assert report["scientific_admission"] is False
          assert report["total_stress_energy_conservation_gate_closed"] is False
          assert report["source_provenance"]["source_commit_matches"] is True
          assert report["source_provenance"]["vendor_commit_matches"] is True
          assert report["source_provenance"]["source_blobs_match"] is True
          assert report["controls"]["all_profiles_finite"] is True
          assert report["energy_exchange_conversion"]["closure_passed"] is True
          assert report["controls"]["unit_lapse_control_closes"] is True
          assert report["controls"]["zero_radial_exchange_control_closes"] is True
          assert report["controls"]["sign_reversal_control_closes"] is True
          assert report["momentum_exchange_conversion"]["predicted_difference_closes"] is True
          assert report["momentum_exchange_conversion"]["mismatch_detected"] is True
          assert report["gate_result"]["scientific_admission"] is False
          print("SOURCE_COEFFICIENT_CONTROLS_OK; TOTAL_CONSERVATION=NOT_CLOSED; SCIENTIFIC_ADMISSION=NOT_ADMITTED")
          PY
