name: Diagnostic - CMC lapse operator on uniform quadrature profiles

on:
  push:
    branches:
      - diag/discrete-consistent-initial-production-test-2026-10-12
    paths:
      - tools/audit_cmc_lapse_uniform_quadrature.py
      - tools/audit_uniform_radial_quadrature_initial_profile.py
      - tools/origin_half_cell_quadrature_regularity_ab.py
      - .github/workflows/cmc-lapse-uniform-quadrature.yml

permissions:
  contents: read

concurrency:
  group: cmc-lapse-uniform-quadrature-2026-10-12
  cancel-in-progress: false

jobs:
  frozen-uniform-initial:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact production source and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          ref: 6d8b3f2790644591326df57c55908863f994cb0c
          path: source
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact production dependencies
        run: python -m pip install -r source/requirements.txt
      - name: Compile diagnostic
        run: |
          python -m py_compile tools/audit_cmc_lapse_uniform_quadrature.py
          python -m py_compile tools/audit_uniform_radial_quadrature_initial_profile.py
          python -m py_compile tools/origin_half_cell_quadrature_regularity_ab.py
      - name: Compare CMC and production operators on frozen uniform profiles
        run: python tools/audit_cmc_lapse_uniform_quadrature.py
      - name: Upload operator comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmc-lapse-uniform-quadrature-operator-compare
          path: results/cmc-lapse-uniform-quadrature-operator-compare/
          if-no-files-found: warn
          retention-days: 90
