name: Diagnostic - saved-state CMC operator contract one-step comparison

on:
  pull_request:
    paths:
      - tools/audit_cmc_operator_stage_one_step.py
      - tests/test_cmc_operator_stage_one_step.py
      - docs/research/pr415_native_operator_contract_2026-10-24.md
      - .github/workflows/cmc-operator-stage-one-step.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: cmc-operator-stage-one-step-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  saved-state-one-step:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: 120
            candidate_run_id: 40128647367
            baseline_artifact: evolved-origin-aa-regularity-N120-t0.6-2026-10-24
            candidate_artifact: origin-half-cell-candidate-N120-t0.6-2026-10-24
          - resolution: 240
            candidate_run_id: 40128647367
            baseline_artifact: evolved-origin-aa-regularity-N240-t0.6-2026-10-24
            candidate_artifact: origin-half-cell-candidate-N240-t0.6-2026-10-24

    steps:
      - name: Check out diagnostic branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download existing complete baseline checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.baseline_artifact }}
          path: baseline-reference/N${ matrix.resolution }}
          github-token: ${{ github.token }}
          run-id: 40127716287

      - name: Download existing complete origin-half-cell checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.candidate_artifact }}
          path: candidate-reference/N${ matrix.resolution }}
          github-token: ${{ github.token }}
          run-id: ${{ matrix.candidate_run_id }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install declared requirements
        run: python -m pip install -r requirements.txt

      - name: Compile source-pinned observer
        run: python -m py_compile tools/audit_cmc_operator_stage_one_step.py

      - name: Test stage capture and raw-operand update closure
        run: python -m pytest -q tests/test_cmc_operator_stage_one_step.py

      - name: Compare production and operator-compatible copied steps
        run: >-
          python tools/audit_cmc_operator_stage_one_step.py
          --resolution ${{ matrix.resolution }}
          --baseline baseline-reference/N${ matrix.resolution }}
          --candidate candidate-reference/N${ matrix.resolution }}
          --out results/cmc-operator-stage-one-step/N${ matrix.resolution }}/report.json

      - name: Upload one-step signed stage ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmc-operator-stage-one-step-N${ matrix.resolution }}
          path: results/cmc-operator-stage-one-step/N${ matrix.resolution }}/
          if-no-files-found: warn
          retention-days: 90
