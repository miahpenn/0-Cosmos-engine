name: Current-main fixed-coordinate Misner-Sharp RHS audit

on:
  push:
    branches:
      - diag/current-main-ms-fixed-r10-2026-10-13
    paths:
      - "tools/compare_current_main_ms_fixed_r10.py"
      - "tests/test_current_main_ms_fixed_r10.py"
      - ".github/workflows/current_main_ms_fixed_r10.yml"

permissions:
  contents: read

concurrency:
  group: current-main-ms-fixed-r10-2026-10-13
  cancel-in-progress: false

jobs:
  fixed-coordinate-r10:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      BASE_SOURCE_COMMIT: 7776a9156c24303c47a57e171a2d5997f6676668
      CANDIDATE_SOURCE_COMMIT: 3a845ec1ec903785e8dd3230ecd231ca9221ed44
      VENDOR_COMMIT: d6052d605673ce9d82cdc99b0df79855fa2ea215
    steps:
      - name: Checkout diagnostic harness and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify exact baseline, candidate initializer, CMC and vendor identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SOURCE_COMMIT" "$CANDIDATE_SOURCE_COMMIT"
          git cat-file -e "$BASE_SOURCE_COMMIT^{commit}"
          git cat-file -e "$CANDIDATE_SOURCE_COMMIT^{commit}"
          git merge-base --is-ancestor "$BASE_SOURCE_COMMIT" HEAD
          test -z "$(git diff --name-only "$BASE_SOURCE_COMMIT" HEAD -- engine/)"
          test "$(git rev-parse HEAD:engine/production_kernel.py)" = "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/production_kernel.py")"
          test "$(git rev-parse HEAD:engine/matter_system.py)" = "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/matter_system.py")"
          test "$(git rev-parse HEAD:engine/valencia.py)" = "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/valencia.py")"
          test "$(git rev-parse HEAD:engine/scalar_system.py)" = "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/scalar_system.py")"
          test "$(git rev-parse HEAD:engine/worldtube.py)" = "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/worldtube.py")"
          test "$(git rev-parse HEAD:engine/cmc_gauge.py)" = "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/cmc_gauge.py")"
          test "$(git rev-parse HEAD:engine/v55_initial.py)" = "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/v55_initial.py")"
          test "$(git rev-parse HEAD:requirements.txt)" = "$(git rev-parse "$BASE_SOURCE_COMMIT:requirements.txt")"
          test "$(git rev-parse "$BASE_SOURCE_COMMIT:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          test "$(git rev-parse "$CANDIDATE_SOURCE_COMMIT:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          test "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/v55_initial.py")" = "4cfbfe4be6ac3ce6ed492f4e435186997d94116a"
          test "$(git rev-parse "$CANDIDATE_SOURCE_COMMIT:engine/v55_initial.py")" = "2e5c41c10d4bbb53df3d7299b898e97f3239c120"
          test "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/cmc_gauge.py")" = "b1e6b3e95ff37702509e1b38ec6401d10e2482c3"
          printf 'BASE_SOURCE_COMMIT=%s\nCANDIDATE_SOURCE_COMMIT=%s\nVENDOR_COMMIT=%s\n' "$BASE_SOURCE_COMMIT" "$CANDIDATE_SOURCE_COMMIT" "$VENDOR_COMMIT"
          python -m py_compile tools/compare_current_main_ms_fixed_r10.py tests/test_current_main_ms_fixed_r10.py

      - name: Run direct-rate and initial-quadrature contract tests
        run: python -m pytest -q tests/test_current_main_ms_fixed_r10.py

      - name: Prepare isolated baseline worktree
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/results/current-main-ms-fixed-r10"
          WORKTREE="$RUNNER_TEMP/cosmos-current-main-ms-fixed-r10"
          mkdir -p "$OUT"
          git worktree add --detach "$WORKTREE" "$BASE_SOURCE_COMMIT"
          git -C "$WORKTREE" submodule update --init --recursive
          mkdir -p "$WORKTREE/tools"
          cp tools/compare_current_main_ms_fixed_r10.py "$WORKTREE/tools/compare_current_main_ms_fixed_r10.py"
          test "$(git -C "$WORKTREE" rev-parse HEAD)" = "$BASE_SOURCE_COMMIT"
          test "$(git -C "$WORKTREE" rev-parse HEAD:vendor/bb-palatini-unified-r0)" = "$VENDOR_COMMIT"

      - name: Run matched baseline and quadrature-only arms at fixed coordinate r=10
        shell: bash
        run: |
          set -euo pipefail
          WORKTREE="$RUNNER_TEMP/cosmos-current-main-ms-fixed-r10"
          OUT="$GITHUB_WORKSPACE/results/current-main-ms-fixed-r10"
          run_arm() {
            arm="$1"
            label="$2"
            git -C "$WORKTREE" checkout -- engine/v55_initial.py engine/cmc_gauge.py
            if [ "$arm" = "quadrature_only" ]; then
              git -C "$WORKTREE" show "$CANDIDATE_SOURCE_COMMIT:engine/v55_initial.py" > "$WORKTREE/engine/v55_initial.py"
            fi
            local_rc=0
            (
              cd "$WORKTREE"
              ARM_SOURCE_COMMIT="$label" PYTHONPATH=. python tools/compare_current_main_ms_fixed_r10.py --mode arm --arm "$arm" --output "$OUT/$arm.json"
            ) || local_rc=$?
            printf '%s\t%s\n' "$arm" "$local_rc" >> "$OUT/ARM_EXIT_CODES.tsv"
          }
          run_arm baseline "$BASE_SOURCE_COMMIT"
          run_arm quadrature_only "hybrid:baseline-plus-candidate-initializer"
          if grep -q "^baseline$(printf '\t')0$" "$OUT/ARM_EXIT_CODES.tsv" && grep -q "^quadrature_only$(printf '\t')0$" "$OUT/ARM_EXIT_CODES.tsv"; then
            (
              cd "$WORKTREE"
              PYTHONPATH=. python tools/compare_current_main_ms_fixed_r10.py --mode combine --baseline-report "$OUT/baseline.json" --candidate-report "$OUT/quadrature_only.json" --output "$OUT/fixed_r10_ab_report.json"
            )
          else
            echo "One or both arms did not complete; the strict comparison was not generated." >&2
            exit 1
          fi

      - name: Record report digests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/results/current-main-ms-fixed-r10"
          mkdir -p "$OUT"
          printf '%s\n' "$BASE_SOURCE_COMMIT" > "$OUT/BASE_SOURCE_COMMIT.txt"
          printf '%s\n' "$CANDIDATE_SOURCE_COMMIT" > "$OUT/CANDIDATE_SOURCE_COMMIT.txt"
          printf '%s\n' "$VENDOR_COMMIT" > "$OUT/VENDOR_COMMIT.txt"
          git rev-parse HEAD > "$OUT/DIAGNOSTIC_COMMIT.txt"
          if test -f "$OUT/fixed_r10_ab_report.json"; then
            (cd "$OUT" && sha256sum baseline.json quadrature_only.json fixed_r10_ab_report.json > SHA256SUMS.txt)
          fi

      - name: Upload all artifacts, including failed-arm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-ms-fixed-r10
          path: results/current-main-ms-fixed-r10/
          if-no-files-found: warn
          retention-days: 90
