name: "[0star] Radiation predictor stage trace (diagnostic only)"

on:
  workflow_dispatch:
  push:
    branches:
      - 0star-central-clock

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  radiation-stage-trace:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-radiation-stage-trace]')
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Checkout engine and pinned numerical operators
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Repository tests
        run: python -m pytest -q

      - name: Run diagnostic-only radiation predictor trace
        run: python -m engine.radiation_geometry_stage_trace

      - name: Upload complete radiation stage trace
        uses: actions/upload-artifact@v4
        with:
          name: 0star-radiation-stage-trace
          path: runs/radiation-stage-trace/
          if-no-files-found: error
