name: Radiation RHS guard repair gate

on:
  push:
    branches:
      - fix/radiation-rhs-admissibility-contract-2026-10-12
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radiation-rhs-guard-repair-gate
  cancel-in-progress: false

jobs:
  repair-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Radiation RHS contract and N=160 real-step regression
        run: python -m pytest -q tests/test_radiation_rhs_admissibility_contract.py
      - name: Full repository test suite
        run: python -m pytest -q
