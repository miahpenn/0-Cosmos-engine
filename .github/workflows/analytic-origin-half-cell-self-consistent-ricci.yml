name: Research - analytic half-cell self-consistent Ricci response

on:
  push:
    branches:
      - research/continuous-integral-self-consistent-ricci-2026-10-15
    paths:
      - tools/audit_analytic_origin_half_cell_self_consistent_response.py
      - tools/audit_manufactured_lambda_symbol_response.py
      - tools/audit_coupled_lambda_constraint_propagation.py
      - tools/audit_lambda_offmode_amplitude_stress.py
      - tools/audit_lambda_center_tangent_resolution.py
      - tests/test_coupled_lambda_constraint_propagation.py
      - tests/test_lambda_offmode_signed_parity.py
      - tests/test_lambda_center_tangent_resolution.py
      - tests/test_manufactured_lambda_symbol_response.py
      - tools/audit_current_main_centre_proper_radial_ricci.py
      - tools/audit_continuous_origin_half_cell_oracle.py
      - tests/test_analytic_origin_half_cell_self_consistent_response.py
      - .github/workflows/analytic-origin-half-cell-self-consistent-ricci.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/audit_analytic_origin_half_cell_self_consistent_response.py
      - tools/audit_manufactured_lambda_symbol_response.py
      - tools/audit_coupled_lambda_constraint_propagation.py
      - tools/audit_lambda_offmode_amplitude_stress.py
      - tests/test_coupled_lambda_constraint_propagation.py
      - tests/test_lambda_offmode_signed_parity.py
      - tests/test_manufactured_lambda_symbol_response.py
      - tools/audit_current_main_centre_proper_radial_ricci.py
      - tools/audit_continuous_origin_half_cell_oracle.py
      - tests/test_analytic_origin_half_cell_self_consistent_response.py
      - .github/workflows/analytic-origin-half-cell-self-consistent-ricci.yml

permissions:
  contents: read

concurrency:
  group: analytic-origin-half-cell-self-consistent-ricci-2026-10-15
  cancel-in-progress: false

jobs:
  copied-initializer-analytic-half-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "285a2ee0c1a3b97cddeb4519d8e749109b115aab"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
      ANALYTIC_SC_OUT: "results/analytic-origin-half-cell-self-consistent-ricci-2026-10-15"
      LAMBDA_SYMBOL_OUT: "results/manufactured-lambda-symbol-sweep-2026-10-15"
      COUPLED_LAMBDA_OUT: "results/coupled-lambda-constraint-propagation-2026-10-15"
      LAMBDA_STRESS_OUT: "results/lambda-offmode-amplitude-stress-2026-10-15"
      LAMBDA_CENTER_OUT: "results/lambda-center-tangent-resolution-2026-10-15"
    steps:
      - name: Check out research branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository requirements
        run: python -m pip install -r requirements.txt

      - name: Verify pinned engine source, vendor, and dependency boundary
        run: |
          python - <<'PY'
          import json
          from tools.audit_current_main_centre_proper_radial_ricci import _verify_source_pins
          pins = _verify_source_pins()
          print(json.dumps(pins, indent=2))
          assert pins["source_commit"] == "285a2ee0c1a3b97cddeb4519d8e749109b115aab"
          assert pins["vendor_commit"] == "d6052d605673ce9d82cdc99b0df79855fa2ea215"
          assert pins["engine_vendor_dependency_diff_empty"] is True
          assert all(row["matches"] for row in pins["source_blobs"].values())
          PY

      - name: Compile diagnostic and regression tests
        run: |
          python -m py_compile tools/audit_analytic_origin_half_cell_self_consistent_response.py
          python -m py_compile tools/audit_manufactured_lambda_symbol_response.py
          python -m py_compile tests/test_manufactured_lambda_symbol_response.py
          python -m py_compile tools/audit_coupled_lambda_constraint_propagation.py
          python -m py_compile tools/audit_lambda_offmode_amplitude_stress.py
          python -m py_compile tests/test_lambda_offmode_signed_parity.py
          python -m py_compile tools/audit_lambda_center_tangent_resolution.py
          python -m py_compile tests/test_lambda_center_tangent_resolution.py
          python -m py_compile tests/test_coupled_lambda_constraint_propagation.py
          python -m py_compile tools/audit_current_main_centre_proper_radial_ricci.py
          python -m py_compile tools/audit_continuous_origin_half_cell_oracle.py
          python -m py_compile tests/test_analytic_origin_half_cell_self_consistent_response.py

      - name: Run complete repository regression suite
        run: python -m pytest -q

      - name: Run focused analytic-response, constraint, Lambda-symbol and signed Lambda parity tests
        run: python -m pytest -q tests/test_analytic_origin_half_cell_self_consistent_response.py tests/test_manufactured_lambda_symbol_response.py tests/test_coupled_lambda_constraint_propagation.py tests/test_lambda_offmode_signed_parity.py tests/test_lambda_center_tangent_resolution.py

      - name: Run lower/nominal/upper analytic half-cell self-consistent counterfactual
        run: python tools/audit_analytic_origin_half_cell_self_consistent_response.py

      - name: Run manufactured odd-Lambda derivative symbol sweep
        run: python tools/audit_manufactured_lambda_symbol_response.py

      - name: Run coupled one-step off-constraint Lambda propagation control
        run: python tools/audit_coupled_lambda_constraint_propagation.py

      - name: Run bounded Lambda off-mode amplitude stress sweep
        run: python tools/audit_lambda_offmode_amplitude_stress.py

      - name: Upload signed Ricci and constraint witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytic-origin-half-cell-self-consistent-ricci-2026-10-15
          path: results/analytic-origin-half-cell-self-consistent-ricci-2026-10-15/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload manufactured Lambda symbol and response profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manufactured-lambda-symbol-sweep-2026-10-15
          path: results/manufactured-lambda-symbol-sweep-2026-10-15/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload coupled Lambda constraint-propagation profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupled-lambda-constraint-propagation-2026-10-15
          path: results/coupled-lambda-constraint-propagation-2026-10-15/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Lambda off-mode amplitude stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lambda-offmode-amplitude-stress-2026-10-15
          path: results/lambda-offmode-amplitude-stress-2026-10-15/
          if-no-files-found: warn
          retention-days: 90

      - name: Run centre-cell signed tangent budget at two resolutions
        run: python tools/audit_lambda_center_tangent_resolution.py

      - name: Upload centre-cell tangent/resolution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lambda-center-tangent-resolution-2026-10-15
          path: results/lambda-center-tangent-resolution-2026-10-15/
          if-no-files-found: warn
          retention-days: 90
