name: Diagnostic - evolved-origin A_a regularity source budget

on:
  pull_request:
    paths:
      - tools/audit_evolved_origin_aa_regularity.py
      - .github/workflows/evolved-origin-aa-regularity.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: origin-half-cell-candidate-evolution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  origin-half-cell-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        resolution: [120, 240]
    env:
      PYTHONUNBUFFERED: "1"
      REGULARITY_RESOLUTION: ${{ matrix.resolution }}
      REGULARITY_R_MAX: "80.0"
      REGULARITY_TARGET_TIME: "0.6"
      REGULARITY_CFL: "0.03"
      REGULARITY_FIT_R_MAX: "8.0"
      REGULARITY_FIT_DEGREE: "3"
      REGULARITY_BASELINE_REFERENCE_DIR: baseline-reference/N${{ matrix.resolution }}
      REGULARITY_OUT: results/origin-half-cell-candidate-N${{ matrix.resolution }}-t0.6-2026-10-24

    steps:
      - name: Check out diagnostic branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download existing exact-source baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: evolved-origin-aa-regularity-N${{ matrix.resolution }}-t0.6-2026-10-24
          path: baseline-reference/N${{ matrix.resolution }}
          github-token: ${{ github.token }}
          run-id: 40127716287

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository requirements
        run: python -m pip install -r requirements.txt

      - name: Compile source-pinned observer
        run: python -m py_compile tools/audit_evolved_origin_aa_regularity.py

      - name: Verify baseline artifact and evolve origin-half-cell candidate
        run: python tools/audit_evolved_origin_aa_regularity.py

      - name: Upload candidate state, stage profiles and paired comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origin-half-cell-candidate-N${{ matrix.resolution }}-t0.6-2026-10-24
          path: results/origin-half-cell-candidate-N${{ matrix.resolution }}-t0.6-2026-10-24/
          if-no-files-found: warn
          retention-days: 90
