name: Diagnostic - evolved-origin A_a regularity source budget

on:
  pull_request:
    paths:
      - tools/audit_evolved_origin_aa_regularity.py
      - .github/workflows/evolved-origin-aa-regularity.yml

permissions:
  contents: read

concurrency:
  group: evolved-origin-aa-regularity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  production-origin-regularity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        resolution: [60, 120, 240]
    env:
      PYTHONUNBUFFERED: "1"
      REGULARITY_RESOLUTION: ${{ matrix.resolution }}
      REGULARITY_R_MAX: "80.0"
      REGULARITY_TARGET_TIME: "0.6"
      REGULARITY_CFL: "0.03"
      REGULARITY_FIT_R_MAX: "8.0"
      REGULARITY_FIT_DEGREE: "3"
      REGULARITY_OUT: results/evolved-origin-aa-regularity-N${{ matrix.resolution }}-t0.6-2026-10-24

    steps:
      - name: Check out the diagnostic branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository requirements
        run: python -m pip install -r requirements.txt

      - name: Compile source-pinned observer
        run: python -m py_compile tools/audit_evolved_origin_aa_regularity.py

      - name: Run production evolution and capture signed centre-source budget
        run: python tools/audit_evolved_origin_aa_regularity.py

      - name: Upload source, stage histories, checkpoint and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolved-origin-aa-regularity-N${{ matrix.resolution }}-t0.6-2026-10-24
          path: results/evolved-origin-aa-regularity-N${{ matrix.resolution }}-t0.6-2026-10-24/
          if-no-files-found: warn
          retention-days: 90
