name: "[0star] Discrete-consistent initial data review (diagnostic only)"

on:
  push:
    branches:
      - diag/discrete-consistent-initial-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discrete-consistent-initial-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout review branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run candidate initializer tests
        run: python -m pytest -q tests/test_discrete_consistent_initial.py
