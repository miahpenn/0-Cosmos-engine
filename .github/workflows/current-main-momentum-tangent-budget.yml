name: Current-main momentum constraint tangent budget

on:
  pull_request:
    paths:
      - "tools/audit_current_source_momentum_constraint_tangent.py"
      - "tools/manufactured_momentum_tangent_audit.py"
      - "tools/momentum_constraint_chain_rule.py"
      - "tests/test_research_momentum_constraint_chain_rule.py"
      - ".github/workflows/current-main-momentum-tangent-budget.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-main-momentum-tangent-budget
  cancel-in-progress: true

jobs:
  bounded-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "34ad06539c867b2a7ed40c2e1534a3a9d157b82f"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
    steps:
      - name: Check out diagnostic PR tree and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out exact current-main production source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Fail closed on exact source and vendor pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          printf 'PRODUCTION_SOURCE=%s\\n' "$(git -C source rev-parse HEAD)"
          printf 'VENDOR_SOURCE=%s\\n' "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)"
          printf 'DIAGNOSTIC_HEAD=%s\\n' "$(git rev-parse HEAD)"
          printf 'PINNED_ENGINE_BLOBS_VERIFIED_BY_AUDIT=1\\n'

      - name: Verify discrete chain rule and signed-term negative control
        run: python -m pytest -q tests/test_research_momentum_constraint_chain_rule.py

      - name: Compile both read-only auditors
        run: |
          python -m py_compile tools/manufactured_momentum_tangent_audit.py
          python -m py_compile tools/audit_current_source_momentum_constraint_tangent.py
          python -m py_compile tools/momentum_constraint_chain_rule.py

      - name: Run manufactured regular-profile parity and tangent audit first (zero production steps)
        id: manufactured
        continue-on-error: true
        run: |
          mkdir -p results/manufactured-momentum-tangent
          python tools/manufactured_momentum_tangent_audit.py --output-dir results/manufactured-momentum-tangent

      - name: Run exact-current-source frozen-state signed tangent budget
        id: production
        if: always()
        continue-on-error: true
        run: |
          mkdir -p results/current-source-momentum-tangent
          COSMOS_PINNED_SOURCE_ROOT="$GITHUB_WORKSPACE/source" python tools/audit_current_source_momentum_constraint_tangent.py \
            --resolutions 60 80 120 \
            --r-max 80 \
            --dt 0.015 \
            --epsilons 0.00002 0.00001 \
            --output results/current-source-momentum-tangent/report.json

      - name: Hash all retained diagnostic outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find results -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > results/SHA256SUMS.txt

      - name: Upload signed budgets and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-momentum-tangent-budget
          path: results/
          if-no-files-found: warn
          retention-days: 90

      - name: Require both diagnostic executions to complete
        if: always()
        shell: bash
        env:
          MANUFACTURED_OUTCOME: ${{ steps.manufactured.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
        run: |
          test "$MANUFACTURED_OUTCOME" = "success"
          test "$PRODUCTION_OUTCOME" = "success"
