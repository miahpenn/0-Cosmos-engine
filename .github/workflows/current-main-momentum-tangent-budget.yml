name: Current-main momentum constraint tangent budget

on:
  pull_request:
    paths:
      - "tools/audit_current_source_momentum_constraint_tangent.py"
      - "tests/test_constraint_source_normalization_contract.py"
      - "tools/audit_brown_vacuum_momentum_propagation.py"
      - "tools/audit_primary_l3_matter_closure.py"
      - "tools/momentum_constraint_chain_rule.py"
      - "tests/test_research_momentum_constraint_chain_rule.py"
      - "tools/manufactured_momentum_tangent_audit.py"
      - ".github/workflows/current-main-momentum-tangent-budget.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-main-momentum-tangent-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "7f47669a1c0edfafef9fc5f27b2db80840d3f035"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
    steps:
      - name: Check out diagnostic PR tree and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out exact current-main production source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Fail closed on exact source and vendor pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          printf 'PRODUCTION_SOURCE=%s\n' "$(git -C source rev-parse HEAD)"
          printf 'VENDOR_SOURCE=%s\n' "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)"
          printf 'DIAGNOSTIC_HEAD=%s\n' "$(git rev-parse HEAD)"
          for path in engine/production_kernel.py engine/matter_system.py engine/matter_rhs.py engine/scalar_system.py engine/v55_matter.py engine/v55_pirk_adapter.py engine/cmc_gauge.py engine/v55_initial.py engine/stress_energy.py engine/valencia.py engine/worldtube.py; do
            test "$(git rev-parse "HEAD:$path")" = "$(git -C source rev-parse "HEAD:$path")"
          done

      - name: Compile both read-only auditors
        run: |
          python -m py_compile tools/manufactured_momentum_tangent_audit.py
          python -m py_compile tools/audit_current_source_momentum_constraint_tangent.py
          python -m py_compile tools/audit_brown_vacuum_momentum_propagation.py
          python -m py_compile tools/audit_primary_l3_matter_closure.py
          python -m py_compile tools/momentum_constraint_chain_rule.py
          python -m py_compile tests/test_research_momentum_constraint_chain_rule.py

      - name: Run frozen constraint source sign/consumer-factor contract
        run: |
          python -m pytest -q tests/test_constraint_source_normalization_contract.py


      - name: Verify discrete chain rule and signed-term negative control
        run: python -m pytest -q tests/test_research_momentum_constraint_chain_rule.py

      - name: Run independent vacuum Brown propagation discriminator on manufactured regular states
        id: brown
        continue-on-error: true
        run: |
          mkdir -p results/brown-vacuum-propagation
          python tools/audit_brown_vacuum_momentum_propagation.py \
            --resolutions 40 60 80 120 160 \
            --r-max 40 \
            --epsilons 0.00002 0.00001 \
            --output-dir results/brown-vacuum-propagation

      - name: Run manufactured regular-profile parity and tangent audit first (zero production steps)
        id: manufactured
        continue-on-error: true
        run: |
          mkdir -p results/manufactured-momentum-tangent
          python tools/manufactured_momentum_tangent_audit.py --output-dir results/manufactured-momentum-tangent

      - name: Run exact-current-source frozen-state signed tangent budget
        id: production
        if: always()
        continue-on-error: true
        run: |
          mkdir -p results/current-source-momentum-tangent
          python tools/audit_current_source_momentum_constraint_tangent.py \
            --resolutions 60 80 120 \
            --r-max 80 \
            --dt 0.015 \
            --epsilons 0.00002 0.00001 \
            --output results/current-source-momentum-tangent/report.json

      - name: Run full-grid matter L3 source closure in both initialization arms
        id: matter_l3
        if: always()
        continue-on-error: true
        run: |
          mkdir -p results/primary-l3-matter-closure
          COSMOS_PINNED_SOURCE_ROOT="$GITHUB_WORKSPACE/source" python tools/audit_primary_l3_matter_closure.py \
            --resolutions 40 60 80 120 160 \
            --r-max 80 \
            --output-dir results/primary-l3-matter-closure

      - name: Hash all retained diagnostic outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find results -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > results/SHA256SUMS.txt

      - name: Upload signed budgets and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-momentum-tangent-budget
          path: results/
          if-no-files-found: warn
          retention-days: 90

      - name: Require all diagnostic executions to complete
        if: always()
        shell: bash
        env:
          BROWN_OUTCOME: ${{ steps.brown.outcome }}
          MANUFACTURED_OUTCOME: ${{ steps.manufactured.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
          MATTER_L3_OUTCOME: ${{ steps.matter_l3.outcome }}
        run: |
          test "$BROWN_OUTCOME" = "success"
          test "$MANUFACTURED_OUTCOME" = "success"
          test "$PRODUCTION_OUTCOME" = "success"
          test "$MATTER_L3_OUTCOME" = "success"
