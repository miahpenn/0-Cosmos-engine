name: "[CI] CMC cell-centred lapse row fix"

on:
  push:
    branches:
      - fix/cmc-cellcenter-row-2026-10-12
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate and pinned kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Focused CMC row regression
        run: python -m pytest -q tests/test_cmc_lapse_cellcenter_row_repair.py
      - name: Full repository regression suite
        run: python -m pytest -q
