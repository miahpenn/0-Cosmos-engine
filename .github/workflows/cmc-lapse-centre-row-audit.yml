name: Diagnostic - CMC lapse centre row audit

on:
  push:
    branches:
      - "diag/independent-metric-ricci-audit"
    paths:
      - "diagnostics/cmc_lapse_centre_row_audit.py"
      - ".github/workflows/cmc-lapse-centre-row-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-centre-row:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout diagnostic branch and pinned vendor
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and verify exact archived R80/R160 profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r80 /tmp/r160 artifacts/r80 artifacts/r160
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/miahpenn/0-Cosmos-engine/actions/artifacts/11710858125/zip" -o /tmp/r80/artifact.zip
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/miahpenn/0-Cosmos-engine/actions/artifacts/11694568292/zip" -o /tmp/r160/artifact.zip
          echo "decb775cc8d3b72f97ba9c0278aa3e23b8248b51b9c786c4344052e682ed9745  /tmp/r80/artifact.zip" | sha256sum -c -
          echo "04949c7e0332c495385f6afef231b54270225892b1d124f2c19973c7d5b4872d  /tmp/r160/artifact.zip" | sha256sum -c -
          unzip -q /tmp/r80/artifact.zip -d artifacts/r80
          unzip -q /tmp/r160/artifact.zip -d artifacts/r160
          find artifacts/r80 -type f -name 'boundary_matched_r80_profiles.jsonl' -print -quit > /tmp/r80/path.txt
          find artifacts/r160 -type f -name 'frozen_state_crop_profiles.jsonl' -print -quit > /tmp/r160/path.txt
          test -s /tmp/r80/path.txt
          test -s /tmp/r160/path.txt
      - name: Run frozen CMC lapse centre-row audit
        run: |
          python diagnostics/cmc_lapse_centre_row_audit.py \
            "$(cat /tmp/r80/path.txt)" "$(cat /tmp/r160/path.txt)"
      - name: Upload centre-row audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmc-lapse-centre-row-audit
          path: runs/cmc_lapse_centre_row_audit/
          if-no-files-found: warn
          retention-days: 90
