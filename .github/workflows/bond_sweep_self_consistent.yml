name: Diagnostic - self-consistent S-D bond sweep

on:
  push:
    branches: [diag/bond-sweep-self-consistent]

jobs:
  bond-sweep:
    if: contains(github.event.head_commit.message, '[bond-sweep-self-consistent]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run self-consistent diagnostic sweep
        run: python diagnostics/bond_sweep/bond_sweep.py
      - name: Upload sweep outputs
        uses: actions/upload-artifact@v4
        with:
          name: bond-sweep-self-consistent
          path: runs/bond_sweep/
          if-no-files-found: error
