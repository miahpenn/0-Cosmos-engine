name: "[0star] full production-COSMOS bidirectional consistency"

on:
  workflow_dispatch:
  push:
    branches:
      - 0star-central-clock

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-bidirectional]')
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run repository tests
        run: python -m pytest -q

      - name: Run full production-COSMOS bidirectional audit
        run: python -m engine.production_cosmos_bidirectional

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: 0star-production-cosmos-bidirectional
          path: runs/production-cosmos-bidirectional/report.json
          if-no-files-found: error
