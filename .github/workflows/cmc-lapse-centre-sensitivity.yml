name: CMC lapse centre sensitivity

on:
  pull_request:
    paths:
      - "tools/audit_cmc_lapse_centre_sensitivity.py"
      - "tools/audit_current_source_momentum_constraint_tangent.py"
      - ".github/workflows/cmc-lapse-centre-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmc-lapse-centre-sensitivity
  cancel-in-progress: true

jobs:
  bounded-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_COMMIT: "7f47669a1c0edfafef9fc5f27b2db80840d3f035"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out diagnostic PR tree and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out exact production source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install pinned production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Fail closed on source and vendor pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          printf 'PRODUCTION_SOURCE=%s\n' "$(git -C source rev-parse HEAD)"
          printf 'VENDOR_SOURCE=%s\n' "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)"
          printf 'DIAGNOSTIC_HEAD=%s\n' "$(git rev-parse HEAD)"
          for path in engine/production_kernel.py engine/matter_system.py engine/matter_rhs.py engine/scalar_system.py engine/v55_matter.py engine/v55_pirk_adapter.py engine/cmc_gauge.py engine/v55_initial.py engine/stress_energy.py engine/valencia.py engine/worldtube.py; do
            test "$(git rev-parse "HEAD:$path")" = "$(git -C source rev-parse "HEAD:$path")"
          done

      - name: Compile diagnostic tools
        run: |
          python -m py_compile tools/audit_current_source_momentum_constraint_tangent.py
          python -m py_compile tools/audit_cmc_lapse_centre_sensitivity.py

      - name: Run centre lapse-series and flattened-profile RHS control
        id: audit
        continue-on-error: true
        run: |
          mkdir -p artifacts/cmc-lapse-centre-sensitivity
          python tools/audit_cmc_lapse_centre_sensitivity.py \
            --resolutions 60 80 120 160 \
            --r-max 80 \
            --epsilons 0.00002 0.00001 \
            --flat-radius 2.0 \
            --taper-radius 5.0 \
            --output artifacts/cmc-lapse-centre-sensitivity/report.json

      - name: Hash retained diagnostic outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find artifacts/cmc-lapse-centre-sensitivity -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > artifacts/cmc-lapse-centre-sensitivity/SHA256SUMS.txt

      - name: Upload lapse series, signed budgets, and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmc-lapse-centre-sensitivity
          path: artifacts/cmc-lapse-centre-sensitivity/
          if-no-files-found: warn
          retention-days: 90

      - name: Require diagnostic closure
        if: always()
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          test "$AUDIT_OUTCOME" = "success"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/cmc-lapse-centre-sensitivity/report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report.get("status") == "completed_diagnostic_only", report.get("status")
          assert report.get("closures", {}).get("production_CMC_alpha_RHS_tangent") is True
          assert report.get("closures", {}).get("flattened_alpha_RHS_tangent") is True
          assert report.get("scientific_admission") is False
          assert all(row.get("input_mutation_check", {}).get("production_state_unchanged") is True for row in report["resolutions"])
          print("DIAGNOSTIC_CLOSURE_OK")
          PY
