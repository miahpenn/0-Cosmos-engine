name: Strict JSON residual reporting contract

on:
  push:
    branches:
      - integrate/strict-campaign-radiation-main-2026-10-13
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: strict-json-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete repository suite
        run: python -m pytest -q
