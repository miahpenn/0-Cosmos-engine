name: Diagnostic - matched one-step uniform radial quadrature

on:
  push:
    branches:
      - diag/discrete-consistent-initial-production-test-2026-10-12
    paths:
      - tools/audit_uniform_radial_quadrature_one_step.py
      - tools/audit_uniform_radial_quadrature_initial_profile.py
      - tools/origin_half_cell_quadrature_regularity_ab.py
      - .github/workflows/uniform-radial-quadrature-one-step.yml

permissions:
  contents: read

concurrency:
  group: uniform-radial-quadrature-one-step-2026-10-12
  cancel-in-progress: false

jobs:
  matched-one-step:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact production source and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          ref: 6d8b3f2790644591326df57c55908863f994cb0c
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Compile matched one-step diagnostics
        run: |
          python -m py_compile tools/audit_uniform_radial_quadrature_one_step.py
          python -m py_compile tools/audit_uniform_radial_quadrature_initial_profile.py
          python -m py_compile tools/origin_half_cell_quadrature_regularity_ab.py

      - name: Run one ordinary production step for each initializer
        run: python tools/audit_uniform_radial_quadrature_one_step.py

      - name: Upload before/after constraint and centre-series witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniform-radial-quadrature-one-step
          path: results/uniform-radial-quadrature-one-step/
          if-no-files-found: warn
          retention-days: 90
