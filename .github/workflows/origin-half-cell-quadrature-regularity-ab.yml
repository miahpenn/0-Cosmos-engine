name: Diagnostic - regular-origin half-cell quadrature A/B

on:
  push:
    branches:
      - diag/origin-quadrature-regularity-2026-10-12
    paths:
      - tools/origin_half_cell_quadrature_regularity_ab.py
      - .github/workflows/origin-half-cell-quadrature-regularity-ab.yml

permissions:
  contents: read

concurrency:
  group: origin-half-cell-quadrature-regularity-ab
  cancel-in-progress: true

jobs:
  origin-quadrature-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact production source and pinned vendor
        uses: actions/checkout@v4
        with:
          ref: 6d8b3f2790644591326df57c55908863f994cb0c
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Compile diagnostic
        run: python -m py_compile tools/origin_half_cell_quadrature_regularity_ab.py

      - name: Compare pinned and centre-series quadrature initializers
        run: python tools/origin_half_cell_quadrature_regularity_ab.py

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origin-half-cell-quadrature-regularity-ab
          path: results/origin-half-cell-quadrature-regularity/
          if-no-files-found: warn
          retention-days: 90
