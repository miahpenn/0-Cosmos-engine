name: Diagnostic - CMC solver versus production K RHS compatibility

on:
  push:
    branches:
      - diag/lambda-metric-connection-rhs-2026-10-12
    paths:
      - tools/audit_cmc_K_rhs_discrete_compatibility.py
      - .github/workflows/cmc-K-rhs-discrete-compatibility.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: cmc-K-rhs-discrete-compatibility-2026-10-12
  cancel-in-progress: false

jobs:
  frozen-state-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .:source
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout diagnostic tool
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact production source and pinned vendor
        uses: actions/checkout@v4
        with:
          ref: 6d8b3f2790644591326df57c55908863f994cb0c
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Download matched spatial-refinement checkpoints at t=2.16
        uses: actions/download-artifact@v4
        with:
          name: lambda-spatial-refinement-t2p16
          path: spatial-artifact
          repository: miahpenn/0-Cosmos-engine
          run-id: 38212879394
          github-token: ${{ github.token }}

      - name: Download admitted production checkpoints through t=12
        uses: actions/download-artifact@v4
        with:
          name: v55-production-t12-n40-n60-n80
          path: runs/t12
          repository: miahpenn/0-Cosmos-engine
          run-id: 38208253687
          github-token: ${{ github.token }}

      - name: Compile CMC compatibility audit
        run: python -m py_compile tools/audit_cmc_K_rhs_discrete_compatibility.py

      - name: Audit frozen CMC lapse and production K RHS
        run: python tools/audit_cmc_K_rhs_discrete_compatibility.py

      - name: Upload discrete compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmc-K-rhs-discrete-compatibility
          path: results/cmc-K-rhs-discrete-compatibility/
          if-no-files-found: warn
          retention-days: 90
