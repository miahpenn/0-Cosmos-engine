name: Current-source momentum-constraint tangent audit

on:
  pull_request:
    paths:
      - "tools/audit_current_source_momentum_constraint_tangent.py"
      - ".github/workflows/current_source_momentum_constraint_tangent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-source-momentum-tangent-audit
  cancel-in-progress: true

jobs:
  frozen-initial-tangent:
    name: Frozen initial-state signed M-dot audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out source and pinned geometry vendor
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install engine dependencies
        run: python -m pip install -r requirements.txt

      - name: Run exact-source bounded tangent and common-time one-step checks
        run: |
          set -o pipefail
          mkdir -p results/current-source-momentum-tangent
          python tools/audit_current_source_momentum_constraint_tangent.py \
            --resolutions 60 80 120 \
            --r-max 80 \
            --dt 0.015 \
            --epsilons 0.00002 0.00001 \
            --output results/current-source-momentum-tangent/report.json \
            2>&1 | tee results/current-source-momentum-tangent/console.txt

      - name: Preserve report even on a failed diagnostic gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-source-momentum-constraint-tangent
          path: results/current-source-momentum-tangent/
          if-no-files-found: warn
          retention-days: 14
