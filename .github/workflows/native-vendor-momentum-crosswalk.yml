name: Research - native/vendor momentum geometry crosswalk

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/audit_native_vendor_momentum_crosswalk.py
      - .github/workflows/native-vendor-momentum-crosswalk.yml
      - engine/native_geometry/**
      - engine/production_kernel.py
      - engine/v55_pirk_adapter.py
      - vendor/**
      - .gitmodules
      - requirements.txt

permissions:
  contents: read

concurrency:
  group: native-vendor-momentum-crosswalk
  cancel-in-progress: false

jobs:
  crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out PR and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository requirements
        run: python -m pip install -r requirements.txt

      - name: Verify recorded vendor pin
        shell: bash
        run: |
          actual="$(git rev-parse HEAD:vendor/bb-palatini-unified-r0)"
          expected="d6052d605673ce9d82cdc99b0df79855fa2ea215"
          test "$actual" = "$expected" || {
            echo "vendor pin mismatch: expected $expected, found $actual"
            exit 1
          }

      - name: Compile and run same-grid geometry-only crosswalk
        run: |
          python -m py_compile tools/audit_native_vendor_momentum_crosswalk.py
          python tools/audit_native_vendor_momentum_crosswalk.py

      - name: Upload signed crosswalk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-vendor-momentum-crosswalk
          path: results/native-vendor-momentum-crosswalk/
          if-no-files-found: warn
          retention-days: 90
