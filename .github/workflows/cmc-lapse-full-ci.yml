name: "[CI] Full regressions for CMC cell-centred lapse candidate"

on:
  push:
    branches:
      - diag/cmc-lapse-full-ci-2026-10-12
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  full-regression-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete repository regression suite
        run: python -m pytest -q
