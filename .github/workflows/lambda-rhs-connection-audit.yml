name: Diagnostic - saved-state Lambda RHS consistency

on:
  push:
    branches:
      - diag/lambda-connection-budget-2026-10-12
    paths:
      - tools/audit_lambda_rhs_connection.py
      - .github/workflows/lambda-rhs-connection-audit.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lambda-rhs-connection-audit
  cancel-in-progress: true

jobs:
  rhs-connection-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout diagnostic code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact production source commit and pinned vendor
        uses: actions/checkout@v4
        with:
          ref: 6d8b3f2790644591326df57c55908863f994cb0c
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact production-source dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Download admitted t=12 production checkpoints
        uses: actions/download-artifact@v4
        with:
          name: v55-production-t12-n40-n60-n80
          path: runs/t12
          repository: miahpenn/0-Cosmos-engine
          run-id: 38208253687
          github-token: ${{ github.token }}

      - name: Compile diagnostic
        run: python -m py_compile tools/audit_lambda_rhs_connection.py

      - name: Audit Lambda RHS against metric-connection tangent
        run: python tools/audit_lambda_rhs_connection.py

      - name: Upload saved-state audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lambda-rhs-connection-audit
          path: results/lambda-rhs-connection-audit/
          if-no-files-found: warn
          retention-days: 90
