name: Hybrid origin-integral five-cell Newton diagnostic

on:
  pull_request:
    paths:
      - "tools/audit_hybrid_origin_integral_patch_newton.py"
      - "tools/audit_current_source_momentum_constraint_tangent.py"
      - "tools/audit_cmc_lapse_centre_sensitivity.py"
      - "tools/audit_continuous_origin_half_cell_oracle.py"
      - ".github/workflows/hybrid-origin-integral-patch-newton.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hybrid-origin-integral-patch-newton
  cancel-in-progress: true

jobs:
  bounded-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: "7f47669a1c0edfafef9fc5f27b2db80840d3f035"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out diagnostic PR tree and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out exact production source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install pinned production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Fail closed on source and vendor pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          printf 'PRODUCTION_SOURCE=%s\n' "$(git -C source rev-parse HEAD)"
          printf 'VENDOR_SOURCE=%s\n' "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)"
          printf 'DIAGNOSTIC_HEAD=%s\n' "$(git rev-parse HEAD)"
          # The four owner-authorized candidate blobs are checked against their
          # exact approved hashes; all other protected production files must
          # remain byte-identical to the historical pinned source.
          test "$(git rev-parse HEAD:engine/matter_system.py)" = "0969f4d996e4f8e0fc5b70a7dff147f024907302"
          test "$(git rev-parse HEAD:engine/matter_rhs.py)" = "0153c232ee15b5a9d3dbac37ea858e4d2d730011"
          test "$(git rev-parse HEAD:engine/scalar_system.py)" = "e2c2dae9a016b4d6454cf74a9eae8b0167d5733d"
          test "$(git rev-parse HEAD:engine/production_kernel.py)" = "1720615628a98a8d7cfc9fcadcc984fe28c88be1"
          for path in engine/v55_matter.py engine/v55_pirk_adapter.py engine/cmc_gauge.py engine/v55_initial.py engine/stress_energy.py engine/valencia.py engine/worldtube.py; do
            test "$(git rev-parse "HEAD:$path")" = "$(git -C source rev-parse "HEAD:$path")"
          done

      - name: Compile the exact-source audit helpers
        run: |
          python -m py_compile tools/audit_current_source_momentum_constraint_tangent.py
          python -m py_compile tools/audit_cmc_lapse_centre_sensitivity.py
          python -m py_compile tools/audit_continuous_origin_half_cell_oracle.py
          python -m py_compile tools/audit_hybrid_origin_integral_patch_newton.py

      - name: Run baseline, principled-integral, and five-cell hybrid frozen-state audit
        id: audit
        continue-on-error: true
        run: |
          mkdir -p artifacts/hybrid-origin-integral-patch-newton
          python tools/audit_hybrid_origin_integral_patch_newton.py \
            --resolutions 60 80 120 160 \
            --r-max 80 \
            --output-dir artifacts/hybrid-origin-integral-patch-newton

      - name: Hash only the retained report and state arrays
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d artifacts/hybrid-origin-integral-patch-newton
          find artifacts/hybrid-origin-integral-patch-newton -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > artifacts/hybrid-origin-integral-patch-newton/SHA256SUMS.txt

      - name: Upload pinned report, state arrays, and checksum manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-origin-integral-patch-newton
          path: artifacts/hybrid-origin-integral-patch-newton/
          if-no-files-found: warn
          retention-days: 90

      - name: Require convergence and provenance while preserving the science gate
        if: always()
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          test "$AUDIT_OUTCOME" = "success"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/hybrid-origin-integral-patch-newton/report.json").read_text(encoding="utf-8"))
          assert report["status"] == "completed_diagnostic_only", report.get("status")
          assert report["scientific_admission"] is False
          assert report["production_or_vendor_files_modified"] is False
          assert report["evolution_steps_advanced"] == 0
          pin = report["source_provenance"]
          assert pin["production_source_baseline_anchor"] == "7f47669a1c0edfafef9fc5f27b2db80840d3f035"
          assert pin["vendor_commit"] == "d6052d605673ce9d82cdc99b0df79855fa2ea215"
          assert len(pin["production_source_blobs"]) == 11
          assert len(report["resolutions"]) == 4
          for row in report["resolutions"]:
              assert row["hybrid_newton"]["converged"] is True
              assert row["hybrid_newton"]["final_fully_rebuilt_H_cells_0_to_4_max_abs"] <= 1.0e-9
              assert row["hybrid_newton"]["outside_patch_B_unchanged"] is True
              assert row["input_mutation_check"]["baseline_template_unchanged"] is True
              assert row["input_mutation_check"]["all_arm_tangent_inputs_unchanged"] is True
              assert row["independent_full_propagation_prediction"]["status"] == "NOT_COMPUTED"
              assert row["scientific_admission"] is False
              for arm in ("baseline_production_initializer", "principled_origin_integral", "hybrid_five_cell_patch_newton"):
                  assert row["arms"][arm]["B_positive"] is True
                  assert row["arms"][arm]["measured_rhs_tangent"]["state_unchanged"] is True
                  for tangent in row["arms"][arm]["measured_rhs_tangent"]["tangent_by_epsilon"]:
                      candidate = tangent["independent_constraint_propagation_candidate"]
                      assert candidate["finite"] is True
                      assert candidate["index_mapping_reviewed_for_scientific_admission"] is False
                      assert candidate["matter_conservation_source_sign_and_normalization_reviewed"] is False
                      assert candidate["acceptance_oracle_satisfied"] is False
                      published_mr = candidate["published_covariant_M_r_candidate"]
                      assert published_mr["finite"] is True
                      assert published_mr["index_mapping_reviewed_for_scientific_admission"] is False
                      assert published_mr["matter_conservation_source_sign_and_normalization_reviewed"] is False
                      assert published_mr["acceptance_oracle_satisfied"] is False
                      exact_chain = candidate["exact_discrete_chain_rule"]
                      assert "implementation chain-rule closure only" in exact_chain["scientific_status"]
                      assert exact_chain["chain_rule_max_abs_error"] >= 0.0
                      assert exact_chain["Mtotal_decomposition_max_abs_error"] >= 0.0
                      geom_candidate = candidate["geometric_constraint_propagation_candidate"]
                      assert geom_candidate["finite"] is True
                      assert geom_candidate["matter_source_sign_and_normalization_reviewed"] is False
                      assert geom_candidate["acceptance_oracle_satisfied"] is False
                      for metric_name, metric_value in geom_candidate["full_domain_relative_rms"].items():
                          assert metric_value >= 0.0, (metric_name, metric_value)
                      assert "actual_matter_composite_minus_minus8pi_alpha_Qr" in geom_candidate["full_domain_relative_rms"]
                      assert "nonmatter_geometric_minus_Brown_vacuum" in geom_candidate["full_domain_relative_rms"]
          for name in ("report.json", "state_profiles.npz", "SHA256SUMS.txt"):
              assert Path("artifacts/hybrid-origin-integral-patch-newton", name).is_file(), name
          print("HYBRID_DIAGNOSTIC_PROVENANCE_AND_NEWTON_GATES_OK")
          print("INDEPENDENT_FULL_PROPAGATION_ORACLE_REMAINS_OPEN")
          PY
