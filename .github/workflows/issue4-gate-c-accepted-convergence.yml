name: Issue 4 Gate C accepted-state convergence (diagnostic)

on:
  push:
    branches:
      - diag/issue4-hamiltonian-slot-decomposition-2026-11-08
    paths:
      - tools/issue4_gate_c_accepted_convergence.py
      - .github/workflows/issue4-gate-c-accepted-convergence.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: issue4-gate-c-accepted-convergence
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout exact diagnostic source anchor
        uses: actions/checkout@v4
        with:
          ref: 4aec88d0e3ff028e0a65a8ac36b30948625df792
          path: diagnostic-source
          fetch-depth: 0
          submodules: recursive

      - name: Checkout protected helper baseline
        uses: actions/checkout@v4
        with:
          ref: 7f47669a1c0edfafef9fc5f27b2db80840d3f035
          path: helper-baseline
          fetch-depth: 0
          submodules: recursive

      - name: Setup pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"

      - name: Install pinned numerical environment
        run: python -m pip install numpy==2.5.4 scipy==1.18.1 sympy==1.14.0 mpmath==1.3.0 pytest==9.1.1 threadpoolctl

      - name: Download accepted-state archives N=60, 120, 240 (SHA-256 checked here and by the loader)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p gate-c
          fetch() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/miahpenn/0-Cosmos-engine/actions/artifacts/$1/zip" -o "gate-c/accepted-state-N$2.zip"
            echo "$3  gate-c/accepted-state-N$2.zip" | sha256sum -c -
          }
          fetch 12615136565 60  41d646090e05c08684806c5e39d57851f119cf0f38aa90f1d26ab5f72f87d1ce
          fetch 12615555594 120 9f5c2504f28290ff540c96f93e1fb569f5b960b7a2b3fc312dca9362c8e2eacf
          fetch 12615550675 240 e8a9cd26fbe3dbfb0bd62fc0606237c387a41efd14ade550df50da9842b38bea

      - name: Evaluate the locked full-Bianchi predictor at each resolution
        run: |
          python tools/issue4_gate_c_accepted_convergence.py \
            --archive 60=gate-c/accepted-state-N60.zip \
            --archive 120=gate-c/accepted-state-N120.zip \
            --archive 240=gate-c/accepted-state-N240.zip \
            --diagnostic-source "$GITHUB_WORKSPACE/diagnostic-source" \
            --helper-baseline "$GITHUB_WORKSPACE/helper-baseline" \
            --output gate-c/gate-c-accepted-convergence.json
          sha256sum gate-c/gate-c-accepted-convergence.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue4-gate-c-accepted-convergence-${{ github.run_id }}
          path: gate-c/gate-c-accepted-convergence.json
          if-no-files-found: warn
          retention-days: 90
