name: "[0star] Radiation admissibility expanded-domain control"

on:
  workflow_dispatch:
  push:
    branches:
      - diag/extended-B-recovery-metric
      - diag/completed-radiation-margin-budget
      - diag/radiation-expanded-domain-control

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  radiation-adaptive-step:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-radiation-adaptive-step]')
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Checkout engine and pinned numerical operators
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full repository tests
        run: python -m pytest -q
      - name: Run expanded-domain radiation trace with original recovery and admissibility retries
        env:
          EXTENDED_B_ACCEPTED_METRIC_RECOVERY: "0"
          RADIATION_ADMISSIBILITY_RETRY: "1"
        run: python -c 'import engine.radiation_geometry_stage_trace as trace; trace.RESOLUTION = 120; trace.R_MAX = 120.0; trace.OUTER_CELLS = 45; raise SystemExit(trace.main())'
      - name: Upload expanded-domain radiation trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0star-radiation-expanded-domain-control
          path: runs/radiation-stage-trace/
          if-no-files-found: error
