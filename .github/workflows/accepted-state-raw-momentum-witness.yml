name: Exact accepted-state raw momentum witness

on:
  pull_request:
    paths:
      - "tools/audit_accepted_state_raw_momentum_witness.py"
      - "tools/audit_shared_state_momentum_total_stress_divergence.py"
      - "tools/audit_fluid_current_projection_directional_derivative.py"
      - "tools/audit_fluid_current_conserved_identity.py"
      - "tools/audit_radiation_recovery_roundtrip_sweep.py"
      - "tools/audit_radiation_recovery_current_identity_sweep.py"
      - "tools/audit_current_source_momentum_constraint_tangent.py"
      - "tools/diagnostic_initialization_trace.py"
      - ".github/workflows/accepted-state-raw-momentum-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accepted-state-raw-momentum-witness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      # Preserve the runtime environment used by the previously successful exact replay.
      # Do not force BLAS/OpenMP thread counts: the experiment changed the pinned state digest.
      SOURCE_COMMIT: "7f47669a1c0edfafef9fc5f27b2db80840d3f035"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
    steps:
      - name: Check out diagnostic tree and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out exact historical production source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Fail closed on source and vendor pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"

      - name: Compile the bounded replay
        run: python -m py_compile tools/audit_accepted_state_raw_momentum_witness.py

      - name: Capture runtime, NumPy BLAS, thread pools, and CPU before initialization
        if: always()
        run: |
          mkdir -p results/initial-state-identity-trace
          {
            echo '=== UTC timestamp ==='
            date -u +%Y-%m-%dT%H:%M:%SZ
            echo '=== runner / kernel ==='
            uname -a
            echo '=== CPU topology ==='
            lscpu || true
            echo '=== relevant environment ==='
            env | sort | grep -E '^(BLAS|OMP|OPENBLAS|MKL|NUMEXPR|VECLIB|PYTHON|GITHUB_RUNNER|RUNNER_)' || true
            echo '=== Python and package versions ==='
            python - <<'PY'
          import importlib.metadata as md
          import platform, sys
          print("python:", sys.version)
          print("platform:", platform.platform())
          for name in ("numpy", "scipy", "sympy", "mpmath", "threadpoolctl"):
              try:
                  print(f"{name}:", md.version(name))
              except md.PackageNotFoundError:
                  print(f"{name}: NOT INSTALLED")
          print("=== numpy.show_config() ===")
          import numpy as np
          np.show_config()
          try:
              from threadpoolctl import threadpool_info
              print("=== threadpoolctl.threadpool_info() ===")
              print(threadpool_info())
          except Exception as exc:
              print("threadpoolctl unavailable:", repr(exc))
          PY
            echo '=== pip freeze ==='
            python -m pip freeze
          } > results/initial-state-identity-trace/runtime-environment.txt 2>&1

      - name: Capture candidate versus historical initialization identity
        id: init_trace
        continue-on-error: true
        run: |
          python tools/diagnostic_initialization_trace.py \
            --engine-root . \
            --historical-root source \
            --output results/initial-state-identity-trace/candidate_init_trace.json

      - name: Run the single exact accepted-state replay
        env:
          COSMOS_PINNED_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          python tools/audit_accepted_state_raw_momentum_witness.py \
            --output-dir results/accepted-state-raw-momentum-witness

      - name: Compile and run shared-state momentum / total-stress divergence calculation
        env:
          COSMOS_PINNED_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          python -m py_compile tools/audit_shared_state_momentum_total_stress_divergence.py
          python tools/audit_shared_state_momentum_total_stress_divergence.py --output-dir results/accepted-state-raw-momentum-witness

      - name: Compile and run projection-only fluid-current derivative diagnostic
        env:
          COSMOS_PINNED_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          python -m py_compile tools/audit_fluid_current_projection_directional_derivative.py
          python tools/audit_fluid_current_projection_directional_derivative.py

      - name: Compile and run conserved-current identity check
        env:
          COSMOS_PINNED_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          python -m py_compile tools/audit_fluid_current_conserved_identity.py
          python tools/audit_fluid_current_conserved_identity.py

      - name: Compile and run radiation recovery round-trip tolerance sweep
        env:
          COSMOS_PINNED_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          python -m py_compile tools/audit_radiation_recovery_roundtrip_sweep.py
          python tools/audit_radiation_recovery_roundtrip_sweep.py

      - name: Compile and run paired radiation recovery/current identity sweep
        env:
          COSMOS_PINNED_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          python -m py_compile tools/audit_radiation_recovery_current_identity_sweep.py
          python tools/audit_radiation_recovery_current_identity_sweep.py

      - name: Hash replay outputs
        run: |
          set -euo pipefail
          cd results/accepted-state-raw-momentum-witness
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload raw witness and provenance
        uses: actions/upload-artifact@v4
        with:
          name: accepted-state-raw-momentum-witness
          path: results/accepted-state-raw-momentum-witness/
          if-no-files-found: error
          retention-days: 90


      - name: Upload initialization identity trace even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: initial-state-identity-trace
          path: results/initial-state-identity-trace/
          if-no-files-found: warn
          retention-days: 90

      - name: Fail job if initialization trace failed
        if: always() && steps.init_trace.outcome == 'failure'
        run: |
          echo "Initialization trace failed; inspect the uploaded initial-state-identity-trace artifact."
          exit 1
