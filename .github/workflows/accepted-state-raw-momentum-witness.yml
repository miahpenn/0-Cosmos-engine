name: Exact accepted-state raw momentum witness

on:
  pull_request:
    paths:
      - "tools/audit_accepted_state_raw_momentum_witness.py"
      - "tools/audit_shared_state_momentum_total_stress_divergence.py"
      - "tools/audit_fluid_current_projection_directional_derivative.py"
      - "tools/audit_fluid_current_conserved_identity.py"
      - "tools/audit_radiation_recovery_roundtrip_sweep.py"
      - "tools/audit_radiation_recovery_current_identity_sweep.py"
      - "tools/audit_current_source_momentum_constraint_tangent.py"
      - "tools/diagnostic_initialization_trace.py"
      - "tools/diagnostic_initialization_stage_trace.py"
      - ".github/workflows/accepted-state-raw-momentum-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accepted-state-raw-momentum-witness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Diagnostic-only dispatch matrix. This does not change the strict exact-replay
  # job above or its immutable digest. It records whether BLAS core selection,
  # NumPy AVX-512 dispatch, or their combination explains initialization drift.
  dispatch-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: runner-default
            openblas_core: ""
            numpy_disable: ""
          - arm: zen-openblas
            openblas_core: "Zen"
            numpy_disable: ""
          - arm: numpy-avx512-disabled
            openblas_core: ""
            numpy_disable: "X86_V4,AVX512_ICL,AVX512_SPR"
          - arm: zen-plus-numpy-avx512-disabled
            openblas_core: "Zen"
            numpy_disable: "X86_V4,AVX512_ICL,AVX512_SPR"
    env:
      PYTHONUNBUFFERED: "1"
      OPENBLAS_VERBOSE: "2"
      OPENBLAS_CORETYPE: ${{ matrix.openblas_core }}
      NPY_DISABLE_CPU_FEATURES: ${{ matrix.numpy_disable }}
      SOURCE_COMMIT: "7f47669a1c0edfafef9fc5f27b2db80840d3f035"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
    steps:
      - name: Check out diagnostic tree and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out exact historical production source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"

      - name: Install pinned production dependencies
        run: >-
          python -m pip install -r source/requirements.txt
          numpy==2.5.4 scipy==1.18.1 sympy==1.14.0 mpmath==1.3.0 pytest==9.1.1 threadpoolctl==3.6.0

      - name: Verify immutable source and vendor pins
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"

      - name: Record selected dispatch and CPU features
        run: |
          mkdir -p "results/dispatch-${{ matrix.arm }}"
          {
            echo "ARM=${{ matrix.arm }}"
            echo "OPENBLAS_CORETYPE=${OPENBLAS_CORETYPE}"
            echo "NPY_DISABLE_CPU_FEATURES=${NPY_DISABLE_CPU_FEATURES}"
            lscpu || true
            python - <<'PY'
          import numpy as np, platform, sys
          from threadpoolctl import threadpool_info
          print("python", sys.version)
          print("platform", platform.platform())
          print("numpy", np.__version__)
          print("blas_probe", np.dot(np.array([1., 2.]), np.array([3., 4.])))
          print("runtime")
          np.show_runtime()
          print("cpu_features", {k: bool(v) for k,v in np._core._multiarray_umath.__cpu_features__.items()})
          print("threadpools", threadpool_info())
          PY
          } > "results/dispatch-${{ matrix.arm }}/runtime.txt" 2>&1

      - name: Capture stage-level initialization digest
        continue-on-error: true
        run: |
          python tools/diagnostic_initialization_stage_trace.py \
            --engine-root . --historical-root source \
            --output "results/dispatch-${{ matrix.arm }}/stage_trace.json"

      - name: Capture candidate and historical initialization identity
        continue-on-error: true
        run: |
          python tools/diagnostic_initialization_trace.py \
            --engine-root . --historical-root source \
            --output "results/dispatch-${{ matrix.arm }}/init_trace.json"

      - name: Upload dispatch arm results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: initialization-dispatch-${{ matrix.arm }}
          path: results/dispatch-${{ matrix.arm }}/
          if-no-files-found: warn
          retention-days: 90

  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      # Diagnostic-only controlled replay: the dispatch matrix showed that
      # disabling NumPy X86_V4/AVX-512 restores the immutable initializer digest
      # while leaving X86_V3 enabled. This tests whether downstream radiation
      # diagnostics can run under that exact discriminator; it does not change
      # production code, the immutable digest, or the strict identity gate.
      OPENBLAS_VERBOSE: "2"
      NPY_DISABLE_CPU_FEATURES: "X86_V4,AVX512_ICL,AVX512_SPR"
      SOURCE_COMMIT: "7f47669a1c0edfafef9fc5f27b2db80840d3f035"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
    steps:
      - name: Check out diagnostic tree and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out exact historical production source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned production dependencies
        run: >-
          python -m pip install -r source/requirements.txt
          numpy==2.5.4 scipy==1.18.1 sympy==1.14.0 mpmath==1.3.0 pytest==9.1.1 threadpoolctl==3.6.0

      - name: Fail closed on source and vendor pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"

      - name: Compile the bounded replay
        run: python -m py_compile tools/audit_accepted_state_raw_momentum_witness.py

      - name: Capture runtime, NumPy BLAS, thread pools, and CPU before initialization
        if: always()
        run: |
          mkdir -p results/initial-state-identity-trace
          {
            echo '=== UTC timestamp ==='
            date -u +%Y-%m-%dT%H:%M:%SZ
            echo '=== runner / kernel ==='
            uname -a
            echo '=== CPU topology ==='
            lscpu || true
            echo '=== relevant environment ==='
            env | sort | grep -E '^(BLAS|OMP|OPENBLAS|MKL|NUMEXPR|VECLIB|PYTHON|GITHUB_RUNNER|RUNNER_|NPY_DISABLE_CPU_FEATURES=)' || true
            if [[ ${NPY_DISABLE_CPU_FEATURES+x} ]]; then echo "NPY_DISABLE_CPU_FEATURES_STATE=SET:${NPY_DISABLE_CPU_FEATURES}"; else echo 'NPY_DISABLE_CPU_FEATURES_STATE=UNSET'; fi
            echo '=== Python and package versions ==='
            python - <<'PY'
          import importlib.metadata as md
          import platform, sys
          print("python:", sys.version)
          print("platform:", platform.platform())
          for name in ("numpy", "scipy", "sympy", "mpmath", "threadpoolctl"):
              try:
                  print(f"{name}:", md.version(name))
              except md.PackageNotFoundError:
                  print(f"{name}: NOT INSTALLED")
          print("=== numpy.show_config() ===")
          import numpy as np
          np.show_config()
          print("=== OpenBLAS runtime core probe (OPENBLAS_VERBOSE=2) ===")
          # Trigger one deterministic tiny BLAS operation so verbose dispatch reports
          # the selected core before the initialization trace runs. This does not
          # override CPU features or alter the scientific state.
          print("BLAS_PROBE_RESULT:", np.dot(np.array([1.0, 2.0]), np.array([3.0, 4.0])))
          print("=== numpy.show_runtime() ===")
          try:
              np.show_runtime()
          except Exception as exc:
              print("show_runtime unavailable:", repr(exc))
          print("=== NumPy effective CPU feature flags ===")
          try:
              print({k: bool(v) for k, v in np._core._multiarray_umath.__cpu_features__.items()})
          except Exception as exc:
              print("CPU feature map unavailable:", repr(exc))
          try:
              from threadpoolctl import threadpool_info
              print("=== threadpoolctl.threadpool_info() ===")
              print(threadpool_info())
          except Exception as exc:
              print("threadpoolctl unavailable:", repr(exc))
          PY
            echo '=== pip freeze ==='
            python -m pip freeze
          } > results/initial-state-identity-trace/runtime-environment.txt 2>&1

      - name: Capture stage-level initialization intermediates
        id: stage_trace
        continue-on-error: true
        run: |
          python -m py_compile tools/diagnostic_initialization_stage_trace.py
          python tools/diagnostic_initialization_stage_trace.py \
            --engine-root . \
            --historical-root source \
            --output results/initial-state-identity-trace/stage_trace.json

      - name: Capture candidate versus historical initialization identity
        id: init_trace
        continue-on-error: true
        run: |
          python tools/diagnostic_initialization_trace.py \
            --engine-root . \
            --historical-root source \
            --output results/initial-state-identity-trace/candidate_init_trace.json

      - name: Run the single exact accepted-state replay
        if: always() && steps.stage_trace.outcome == 'success' && steps.init_trace.outcome == 'success'
        env:
          COSMOS_PINNED_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          python tools/audit_accepted_state_raw_momentum_witness.py \
            --output-dir results/accepted-state-raw-momentum-witness

      - name: Compile and run shared-state momentum / total-stress divergence calculation
        if: always() && steps.stage_trace.outcome == 'success' && steps.init_trace.outcome == 'success'
        env:
          COSMOS_PINNED_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          python -m py_compile tools/audit_shared_state_momentum_total_stress_divergence.py
          python tools/audit_shared_state_momentum_total_stress_divergence.py --output-dir results/accepted-state-raw-momentum-witness

      - name: Compile and run projection-only fluid-current derivative diagnostic
        if: always() && steps.stage_trace.outcome == 'success' && steps.init_trace.outcome == 'success'
        env:
          COSMOS_PINNED_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          python -m py_compile tools/audit_fluid_current_projection_directional_derivative.py
          python tools/audit_fluid_current_projection_directional_derivative.py

      - name: Compile and run conserved-current identity check
        if: always() && steps.stage_trace.outcome == 'success' && steps.init_trace.outcome == 'success'
        env:
          COSMOS_PINNED_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          python -m py_compile tools/audit_fluid_current_conserved_identity.py
          python tools/audit_fluid_current_conserved_identity.py

      - name: Compile and run radiation recovery round-trip tolerance sweep
        if: always() && steps.stage_trace.outcome == 'success' && steps.init_trace.outcome == 'success'
        env:
          COSMOS_PINNED_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          python -m py_compile tools/audit_radiation_recovery_roundtrip_sweep.py
          python tools/audit_radiation_recovery_roundtrip_sweep.py

      - name: Compile and run paired radiation recovery/current identity sweep
        if: always() && steps.stage_trace.outcome == 'success' && steps.init_trace.outcome == 'success'
        env:
          COSMOS_PINNED_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          python -m py_compile tools/audit_radiation_recovery_current_identity_sweep.py
          python tools/audit_radiation_recovery_current_identity_sweep.py

      - name: Hash replay outputs
        if: always() && steps.stage_trace.outcome == 'success' && steps.init_trace.outcome == 'success'
        run: |
          set -euo pipefail
          cd results/accepted-state-raw-momentum-witness
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload raw witness and provenance
        if: always() && steps.stage_trace.outcome == 'success' && steps.init_trace.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: accepted-state-raw-momentum-witness
          path: results/accepted-state-raw-momentum-witness/
          if-no-files-found: error
          retention-days: 90


      - name: Upload initialization identity trace even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: initial-state-identity-trace
          path: results/initial-state-identity-trace/
          if-no-files-found: warn
          retention-days: 90

      - name: Fail job if either initialization identity trace failed
        if: always() && (steps.init_trace.outcome == 'failure' || steps.stage_trace.outcome == 'failure')
        run: |
          echo "Initialization identity failed or stage trace found a mismatch; inspect the uploaded initial-state-identity-trace artifact."
          exit 1
