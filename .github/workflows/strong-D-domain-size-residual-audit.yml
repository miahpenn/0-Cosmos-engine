name: Diagnostic - R80 evolved-state capture

on:
  push:
    branches:
      - diag/independent-metric-ricci-audit
    paths:
      - diagnostics/curvature_consistency/domain_size_test_trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile R80 full-state diagnostic
        run: python -m py_compile diagnostics/curvature_consistency/strong_D_evolved_state_r80_capture.py
      - name: Validate R80 fixed-spacing state-capture configuration
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path("diagnostics/curvature_consistency/strong_D_evolved_state_r80_capture.py")
          tree = ast.parse(p.read_text())
          assignments = {t.id: n.value for n in tree.body if isinstance(n, ast.Assign) for t in n.targets if isinstance(t, ast.Name)}
          n = ast.literal_eval(assignments["RESOLUTION"])
          r = ast.literal_eval(assignments["R_MAX"])
          assert (n, r, r / n) == (160, 80.0, 0.5)
          assert ast.literal_eval(assignments["SAMPLE_INTERVAL"]) == 0.25
          assert ast.literal_eval(assignments["CFL"]) == 0.0075
          assert ast.literal_eval(assignments["FINAL_TIME"]) == 12.0
          print("R80 production trajectory N=160, r_max=80, dr=0.5; t=12 and quarter-time full-state capture passed.")
          PY
      - name: Install dependencies for numerical evolution
        run: python -m pip install -r requirements.txt
      - name: Run one R80 production trajectory with full-state capture
        run: python diagnostics/curvature_consistency/strong_D_evolved_state_r80_capture.py
      - name: Upload full state history, profiles, checkpoints, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strong-D-evolved-state-r80-capture
          path: runs/strong-D-evolved-state-r80-capture/
          if-no-files-found: warn
          retention-days: 90
