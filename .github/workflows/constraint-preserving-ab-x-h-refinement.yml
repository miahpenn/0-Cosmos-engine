name: "[0star] constraint-preserving a-b/X H refinement"

on:
  push:
    branches:
      - diag/discrete-consistent-initial-review

permissions:
  contents: read

jobs:
  constraint-preserving-ab-x:
    if: contains(github.event.head_commit.message, '[run-constraint-preserving-ab-x]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Re-run candidate initializer admission tests
        run: python -m pytest -q tests/test_discrete_consistent_initial.py

      - name: Run constraint-preserving a-b/X refinement audit
        run: python -m engine.constraint_preserving_ab_x_h_refinement

      - name: Upload constraint-preserving a-b/X refinement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constraint-preserving-ab-x-h-refinement
          path: runs/constraint-preserving-ab-x-h-refinement/report.json
          if-no-files-found: warn
