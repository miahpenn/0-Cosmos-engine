name: Diagnostic - source-pinned one-step centre Ricci PIRK stage budget

on:
  push:
    branches:
      - diag/issue4-fullgrid-matter-l3-2026-10-15
    paths:
      - tools/audit_evolved_centre_ricci_stage_budget.py
      - tools/audit_current_main_centre_proper_radial_ricci.py
      - tests/test_research_matter_l3_reconstruction.py
      - .github/workflows/current-main-centre-ricci-stage-budget.yml
      - docs/CURRENT_MAIN_CENTRE_RICCI_HIGHRES_2026-10-15.md

  pull_request:
    paths:
      - tools/audit_evolved_centre_ricci_stage_budget.py
      - tools/audit_current_main_centre_proper_radial_ricci.py
      - tests/test_research_matter_l3_reconstruction.py
      - .github/workflows/current-main-centre-ricci-stage-budget.yml
      - docs/CURRENT_MAIN_CENTRE_RICCI_HIGHRES_2026-10-15.md

permissions:
  contents: read

concurrency:
  group: current-main-centre-ricci-stage-budget-2026-10-15
  cancel-in-progress: false

jobs:
  one-step-stage-budget:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [60, 80, 120, 160]
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "7f47669a1c0edfafef9fc5f27b2db80840d3f035"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
      STAGE_RESOLUTION: ${{ matrix.resolution }}
      STAGE_R_MAX: "80.0"
      STAGE_CFL: "0.03"
      STAGE_OUT: results/current-main-centre-ricci-stage-budget-N${{ matrix.resolution }}-2026-10-16

    steps:
      - name: Check out diagnostic branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository requirements
        run: python -m pip install -r requirements.txt

      - name: Fail closed on source/vendor/dependency drift
        run: |
          python - <<'PY'
          import json
          from tools.audit_evolved_centre_ricci_stage_budget import _verify_stage_source_pins
          print(json.dumps(_verify_stage_source_pins(), indent=2))
          PY

      - name: Test full-grid matter L3 reconstruction and sign-flip control
        run: python -m pytest -q tests/test_research_matter_l3_reconstruction.py

      - name: Compile stage-budget observer
        run: |
          python -m py_compile tools/audit_evolved_centre_ricci_stage_budget.py
          python -m py_compile tools/audit_current_main_centre_proper_radial_ricci.py

      - name: Run one-step signed PIRK stage budget
        run: python tools/audit_evolved_centre_ricci_stage_budget.py

      - name: Upload saved state, stage profiles and checksum manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-centre-ricci-stage-budget-N${{ matrix.resolution }}-2026-10-16
          path: results/current-main-centre-ricci-stage-budget-N${{ matrix.resolution }}-2026-10-16/
          if-no-files-found: warn
          retention-days: 90
