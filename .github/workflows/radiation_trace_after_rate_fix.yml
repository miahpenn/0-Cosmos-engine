name: "[0star] Radiation predictor trace with matched boundary Aa audit"

on:
  push:
    branches:
      - diag/radiation-boundary-aa-pair-2026-10-12
    paths:
      - engine/radiation_geometry_stage_trace.py
      - .github/workflows/radiation_trace_after_rate_fix.yml

permissions:
  contents: read

env:
  PYTHONPATH: .

concurrency:
  group: radiation-trace-after-rate-fix-2026-10-12
  cancel-in-progress: false

jobs:
  pinned-corrected-engine-trace:
    if: contains(github.event.head_commit.message, '[run-radiation-after-rate-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout engine and pinned numerical operators
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fail closed against the existing isolated rate-fix candidate
        env:
          RATE_FIX_SOURCE_COMMIT: "1c63090d4f42396f899421a2379f70320689d5ad"
          VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
        run: |
          git fetch --no-tags origin "$RATE_FIX_SOURCE_COMMIT"
          unexpected="$(git diff --name-only "$RATE_FIX_SOURCE_COMMIT" HEAD -- engine vendor requirements.txt .gitmodules | grep -v '^engine/radiation_geometry_stage_trace.py$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected engine/vendor/dependency changes relative to rate-fix source:\n%s\n' "$unexpected"
            exit 1
          fi
          actual_vendor="$(git rev-parse HEAD:vendor/bb-palatini-unified-r0)"
          test "$actual_vendor" = "$VENDOR_COMMIT"
          printf 'Rate-fix candidate source: %s\nVendor: %s\nTrace instrumentation is the only permitted engine-path difference.\n' "$RATE_FIX_SOURCE_COMMIT" "$VENDOR_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned-source dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile the adapted trace
        run: python -m py_compile engine/radiation_geometry_stage_trace.py

      - name: Full repository regression suite
        run: python -m pytest -q

      - name: Run bounded radiation predictor trace at frozen production dt (no retries)
        # Preserve the exact production dt so the captured predictor is interpretable.
        env:
          EXTENDED_B_ACCEPTED_METRIC_RECOVERY: "0"
          RADIATION_ADMISSIBILITY_RETRY: "0"
        run: python -m engine.radiation_geometry_stage_trace

      - name: Record exact provenance and report checksums
        if: always()
        env:
          RATE_FIX_SOURCE_COMMIT: "1c63090d4f42396f899421a2379f70320689d5ad"
          VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
        run: |
          mkdir -p runs/radiation-stage-trace
          printf '%s\n' "$RATE_FIX_SOURCE_COMMIT" > runs/radiation-stage-trace/RATE_FIX_SOURCE_COMMIT.txt
          printf '%s\n' "$VENDOR_COMMIT" > runs/radiation-stage-trace/VENDOR_COMMIT.txt
          git rev-parse HEAD > runs/radiation-stage-trace/TRACE_HEAD.txt
          if [ -f runs/radiation-stage-trace/trace.json ]; then
            sha256sum runs/radiation-stage-trace/trace.json runs/radiation-stage-trace/summary.json > runs/radiation-stage-trace/TRACE_SHA256SUMS.txt
          fi

      - name: Upload trace artifacts (including captured failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radiation-boundary-aa-pair
          path: runs/radiation-stage-trace/
          if-no-files-found: warn
          retention-days: 90
