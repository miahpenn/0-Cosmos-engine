name: 0-star central proper-time gauge campaign

on:
  # Expensive campaign; run only when deliberately dispatched.
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  central-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run repository tests
        run: python -m pytest -q

      - name: Run central proper-time CMC campaign
        run: |
          python - <<'PY'
          from engine.campaign import CampaignConfig
          from engine.production_kernel import V55ProductionKernel
          from engine.run_production import run_campaign
          from engine.zero_star_clock_gauge import solve_central_proper_time_lapse

          class CentralProperTimeKernel(V55ProductionKernel):
              def _solve_lapse(self, grid, geometry, scalars, matter):
                  return solve_central_proper_time_lapse(
                      grid, geometry, scalars, matter
                  )

          config = CampaignConfig(
              resolutions=(80, 120, 160),
              r_max=160.0,
              cfl=0.03,
              final_time=80.0,
              output_dir='runs/0star-central-clock',
          )
          results = run_campaign(kernel=CentralProperTimeKernel(), config=config)
          for result in results:
              print(result)
          PY

      - name: Upload campaign outputs
        uses: actions/upload-artifact@v4
        with:
          name: 0star-central-proper-time-campaign
          path: runs/0star-central-clock/
          if-no-files-found: error
