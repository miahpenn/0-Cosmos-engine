# Same-spacing domain-extension discriminator.
# Keeps dr=0.5 while increasing R_max from 120 to 160.
name: "[0star] R160 same-spacing post-turnaround discriminator"

on:
  workflow_dispatch:
  push:
    branches:
      - 0star-central-clock

env:
  PYTHONPATH: .

jobs:
  r160-same-spacing:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-r160-domain]')
    runs-on: ubuntu-latest
    timeout-minutes: 900
    strategy:
      fail-fast: false
      matrix:
        include_radiation: [true, false]
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run repository tests
        run: python -m pytest -q

      - name: Run R160 same-spacing continuation
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from engine.true_cmc_pirk_kernel import V55TrueCMCPIRKKernel

          include_radiation = os.environ["INCLUDE_RADIATION"].strip().lower() == "true"
          kernel = V55TrueCMCPIRKKernel()
          state = kernel.initialize(
              resolution=320,
              r_max=160.0,
              include_radiation=include_radiation,
          )
          dt = 0.06 * state.grid.dr
          target = 100.0
          failure = None

          while state.t < target:
              dt_step = min(dt, target - state.t)
              try:
                  state = kernel.step(state, dt_step)
                  state.geometry.assert_finite_positive()
              except (FloatingPointError, ValueError) as exc:
                  failure = {
                      "type": type(exc).__name__,
                      "message": str(exc),
                      "t": float(state.t),
                      "tau": float(state.tau),
                  }
                  break

          result = {
              "resolution": 320,
              "r_max": 160.0,
              "dr": float(state.grid.dr),
              "cfl": 0.06,
              "target_time": target,
              "include_radiation": include_radiation,
              "t_final": float(state.t),
              "tau_final": float(state.tau),
              "failure": failure,
              "turnaround_events": sum(e.kind == "turnaround" for e in state.cycle.events),
              "reexpansion_events": sum(e.kind == "re-expansion_crossing" for e in state.cycle.events),
              "trapped_root_count_max": max(
                  (len(row.get("trapped_roots", [])) for row in state.history),
                  default=0,
              ),
              "last_diagnostics": (
                  state.history[-1]
                  if state.history else kernel.diagnostics(state, profiles=False)
              ),
          }

          tag = "on" if include_radiation else "off"
          out = Path("runs/0star-r160-same-spacing") / tag
          out.mkdir(parents=True, exist_ok=True)
          (out / "result.json").write_text(json.dumps(result, indent=2, default=float))
          print(json.dumps(result, indent=2, default=float))
          PY
        env:
          INCLUDE_RADIATION: ${{ matrix.include_radiation }}

      - name: Upload R160 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0star-r160-same-spacing-${{ matrix.include_radiation }}
          path: runs/0star-r160-same-spacing/${{ matrix.include_radiation == true && 'on' || 'off' }}/result.json
          if-no-files-found: error
