name: High-resolution radiation real-step admissibility diagnostic

on:
  push:
    branches:
      - diag/high-resolution-radiation-real-step-after-rhs-contract-2026-10-12
    paths:
      - engine/matter_system.py
      - engine/matter_rhs.py
      - engine/production_kernel.py
      - engine/v55_matter.py
      - tools/diag_high_resolution_radiation_real_step.py
      - .github/workflows/high-resolution-radiation-real-step.yml

permissions:
  contents: read

concurrency:
  group: high-resolution-radiation-real-step
  cancel-in-progress: false

jobs:
  actual-step:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Verify pinned geometry/PIRK vendor
        run: test "$(git rev-parse HEAD:vendor/bb-palatini-unified-r0)" = "d6052d605673ce9d82cdc99b0df79855fa2ea215"
      - name: Compile diagnostic and pinned production modules
        run: |
          python -m py_compile engine/matter_system.py engine/matter_rhs.py engine/production_kernel.py engine/v55_matter.py
          python -m py_compile tools/diag_high_resolution_radiation_real_step.py
      - name: Existing radiation RHS and actual-state admissibility regressions
        run: python -m pytest -q tests/test_radiation_rhs_admissibility_contract.py
      - name: Full repository regression suite
        run: python -m pytest -q tests
      - name: Execute exactly one N=240 and one N=320 production step
        run: PYTHONPATH=. python tools/diag_high_resolution_radiation_real_step.py
      - name: Preserve JSON and checksum even if the real step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-resolution-radiation-real-step
          path: artifacts/high-resolution-radiation-real-step/
          if-no-files-found: warn
