name: Stage 0b corrected exact-head engine regression
on:
  push:
    branches: [research/stage0b-spectrum-613]
    paths: [.github/workflows/research-stage0b-suite-readback.yml]
permissions:
  contents: read
jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbf4e6bd759271b2ca15295db8f13e570e8fa3aa
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - name: Verify provenance and install pinned runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage0b-suites
          test "$(git rev-parse HEAD)" = "cbf4e6bd759271b2ca15295db8f13e570e8fa3aa"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "d6052d605673ce9d82cdc99b0df79855fa2ea215"
          test -z "$(git status --porcelain --untracked-files=no)"
          git submodule status --recursive > /tmp/stage0b-suites/submodules.txt
          ! grep -E '^[-+U]' /tmp/stage0b-suites/submodules.txt
          python -m pip install numpy==2.5.5 scipy==1.18.1 sympy==1.14.0 mpmath==1.3.0 pytest==9.2.0 iniconfig==2.3.1 packaging==26.4 pluggy==1.7.0 pygments==2.21.0
          python -m pip freeze > /tmp/stage0b-suites/dependencies.txt
          python -c 'import sys,numpy as n; print(sys.version); n.show_runtime()' > /tmp/stage0b-suites/runtime.txt
          lscpu > /tmp/stage0b-suites/cpu.txt
      - name: Run full suite and existing curved EM witness
        run: |
          set -euo pipefail
          python -m pytest -q | tee /tmp/stage0b-suites/pytest.txt
          python -m pytest -q -s tests/test_research_em_curved_energy_balance.py | tee /tmp/stage0b-suites/em.txt
          python -m engine.run_controls | tee /tmp/stage0b-suites/controls.txt
      - name: Production one-step smoke
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/stage0b-suites/smoke.txt
          from engine.production_kernel import V55ProductionKernel
          k=V55ProductionKernel()
          s=k.initialize(resolution=40,r_max=40.0,include_radiation=True)
          dt=.03*s.grid.dr
          u=k.step(s,dt)
          u.geometry.assert_finite_positive()
          assert u.t>s.t and u.history
          print("PRODUCTION_STEP_SMOKE_PASS",u.t)
          PY
      - name: Checksum outputs
        if: always()
        run: |
          if test -d /tmp/stage0b-suites; then
            cd /tmp/stage0b-suites
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage0b-corrected-regression
          path: /tmp/stage0b-suites
          if-no-files-found: error
          retention-days: 90
