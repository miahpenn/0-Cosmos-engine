name: Issue 4 manufactured regular-centre Ricci oracle

on:
  pull_request:
    paths:
      - "tools/audit_manufactured_regular_centre_ricci.py"
      - "tests/test_research_manufactured_regular_centre_ricci.py"
      - ".github/workflows/issue4-manufactured-regular-centre-ricci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue4-manufactured-regular-centre-ricci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-regular-centre-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "27da39e1e4d3a37ce0f7ef70b228009323183048"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"

    steps:
      - name: Check out diagnostic branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out exact production source and vendor
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install pinned production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Verify source/vendor pins and production file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          test "$(git rev-parse HEAD:vendor/bb-palatini-unified-r0)" = "$(git -C source rev-parse HEAD:vendor/bb-palatini-unified-r0)"
          for path in engine/production_kernel.py engine/matter_system.py engine/matter_rhs.py engine/scalar_system.py engine/v55_matter.py engine/v55_pirk_adapter.py engine/cmc_gauge.py engine/v55_initial.py engine/stress_energy.py engine/valencia.py engine/worldtube.py; do
            test "$(git rev-parse "HEAD:$path")" = "$(git -C source rev-parse "HEAD:$path")"
          done
          printf 'PRODUCTION_SOURCE=%s\n' "$(git -C source rev-parse HEAD)"
          printf 'VENDOR_SOURCE=%s\n' "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)"

      - name: Compile the diagnostic and regression
        run: |
          python -m py_compile tools/audit_manufactured_regular_centre_ricci.py
          python -m py_compile tests/test_research_manufactured_regular_centre_ricci.py

      - name: Run deterministic analytic convergence and negative controls
        run: python -m pytest -q tests/test_research_manufactured_regular_centre_ricci.py

      - name: Run source-pinned resolution matrix and retain signed profiles
        id: oracle
        continue-on-error: true
        run: |
          mkdir -p results/regular-centre-ricci
          COSMOS_PINNED_SOURCE_ROOT="$GITHUB_WORKSPACE/source" python tools/audit_manufactured_regular_centre_ricci.py \
            --resolutions 80 120 160 240 320 \
            --r-max 40 \
            --amplitude 0.1 \
            --length-scale 8 \
            --annulus 5 10 \
            --output results/regular-centre-ricci/report.json

      - name: Hash retained report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find results -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > results/SHA256SUMS.txt

      - name: Upload signed centre and annulus profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue4-manufactured-regular-centre-ricci-${{ github.sha }}
          path: results/
          if-no-files-found: warn
          retention-days: 90

      - name: Assert diagnostic-only acceptance contract
        if: always()
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.oracle.outcome }}
        run: |
          set -euo pipefail
          test "$AUDIT_OUTCOME" = "success"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("results/regular-centre-ricci/report.json").read_text())
          assert report["status"] == "completed_diagnostic_only"
          assert report["diagnostic_contract_passed"] is True
          assert report["scientific_admission"] is False
          assert report["production_evolution_steps"] == 0
          assert report["target_state_artifacts_read"] is False
          assert report["production_or_vendor_files_modified"] is False
          assert all(row["all_finite"] for row in report["rows"])
          assert all(len(report["descriptive_orders_on_manufactured_profile"][key]) == 4 for key in (
              "bssn_cell0_error", "metric_cell0_error", "route_gap_cell0",
              "bssn_annulus_error", "metric_annulus_error", "route_gap_annulus"
          ))
          print("REGULAR_CENTRE_DIAGNOSTIC_OK; SCIENTIFIC_ADMISSION=NOT_ADMITTED")
          PY
