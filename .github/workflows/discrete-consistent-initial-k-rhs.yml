name: Diagnostic - discrete-consistent initial signed K RHS budget

on:
  push:
    branches:
      - diag/discrete-consistent-initial-production-test-2026-10-12
    paths:
      - tools/audit_discrete_consistent_initial_k_rhs.py
      - .github/workflows/discrete-consistent-initial-k-rhs.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: discrete-consistent-initial-k-rhs-2026-10-12
  cancel-in-progress: false

jobs:
  frozen-k-rhs-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout diagnostic branch and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Download matched production A/B checkpoints through t=2.16
        uses: actions/download-artifact@v4
        with:
          name: discrete-consistent-initial-production-ab-t2p16
          repository: miahpenn/0-Cosmos-engine
          run-id: 38284401548
          github-token: ${{ github.token }}
          path: production-ab-artifact

      - name: Compile the frozen-state diagnostic
        run: python -m py_compile tools/audit_discrete_consistent_initial_k_rhs.py

      - name: Audit signed K RHS and CMC residuals on frozen checkpoints
        run: python tools/audit_discrete_consistent_initial_k_rhs.py

      - name: Upload K RHS budget, CMC residual, and fixed-radius witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discrete-consistent-initial-signed-k-rhs
          path: results/discrete-consistent-initial-k-rhs/
          if-no-files-found: warn
          retention-days: 90
