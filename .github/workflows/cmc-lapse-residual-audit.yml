name: Diagnostic - CMC lapse same-slice residual audit

on:
  push:
    branches:
      - "diag/bond-sweep-self-consistent"
    paths:
      - "diagnostics/cmc_lapse_residual_audit.py"
      - ".github/workflows/cmc-lapse-residual-audit.yml"

permissions:
  contents: read

jobs:
  cmc-lapse-residual-audit:
    if: contains(github.event.head_commit.message, '[cmc-lapse-residual-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run same-slice CMC residual audit
        run: python diagnostics/cmc_lapse_residual_audit.py
      - name: Upload residual audit
        uses: actions/upload-artifact@v4
        with:
          name: cmc-lapse-residual-audit
          path: runs/cmc_lapse_residual_audit/cmc_lapse_residual_audit.json
          if-no-files-found: error
