name: Issue 4 equation-consistent matter-direction constructor

on:
  push:
    branches:
      - research/issue4-equation-consistent-matter-control-2026-11-05
    paths:
      - tools/issue4_equation_consistent_matter_direction.py
      - tests/test_issue4_equation_consistent_matter_direction.py
      - .github/workflows/issue4-equation-consistent-matter-control.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue4-equation-consistent-matter-control
  cancel-in-progress: false

jobs:
  constructor-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"

      - name: Install bounded numerical environment
        run: |
          python -m pip install numpy==2.5.4 pytest==9.1.1

      - name: Compile and test equation-consistent constructor
        run: |
          python -m py_compile tools/issue4_equation_consistent_matter_direction.py
          python -m pytest -q tests/test_issue4_equation_consistent_matter_direction.py

      - name: Record provenance and runtime
        if: always()
        run: |
          mkdir -p equation-consistent-results
          python --version > equation-consistent-results/python-version.txt
          python -m pip freeze > equation-consistent-results/pip-freeze.txt
          git rev-parse HEAD > equation-consistent-results/research-commit.txt
          git status --short > equation-consistent-results/git-status.txt
          find equation-consistent-results -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > equation-consistent-results/SHA256SUMS.txt

      - name: Upload constructor contract artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue4-equation-consistent-constructor-${{ github.run_id }}
          path: equation-consistent-results/
          if-no-files-found: warn
          retention-days: 90
