name: Diagnostic - PIRK stage centre-series compatibility

on:
  push:
    branches:
      - diag/pirk-stage-centre-series-compatibility-2026-10-13
    paths:
      - tools/audit_pirk_stage_centre_series_compatibility.py
      - .github/workflows/pirk-stage-centre-series-compatibility.yml

permissions:
  contents: read

concurrency:
  group: pirk-stage-centre-series-compatibility-2026-10-13
  cancel-in-progress: false

jobs:
  one-step-stage-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "6d8b3f2790644591326df57c55908863f994cb0c"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
    steps:
      - name: Checkout isolated diagnostic branch and pinned submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fail closed on production-source or vendor drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_COMMIT"
          source_kernel_blob="$(git rev-parse "$SOURCE_COMMIT:engine/production_kernel.py")"
          candidate_kernel_blob="$(git rev-parse "HEAD:engine/production_kernel.py")"
          test "$source_kernel_blob" = "$candidate_kernel_blob"
          test "$(git rev-parse "HEAD:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          changed="$(git diff --name-only "$SOURCE_COMMIT" HEAD -- engine vendor .gitmodules requirements.txt)"
          unexpected="$(printf '%s\n' "$changed" | grep -vxF 'engine/discrete_consistent_initial.py' | sed '/^$/d' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected frozen-source differences:\n%s\n' "$unexpected"
            exit 1
          fi
          printf 'SOURCE_KERNEL_BLOB=%s\nCANDIDATE_KERNEL_BLOB=%s\nVENDOR_COMMIT=%s\n' \
            "$source_kernel_blob" "$candidate_kernel_blob" "$VENDOR_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen-source dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile diagnostic without running an evolution
        run: python -m py_compile tools/audit_pirk_stage_centre_series_compatibility.py

      - name: Capture one normal production step per resolution
        run: python tools/audit_pirk_stage_centre_series_compatibility.py

      - name: Record provenance and artifact checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/pirk-stage-centre-series-compatibility
          printf '%s\n' "$SOURCE_COMMIT" > results/pirk-stage-centre-series-compatibility/SOURCE_COMMIT.txt
          printf '%s\n' "$VENDOR_COMMIT" > results/pirk-stage-centre-series-compatibility/VENDOR_COMMIT.txt
          git rev-parse HEAD > results/pirk-stage-centre-series-compatibility/DIAGNOSTIC_COMMIT.txt
          if test -f results/pirk-stage-centre-series-compatibility/report.json; then
            (cd results/pirk-stage-centre-series-compatibility && sha256sum report.json profiles.npz profiles.csv > OUTPUT_SHA256SUMS.txt)
          fi

      - name: Upload stage-capture evidence even if the diagnostic fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pirk-stage-centre-series-compatibility
          path: results/pirk-stage-centre-series-compatibility/
          if-no-files-found: warn
          retention-days: 90
