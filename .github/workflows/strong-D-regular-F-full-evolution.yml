name: Diagnostic - strong-D production versus regular-F full evolution

on:
  push:
    branches:
      - diag/independent-metric-ricci-audit
    paths:
      - diagnostics/curvature_consistency/strong_D_regular_F_full_evolution.py
      - .github/workflows/strong-D-regular-F-full-evolution.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile paired full-evolution diagnostic
        run: python -m py_compile diagnostics/curvature_consistency/strong_D_regular_F_full_evolution.py
      - name: Run production and cubic/Gauss shadow trajectories to t=22.5
        run: python diagnostics/curvature_consistency/strong_D_regular_F_full_evolution.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strong-D-production-vs-regular-F-full-evolution
          path: runs/strong-D-production-vs-regular-F-full-evolution/report.json
          if-no-files-found: error
          retention-days: 90
