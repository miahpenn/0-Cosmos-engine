name: 0-star temporal-gauge diagnostic campaign

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  zero-star:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[0star]')
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run repository tests
        run: python -m pytest -q

      - name: Run 0-star temporal gauge diagnostic
        id: campaign
        run: |
          python - <<'PY'
          from engine.campaign import CampaignConfig
          from engine.production_kernel import V55ProductionKernel
          from engine.run_production import run_campaign
          from engine.zero_star_gauge import solve_zero_star_lapse

          class ZeroStarKernel(V55ProductionKernel):
              def _solve_lapse(self, grid, geometry, scalars, matter):
                  return solve_zero_star_lapse(grid, geometry, scalars, matter)

          config = CampaignConfig(
              resolutions=(80, 120, 160),
              r_max=160.0,
              cfl=0.03,
              final_time=80.0,
              output_dir='runs/0star',
          )
          results = run_campaign(kernel=ZeroStarKernel(), config=config)
          for result in results:
              print(result)
          PY

      - name: Verify successful campaign evidence
        if: steps.campaign.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("runs/0star")
          summary_path = root / "campaign_summary.json"
          if not summary_path.is_file() or summary_path.stat().st_size == 0:
              raise SystemExit(f"successful campaign missing non-empty {summary_path}")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          if summary.get("admission", {}).get("passed") is not True:
              raise SystemExit("successful campaign evidence does not record admission.passed=true")
          expected = tuple([80,120,160])
          reported = tuple(int(item) for item in summary.get("campaign", {}).get("resolutions", []))
          if reported != expected:
              raise SystemExit(f"campaign resolution provenance mismatch: expected={expected}, reported={reported}")
          results = {
              int(item["resolution"]): item
              for item in summary.get("results", [])
              if isinstance(item, dict) and "resolution" in item
          }
          if set(results) != set(expected):
              raise SystemExit(f"campaign result inventory mismatch: expected={expected}, reported={tuple(sorted(results))}")
          for resolution in expected:
              resolution_dir = root / f"N{resolution}"
              for filename in ("ledgers.json", "radiation_step_retries.json"):
                  evidence_path = resolution_dir / filename
                  if not evidence_path.is_file() or evidence_path.stat().st_size == 0:
                      raise SystemExit(f"successful campaign missing non-empty evidence file: {evidence_path}")
                  json.loads(evidence_path.read_text(encoding="utf-8"))
          print(f"SUCCESS_PATH_EVIDENCE_VALID summary={summary_path} resolutions={expected}")

      - name: Upload successful campaign evidence
        if: always() && steps.campaign.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: 0star-temporal-gauge-campaign
          path: runs/0star/
          if-no-files-found: error

      - name: Preserve available outputs after unsuccessful campaign
        if: always() && steps.campaign.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: 0star-temporal-gauge-campaign
          path: runs/0star/
          if-no-files-found: warn
