name: Diagnostic - discrete-consistent initial metric production A/B

on:
  push:
    branches:
      - diag/discrete-consistent-initial-production-test-2026-10-12
    paths:
      - engine/discrete_consistent_initial.py
      - tests/test_discrete_consistent_initial_production_diagnostic.py
      - tools/run_discrete_consistent_initial_production_ab.py
      - .github/workflows/discrete-consistent-initial-production-ab.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: discrete-consistent-initial-production-ab-2026-10-12
  cancel-in-progress: false

jobs:
  matched-short-production-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout diagnostic branch and pinned kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full repository regression suite
        run: python -m pytest -q

      - name: Run discrete-consistent initializer regression explicitly
        run: python -m pytest -q tests/test_discrete_consistent_initial_production_diagnostic.py

      - name: Download independent same-domain baseline checkpoints through t=2.16
        uses: actions/download-artifact@v4
        with:
          name: lambda-spatial-refinement-t2p16
          repository: miahpenn/0-Cosmos-engine
          run-id: 38212879394
          github-token: ${{ github.token }}
          path: baseline-spatial-artifact

      - name: Compile matched A/B diagnostic
        run: python -m py_compile tools/run_discrete_consistent_initial_production_ab.py

      - name: Run baseline and discrete-consistent candidate through t=2.16
        run: python tools/run_discrete_consistent_initial_production_ab.py

      - name: Upload trajectories, candidate initial solver reports, and H/M/C comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discrete-consistent-initial-production-ab-t2p16
          path: |
            runs/discrete-consistent-initial-production-test/
            results/discrete-consistent-initial-production-test/
          if-no-files-found: warn
          retention-days: 90
