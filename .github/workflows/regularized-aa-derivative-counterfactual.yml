name: Diagnostic - regularized Aa derivative counterfactual

on:
  push:
    branches:
      - diag/lambda-metric-connection-rhs-2026-10-12
    paths:
      - tools/test_regularized_aa_derivative_counterfactual.py
      - .github/workflows/regularized-aa-derivative-counterfactual.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: regularized-aa-derivative-counterfactual-2026-10-12
  cancel-in-progress: false

jobs:
  one-step-counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:source
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout diagnostic tool
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact production source and pinned vendor
        uses: actions/checkout@v4
        with:
          ref: 6d8b3f2790644591326df57c55908863f994cb0c
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Download admitted t=12 production checkpoints
        uses: actions/download-artifact@v4
        with:
          name: v55-production-t12-n40-n60-n80
          path: runs/t12
          repository: miahpenn/0-Cosmos-engine
          run-id: 38208253687
          github-token: ${{ github.token }}

      - name: Compile diagnostic
        run: python -m py_compile tools/test_regularized_aa_derivative_counterfactual.py

      - name: Compare direct and tensor-regularized Aa derivative
        run: python tools/test_regularized_aa_derivative_counterfactual.py

      - name: Upload counterfactual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regularized-aa-derivative-counterfactual
          path: results/regularized-aa-derivative-counterfactual/
          if-no-files-found: warn
          retention-days: 90
