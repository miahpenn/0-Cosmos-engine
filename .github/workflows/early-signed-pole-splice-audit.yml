name: Diagnostic - N640 signed-pole audit through t=12

on:
  push:
    branches:
      - diag/early-signed-pole-splice-audit
    paths:
      - diagnostics/curvature_consistency/strong_D_early_signed_pole_N640.py
      - .github/workflows/early-signed-pole-splice-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  early-signed-pole-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Validate source without changing production
        run: |
          set -euo pipefail
          BASE=0df13fafe0f4639ae3597021929a09eefb01acf0
          git fetch --no-tags origin "$BASE"
          python -m py_compile diagnostics/curvature_consistency/strong_D_early_signed_pole_N640.py
          git diff --exit-code "$BASE" HEAD -- engine/production_kernel.py engine/scalar_system.py engine/stress_energy.py
          python - <<'PY'
          from diagnostics.curvature_consistency.strong_D_early_signed_pole_N640 import N,RMAX,CFL,TFINAL,SAMPLE
          assert (N,RMAX,CFL,TFINAL,SAMPLE)==(640,80.0,0.0075,12.0,0.0625)
          print("settings admitted", N, RMAX, CFL, TFINAL, SAMPLE)
          PY
      - name: Run one targeted N640 production trajectory through early sign exchange and late ridge
        run: python diagnostics/curvature_consistency/strong_D_early_signed_pole_N640.py
      - name: Upload full signed profiles and term budget
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strong-D-signed-pole-N640-through-t12
          path: runs/strong-D-early-signed-pole-N640/
          if-no-files-found: warn
          retention-days: 90
