name: Current-source fixed-R one-step ledger

on:
  pull_request:
    paths:
      - ".github/workflows/current_source_fixed_r_ledger.yml"
      - "tools/audit_current_source_fixed_r_ledger.py"
      - "tools/audit_em_total_energy_budget.py"
      - "tools/fixed_r_discriminators.py"
      - "engine/campaign.py"
      - "engine/cmc_gauge.py"
      - "engine/cosmology_observables.py"
      - "engine/handoff.py"
      - "engine/invariant_diagnostics.py"
      - "engine/matter_rhs.py"
      - "engine/matter_system.py"
      - "engine/native_geometry/**"
      - "engine/production_contract.py"
      - "engine/production_kernel.py"
      - "engine/radial_maxwell.py"
      - "engine/run_production.py"
      - "engine/scalar_system.py"
      - "engine/stress_energy.py"
      - "engine/v55_initial.py"
      - "engine/v55_matter.py"
      - "engine/valencia.py"
      - "engine/v55_pirk_adapter.py"
      - "engine/worldtube.py"
      - ".gitmodules"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/current_source_fixed_r_ledger.yml"
      - "tools/audit_current_source_fixed_r_ledger.py"
      - "tools/audit_em_total_energy_budget.py"
      - "tools/fixed_r_discriminators.py"
      - "engine/campaign.py"
      - "engine/cmc_gauge.py"
      - "engine/cosmology_observables.py"
      - "engine/handoff.py"
      - "engine/invariant_diagnostics.py"
      - "engine/matter_rhs.py"
      - "engine/matter_system.py"
      - "engine/native_geometry/**"
      - "engine/production_contract.py"
      - "engine/production_kernel.py"
      - "engine/radial_maxwell.py"
      - "engine/run_production.py"
      - "engine/scalar_system.py"
      - "engine/stress_energy.py"
      - "engine/v55_initial.py"
      - "engine/v55_matter.py"
      - "engine/valencia.py"
      - "engine/v55_pirk_adapter.py"
      - "engine/worldtube.py"
      - ".gitmodules"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-source-fixed-r-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  witness:
    name: One-step current-source fixed-R witness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run one-step current-source fixed-R witness
        run: |
          mkdir -p artifacts
          python tools/audit_current_source_fixed_r_ledger.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output artifacts/current-source-fixed-r-ledger.json

      - name: Preserve signed ledger report
        uses: actions/upload-artifact@v4
        with:
          name: current-source-fixed-r-ledger-${{ github.sha }}
          path: artifacts/current-source-fixed-r-ledger.json
          if-no-files-found: error
          retention-days: 14
