name: Issue 4 Gate C matter-violation control (diagnostic)

on:
  push:
    branches:
      - diag/issue4-hamiltonian-slot-decomposition-2026-11-08
    paths:
      - tools/issue4_gate_c_matter_violation_control.py
      - .github/workflows/issue4-gate-c-matter-violation-control.yml
  workflow_dispatch:
    inputs:
      eta_rho:
        description: dark-matter density scaling amplitude
        default: "0.5"
      eta_j:
        description: baryon momentum perturbation amplitude
        default: "0.2"
      study:
        description: "matter (2x2 matter/lapse) or lapse (lapse-variant study)"
        default: "lapse"

permissions:
  contents: read
  actions: read

concurrency:
  group: issue4-gate-c-matter-violation-control
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Same role as in issue4-exact-profile-momentum-tangent.yml: the 7f47669a checkout.
      COSMOS_PINNED_SOURCE_ROOT: ${{ github.workspace }}/helper-baseline
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout exact diagnostic source anchor
        uses: actions/checkout@v4
        with:
          ref: 4aec88d0e3ff028e0a65a8ac36b30948625df792
          path: diagnostic-source
          fetch-depth: 0
          submodules: recursive

      - name: Checkout protected helper baseline
        uses: actions/checkout@v4
        with:
          ref: 7f47669a1c0edfafef9fc5f27b2db80840d3f035
          path: helper-baseline
          fetch-depth: 0
          submodules: recursive

      - name: Assert protected production/vendor/dependency source equals 4aec88d0
        run: git diff --exit-code 4aec88d0e3ff028e0a65a8ac36b30948625df792 -- engine vendor .gitmodules requirements.txt

      - name: Download exact #420 t=0.60 endpoint profiles N=60
        uses: actions/download-artifact@v4
        with:
          name: origin-full-continuous-metric-evolved-N60-t0.6-2026-10-24
          path: input/N60
          github-token: ${{ github.token }}
          repository: miahpenn/0-Cosmos-engine
          run-id: 40156226086

      - name: Download exact #420 t=0.60 endpoint profiles N=120
        uses: actions/download-artifact@v4
        with:
          name: origin-full-continuous-metric-evolved-N120-t0.6-2026-10-24
          path: input/N120
          github-token: ${{ github.token }}
          repository: miahpenn/0-Cosmos-engine
          run-id: 40156226086

      - name: Download exact #420 t=0.60 endpoint profiles N=240
        uses: actions/download-artifact@v4
        with:
          name: origin-full-continuous-metric-evolved-N240-t0.6-2026-10-24
          path: input/N240
          github-token: ${{ github.token }}
          repository: miahpenn/0-Cosmos-engine
          run-id: 40156226086

      - name: Setup pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"

      - name: Install pinned numerical environment
        run: python -m pip install numpy==2.5.4 scipy==1.18.1 sympy==1.14.0 mpmath==1.3.0 pytest==9.1.1 threadpoolctl

      - name: Build baseline and matter-violation fixtures (unmodified exact-profile pipeline)
        run: |
          mkdir -p gate-c-matter
          python tools/issue4_gate_c_matter_violation_control.py --phase build \
            --study "${{ github.event.inputs.study || 'lapse' }}" \
            --manifest gate-c-matter/manifest.json \
            --input-dir 60=input/N60 --input-dir 120=input/N120 --input-dir 240=input/N240 \
            --work-dir gate-c-matter/work \
            --eta-rho "${{ github.event.inputs.eta_rho || '0.5' }}" \
            --eta-j "${{ github.event.inputs.eta_j || '0.2' }}"

      - name: Evaluate both through the unchanged locked predictor (separate process)
        run: |
          python tools/issue4_gate_c_matter_violation_control.py --phase evaluate \
            --manifest gate-c-matter/manifest.json \
            --diagnostic-source "$GITHUB_WORKSPACE/diagnostic-source" \
            --helper-baseline "$GITHUB_WORKSPACE/helper-baseline" \
            --output gate-c-matter/gate-c-matter-violation-control.json
          sha256sum gate-c-matter/gate-c-matter-violation-control.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue4-gate-c-matter-violation-control-${{ github.run_id }}
          path: gate-c-matter/gate-c-matter-violation-control.json
          if-no-files-found: warn
          retention-days: 90
