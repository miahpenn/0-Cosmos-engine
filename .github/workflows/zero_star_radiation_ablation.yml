# [run-radiation-ablation] Clean-head rerun with environment read fixed.
# [run-radiation-ablation] Clean-head rerun after shell expansion correction.
# Clean-head rerun after fixing workflow boolean expansion.
# Controlled radiation-sector ablation diagnostic.
# This is diagnostic only: it compares the same V5.5 CMC engine with
# radiation included and excluded, without changing any equation or
# production parameter.
name: "[0star] Radiation-sector ablation diagnostic"

on:
  workflow_dispatch:
  push:
    branches:
      - 0star-central-clock

env:
  PYTHONPATH: .

jobs:
  radiation-ablation:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-radiation-ablation]')
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        include_radiation: [true, false]
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run repository tests
        run: python -m pytest -q

      - name: Run controlled ablation
        run: |
          python - <<'PY'
          import json
          import pathlib
          from engine.true_cmc_pirk_kernel import V55TrueCMCPIRKKernel

          import os\n          include_radiation = os.environ["INCLUDE_RADIATION"].strip().lower() == "true"
          kernel = V55TrueCMCPIRKKernel()
          state = kernel.initialize(
              resolution=80,
              r_max=80.0,
              include_radiation=include_radiation,
          )
          dt = 0.06 * state.grid.dr
          final_time = 50.0
          failure = None

          while state.t < final_time:
              dt_step = min(dt, final_time - state.t)
              try:
                  state = kernel.step(state, dt_step)
                  state.geometry.assert_finite_positive()
              except (FloatingPointError, ValueError) as exc:
                  failure = {
                      "type": type(exc).__name__,
                      "message": str(exc),
                      "t": float(state.t),
                      "tau": float(state.tau),
                  }
                  break

          result = {
              "resolution": 80,
              "r_max": 80.0,
              "cfl": 0.06,
              "final_time_target": final_time,
              "include_radiation": bool(include_radiation),
              "t_final": float(state.t),
              "tau_final": float(state.tau),
              "steps": len(state.history),
              "turnaround_events": sum(
                  e.kind == "turnaround" for e in state.cycle.events
              ),
              "reexpansion_events": sum(
                  e.kind == "re-expansion_crossing"
                  for e in state.cycle.events
              ),
              "trapped_root_count_max": max(
                  (len(row.get("trapped_roots", [])) for row in state.history),
                  default=0,
              ),
              "failure": failure,
              "last_diagnostics": (
                  state.history[-1]
                  if state.history else kernel.diagnostics(state, profiles=False)
              ),
          }

          out = "runs/0star-radiation-ablation-" + (
              "on" if include_radiation else "off"
          )
          pathlib.Path(out).mkdir(parents=True, exist_ok=True)
          pathlib.Path(out, "result.json").write_text(
              json.dumps(result, indent=2, default=float)
          )
          print(json.dumps(result, indent=2, default=float))
          PY
        env:
          INCLUDE_RADIATION: ${{ matrix.include_radiation }}

      - name: Upload ablation result
        uses: actions/upload-artifact@v4
        with:
          name: 0star-radiation-ablation-${{ matrix.include_radiation }}
          path: runs/0star-radiation-ablation-${{ matrix.include_radiation == true && 'on' || 'off' }}/result.json
          if-no-files-found: error
