name: Diagnostic - origin half-cell only high-resolution matched-time A/B

on:
  push:
    branches:
      - diag/origin-half-cell-only-highres-2026-10-13
    paths:
      - engine/v55_initial.py
      - tools/validate_origin_half_cell_only_highres.py
      - tests/test_origin_half_cell_quadrature.py
      - .github/workflows/origin-half-cell-only-highres.yml

permissions:
  contents: read

concurrency:
  group: origin-half-cell-only-highres-2026-10-13
  cancel-in-progress: false

jobs:
  matched-time-origin-only-highres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "c01f2467347e8aebd57d220374fd7bc4e93045bc"
      BASE_INITIAL_BLOB: "4cfbfe4be6ac3ce6ed492f4e435186997d94116a"
      BASE_KERNEL_BLOB: "2954e7a79656849b5f088053ea0f4ac97d4bb443"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
    steps:
      - name: Check out high-resolution diagnostic branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository requirements
        run: python -m pip install -r requirements.txt

      - name: Compile observer and analytic moment test
        run: |
          python -m py_compile tools/validate_origin_half_cell_only_highres.py
          python -m py_compile tests/test_origin_half_cell_quadrature.py

      - name: Fail closed on source, vendor, and dependency drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT:engine/v55_initial.py")" = "$BASE_INITIAL_BLOB"
          test "$(git rev-parse "$SOURCE_COMMIT:engine/production_kernel.py")" = "$BASE_KERNEL_BLOB"
          test "$(git rev-parse "HEAD:engine/production_kernel.py")" = "$BASE_KERNEL_BLOB"
          test "$(git rev-parse "HEAD:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          changed_engine="$(git diff --name-only "$SOURCE_COMMIT" HEAD -- engine)"
          test "$changed_engine" = "engine/v55_initial.py"
          changed_forbidden="$(git diff --name-only "$SOURCE_COMMIT" HEAD -- vendor .gitmodules requirements.txt pyproject.toml)"
          if [ -n "$changed_forbidden" ]; then
            printf 'Forbidden source/vendor/dependency changes:\n%s\n' "$changed_forbidden"
            exit 1
          fi
          printf 'SOURCE_COMMIT=%s\nBASE_INITIAL_BLOB=%s\nCANDIDATE_INITIAL_BLOB=%s\nKERNEL_BLOB=%s\nVENDOR_COMMIT=%s\n' \
            "$SOURCE_COMMIT" "$BASE_INITIAL_BLOB" "$(git rev-parse HEAD:engine/v55_initial.py)" \
            "$BASE_KERNEL_BLOB" "$VENDOR_COMMIT"

      - name: Run complete repository regression suite
        run: python -m pytest -q

      - name: Run high-resolution matched-time baseline vs origin-half-cell-only A/B
        run: python tools/validate_origin_half_cell_only_highres.py

      - name: Upload paired high-resolution reports and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origin-half-cell-only-highres-matched-time
          path: results/origin-half-cell-only-highres/
          if-no-files-found: warn
          retention-days: 90
