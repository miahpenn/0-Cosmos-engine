name: Diagnostic - saved momentum propagation versus RHS tangent

on:
  push:
    branches:
      - diag/lambda-connection-budget-2026-10-12
    paths:
      - tools/momentum_constraint_propagation_intervals.py
      - tools/semidiscrete_momentum_tangent.py
      - .github/workflows/momentum-constraint-propagation-intervals.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: momentum-constraint-propagation-intervals
  cancel-in-progress: false

jobs:
  saved-state-propagation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout diagnostic tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact production source and pinned vendor
        uses: actions/checkout@v4
        with:
          ref: 6d8b3f2790644591326df57c55908863f994cb0c
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Download the admitted t=12 campaign artifact
        uses: actions/download-artifact@v4
        with:
          name: v55-production-t12-n40-n60-n80
          run-id: 38208253687
          github-token: ${{ github.token }}
          path: source-artifact

      - name: Compile the offline propagation diagnostic
        run: python -m py_compile tools/momentum_constraint_propagation_intervals.py tools/semidiscrete_momentum_tangent.py

      - name: Compare saved momentum changes with endpoint RHS tangents
        run: |
          PYTHONPATH=source python tools/momentum_constraint_propagation_intervals.py \
            --campaign-artifact source-artifact \
            --output-dir results/momentum-constraint-propagation-intervals

      - name: Upload interval comparisons and full profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-constraint-propagation-intervals
          path: results/momentum-constraint-propagation-intervals/
          if-no-files-found: warn
          retention-days: 90
