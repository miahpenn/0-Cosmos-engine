name: Research - current-source origin initializer/moment crosswalk

# HISTORICAL (re-pinned 2026-11-08). This crosswalk studies the pre-fix initializer
# origin recurrence (rectangle over [0, r0] plus trapezoids), which #439 replaced with
# a fourth-order origin quadrature. It now runs, unchanged, at its pinned commit
# (main immediately before #439), where its copied recurrence matches production.
# It no longer triggers on engine changes; it runs when this file changes or by hand.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/current-source-origin-initializer-moment-crosswalk.yml

permissions:
  contents: read

concurrency:
  group: current-source-origin-initializer-moment-crosswalk
  cancel-in-progress: false

jobs:
  audit-current-source-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the pinned historical commit and its vendor
        uses: actions/checkout@v4
        with:
          ref: 385e6dc011c15524735242d3b55950b212130df1
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository requirements
        run: python -m pip install -r requirements.txt

      - name: Compile crosswalk and run focused integrity tests
        run: |
          python -m py_compile tools/audit_current_source_origin_initializer_moment_crosswalk.py
          python -m py_compile tests/test_current_source_origin_initializer_moment_crosswalk.py
          python -m pytest -q tests/test_current_source_origin_initializer_moment_crosswalk.py

      - name: Run one source-pinned no-evolution initializer/moment crosswalk
        run: python tools/audit_current_source_origin_initializer_moment_crosswalk.py

      - name: Upload source-current signed witnesses and profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-source-origin-initializer-moment-crosswalk-2026-10-17
          path: results/current-source-origin-initializer-moment-crosswalk-2026-10-17/
          if-no-files-found: warn
          retention-days: 90
