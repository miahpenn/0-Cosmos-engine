name: Diagnostic - uniform CMC centre-row one-step

on:
  push:
    branches:
      - diag/pr16-cmc-centre-row-one-step-2026-10-13
    paths:
      - "tools/audit_uniform_cmc_centre_row_one_step.py"
      - "tools/audit_uniform_cmc_centre_row_counterfactual.py"
      - "tools/audit_uniform_radial_quadrature_initial_profile.py"
      - "tools/origin_half_cell_quadrature_regularity_ab.py"
      - "tools/origin_half_cell_quadrature_regularity_ab.py"
      - ".github/workflows/pr16-cmc-centre-row-baseline-init.yml"

permissions:
  contents: read

concurrency:
  group: pr16-cmc-centre-row-baseline-init-2026-10-13
  cancel-in-progress: false

jobs:
  bounded-one-step:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: 9f0bd16d403ada22a4f21413048c93b37c9924a7
      VENDOR_COMMIT: d6052d605673ce9d82cdc99b0df79855fa2ea215

    steps:
      - name: Checkout isolated diagnostic branch and pinned submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned-source dependencies
        run: python -m pip install -r requirements.txt

      - name: Fail closed on source and diagnostic helper drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_COMMIT"
          for path in \
            engine/production_kernel.py \
            engine/cmc_gauge.py \
            engine/v55_initial.py \
            engine/v55_pirk_adapter.py \
            engine/v55_matter.py \
            engine/matter_system.py \
            engine/scalar_system.py \
            engine/stress_energy.py \
            engine/valencia.py; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SOURCE_COMMIT:$path")"
            printf 'SOURCE_BLOB_OK %s\n' "$path"
          done
          test "$(git rev-parse "HEAD:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          printf 'SOURCE_COMMIT=%s\nVENDOR_COMMIT=%s\n' "$SOURCE_COMMIT" "$VENDOR_COMMIT"

      - name: Compile one-step audit and frozen initializer
        run: |
          python -m py_compile tools/audit_uniform_cmc_centre_row_one_step.py
          python -m py_compile tools/audit_uniform_cmc_centre_row_counterfactual.py
          python -m py_compile tools/audit_uniform_radial_quadrature_initial_profile.py
          python -m py_compile tools/origin_half_cell_quadrature_regularity_ab.py
          python -m py_compile tools/origin_half_cell_quadrature_regularity_ab.py

      - name: Run one normal production step for each centre-row variant
        run: PYTHONPATH=. python tools/audit_uniform_cmc_centre_row_one_step.py

      - name: Record provenance and report digest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/pr16-cmc-centre-row-baseline-init
          printf '%s\n' "$SOURCE_COMMIT" > results/pr16-cmc-centre-row-baseline-init/SOURCE_COMMIT.txt
          printf '%s\n' "$VENDOR_COMMIT" > results/pr16-cmc-centre-row-baseline-init/VENDOR_COMMIT.txt
          git rev-parse HEAD > results/pr16-cmc-centre-row-baseline-init/DIAGNOSTIC_COMMIT.txt
          git rev-parse HEAD:tools/audit_uniform_cmc_centre_row_one_step.py > results/pr16-cmc-centre-row-baseline-init/ONE_STEP_TOOL_BLOB.txt
          git rev-parse HEAD:tools/audit_uniform_cmc_centre_row_counterfactual.py > results/pr16-cmc-centre-row-baseline-init/CENTRE_ROW_HELPER_BLOB.txt
          git rev-parse HEAD:tools/audit_uniform_radial_quadrature_initial_profile.py > results/pr16-cmc-centre-row-baseline-init/INITIAL_PROFILE_HELPER_BLOB.txt
          git rev-parse HEAD:tools/origin_half_cell_quadrature_regularity_ab.py > results/pr16-cmc-centre-row-baseline-init/ORIGIN_QUADRATURE_HELPER_BLOB.txt
          git rev-parse HEAD:tools/origin_half_cell_quadrature_regularity_ab.py > results/pr16-cmc-centre-row-baseline-init/ORIGIN_QUADRATURE_HELPER_BLOB.txt
          if test -f results/pr16-cmc-centre-row-baseline-init/report.json; then
            (cd results/pr16-cmc-centre-row-baseline-init && sha256sum report.json > REPORT_SHA256SUM.txt)
          fi

      - name: Upload stage and admission evidence even if a variant fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr16-cmc-centre-row-baseline-init
          path: results/pr16-cmc-centre-row-baseline-init/
          if-no-files-found: warn
          retention-days: 90
