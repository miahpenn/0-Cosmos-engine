name: Diagnostic - corrected origin half-cell closure full evolution

on:
  push:
    branches: [diag/origin-full-continuous-metric-evolved-2026-10-24]
    paths:
      - tools/audit_origin_cell_joint_shadow_evolved.py
      - .github/workflows/origin-cell-joint-shadow-evolved.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/audit_origin_cell_joint_shadow_evolved.py
      - .github/workflows/origin-cell-joint-shadow-evolved.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: origin-cell-joint-shadow-evolved-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  full-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        resolution: [60, 120, 240]
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "4aec88d0e3ff028e0a65a8ac36b30948625df792"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
      ORIGIN_EVOLUTION_RESOLUTION: ${{ matrix.resolution }}
      ORIGIN_EVOLUTION_ARMS: full_continuous_metric_profile
      BASELINE_ARTIFACT_DIR: baseline-reference/N${{ matrix.resolution }}
      ORIGIN_EVOLUTION_OUT: results/origin-full-continuous-metric-evolved-N${{ matrix.resolution }}-t0.6-2026-10-24
    steps:
      - name: Check out diagnostic branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download matching pinned baseline accepted-state artifact
        uses: actions/download-artifact@v4
        with:
          name: evolved-origin-aa-regularity-N${{ matrix.resolution }}-t0.6-2026-10-24
          path: baseline-reference/N${{ matrix.resolution }}
          github-token: ${{ github.token }}
          run-id: 40127716287

      - name: Fail closed if protected production/vendor/dependency files drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT")" = "$SOURCE_COMMIT"
          test "$(git rev-parse "HEAD:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          protected_diff="$(git diff --name-only "$SOURCE_COMMIT" HEAD -- engine vendor .gitmodules requirements.txt)"
          if [[ -n "$protected_diff" ]]; then
            echo "Unexpected changes to protected production/vendor/dependency paths:"
            echo "$protected_diff"
            exit 1
          fi
          echo "SOURCE_COMMIT=$SOURCE_COMMIT"
          echo "VENDOR_COMMIT=$VENDOR_COMMIT"
          echo "PROTECTED_SOURCE_DIFF=empty"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository requirements
        run: python -m pip install -r requirements.txt

      - name: Compile diagnostic observer
        run: python -m py_compile tools/audit_origin_cell_joint_shadow_one_step.py tools/audit_origin_cell_joint_shadow_evolved.py

      - name: Evolve only the full continuous-metric shadow through accepted t=0.60
        run: python tools/audit_origin_cell_joint_shadow_evolved.py

      - name: Upload full-state, residual-history and comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origin-full-continuous-metric-evolved-N${{ matrix.resolution }}-t0.6-2026-10-24
          path: results/origin-full-continuous-metric-evolved-N${{ matrix.resolution }}-t0.6-2026-10-24/
          if-no-files-found: warn
          retention-days: 90
