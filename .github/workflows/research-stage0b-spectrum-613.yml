name: Research Stage 0b frozen spectral pilots (PR 613)
on:
  push:
    branches: [research/stage0b-spectrum-613]
    paths: [.github/workflows/research-stage0b-spectrum-613.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: research-stage0b-spectrum-613
  cancel-in-progress: false
env:
  SOURCE_SHA: 'cbf4e6bd759271b2ca15295db8f13e570e8fa3aa'
  HARNESS_SHA: 'fe616516f637174544b4d9c7a1b55872b0c3c00f'
  VENDOR_SHA: 'd6052d605673ce9d82cdc99b0df79855fa2ea215'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
  OUT: /tmp/stage0b-output
jobs:
  spectrum:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: [flat, native]
    env:
      MODE: ${{ matrix.mode }}
      ARM: 1a_dr05_dt0_r8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbf4e6bd759271b2ca15295db8f13e570e8fa3aa
          path: source
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fe616516f637174544b4d9c7a1b55872b0c3c00f
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - name: Verify exact source and harness; pin numerical runtime
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C harness rev-parse HEAD)" = "$HARNESS_SHA"
          test "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_SHA"
          test -z "$(git -C source status --porcelain --untracked-files=no)"
          git -C source submodule status --recursive | tee "$OUT/submodules.txt"
          ! grep -E '^[-+U]' "$OUT/submodules.txt"
          python -m pip install numpy==2.5.5 scipy==1.18.1 sympy==1.14.0 mpmath==1.3.0 pytest==9.2.0 iniconfig==2.3.1 packaging==26.4 pluggy==1.7.0 pygments==2.21.0
          python -m pip freeze > "$OUT/dependencies.txt"
          python -c 'import sys,numpy as n; print(sys.version); n.show_runtime()' | tee "$OUT/runtime.txt"
          lscpu > "$OUT/cpu.txt"
          sha256sum harness/research/control_tests/stage0b_spectrum.py > "$OUT/harness_script.sha256"
          python -m py_compile harness/research/control_tests/stage0b_spectrum.py
      - name: Retrieve immutable Stage 0 trace archive from completed run
        uses: actions/download-artifact@v4
        with:
          name: stage0-${{ matrix.mode }}-1a_dr05_dt0_r8
          path: /tmp/stage0-reference
          run-id: 45719840837
          github-token: ${{ github.token }}
      - name: Verify archived Stage 0 file digests
        run: |
          set -euo pipefail
          cd /tmp/stage0-reference
          sha256sum -c SHA256SUMS | tee "$OUT/reference_checks.txt"
          cp SHA256SUMS "$OUT/reference_SHA256SUMS.txt"
      - name: Assemble and analyze both initial geometry-block operators
        working-directory: source
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          status=0
          for switch in off on; do
            mkdir -p "$OUT/$switch"
            set +e
            python ../harness/research/control_tests/stage0b_spectrum.py "$ARM" "$MODE" "$switch" /tmp/stage0-reference "$OUT/$switch" 2>&1 | tee "$OUT/$switch/run.log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "$rc" > "$OUT/$switch/exit_code.txt"
            if test "$rc" != 0; then status=1; fi
          done
          test -z "$(git status --porcelain --untracked-files=no)"
          exit "$status"
      - name: Print reproducible spectral readback from completed arms
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          for sw in ("off","on"):
              p=Path(os.environ["OUT"])/sw/"report.json"
              if not p.exists(): continue
              r=json.loads(p.read_text())
              print(sw, r["status"], "initial hash mismatches:", r["initial_hash_mismatches"])
              if r["status"]!="completed_diagnostic": continue
              for name in ("conditional_rhs_fixed_incoming_lapse","actual_step_projected_geometry"):
                  s=r[name]
                  print(sw,name,json.dumps({k:s[k] for k in ("max_real","max_abs_omega","near_zero_map_multipliers","top_growth","frequency_neighbours_not_identifications")},allow_nan=False))
          PY
      - name: Checksum result files
        if: always()
        run: |
          if test -d "$OUT"; then
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage0b-${{ matrix.mode }}-coarse
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90

  engine-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbf4e6bd759271b2ca15295db8f13e570e8fa3aa
          path: source
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fe616516f637174544b4d9c7a1b55872b0c3c00f
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - name: Verify exact source and harness; pin numerical runtime
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C harness rev-parse HEAD)" = "$HARNESS_SHA"
          test "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_SHA"
          test -z "$(git -C source status --porcelain --untracked-files=no)"
          git -C source submodule status --recursive | tee "$OUT/submodules.txt"
          ! grep -E '^[-+U]' "$OUT/submodules.txt"
          python -m pip install numpy==2.5.5 scipy==1.18.1 sympy==1.14.0 mpmath==1.3.0 pytest==9.2.0 iniconfig==2.3.1 packaging==26.4 pluggy==1.7.0 pygments==2.21.0
          python -m pip freeze > "$OUT/dependencies.txt"
          python -c 'import sys,numpy as n; print(sys.version); n.show_runtime()' | tee "$OUT/runtime.txt"
          lscpu > "$OUT/cpu.txt"
          sha256sum harness/research/control_tests/stage0b_spectrum.py > "$OUT/harness_script.sha256"
          python -m py_compile harness/research/control_tests/stage0b_spectrum.py
      - name: Full repository and engine control tests
        working-directory: source
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          python -m pytest -q | tee "$OUT/pytest.txt"
          python -m engine.run_controls | tee "$OUT/controls.txt"
          python -m pytest -q tests/test_radial_maxwell.py | tee "$OUT/maxwell.txt"
      - name: Checksum result files
        if: always()
        run: |
          if test -d "$OUT"; then
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage0b-engine-suites
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90
