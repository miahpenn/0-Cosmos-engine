name: Research Stage 0c.4a bounded runtime discriminator
on:
  push:
    branches: [research/stage0c4a-runtime-discriminator]
    paths: [.github/workflows/research-stage0c4a-runtime-discriminator.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: stage0c4a-runtime-discriminator
  cancel-in-progress: false
env:
  SOURCE_SHA: 'cbf4e6bd759271b2ca15295db8f13e570e8fa3aa'
  VENDOR_SHA: 'd6052d605673ce9d82cdc99b0df79855fa2ea215'
  PROBE_SHA: 'c2a758cc33bb58431c1a00841d39b67e4b27b196'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
  OUT: /tmp/stage0c4a-runtime
jobs:
  matched-operand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbf4e6bd759271b2ca15295db8f13e570e8fa3aa
          path: source
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c2a758cc33bb58431c1a00841d39b67e4b27b196
          path: probe
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - name: Verify exact source and runtime
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C source/vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_SHA"
          test "$(git -C probe rev-parse HEAD)" = "$PROBE_SHA"
          test -z "$(git -C source status --porcelain --untracked-files=no)"
          git -C source submodule status --recursive > "$OUT/submodules.txt"
          ! grep -E '^[-+U]' "$OUT/submodules.txt"
          python -m pip install numpy==2.5.5 scipy==1.18.1 sympy==1.14.0 mpmath==1.3.0 pytest==9.2.0 iniconfig==2.3.1 packaging==26.4 pluggy==1.7.0 pygments==2.21.0 threadpoolctl==3.6.0
          python -m pip freeze > "$OUT/dependencies.txt"
          lscpu > "$OUT/cpu.txt"
          sha256sum probe/research/control_tests/stage0c4a_runtime_discriminator.py > "$OUT/probe.sha256"
          python -m py_compile probe/research/control_tests/stage0c4a_runtime_discriminator.py
      - name: Verify and recover exact Stage 0 archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15072268968" > "$OUT/archive_metadata.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ["OUT"])/"archive_metadata.json").read_text())
          assert p["id"]==15072268968 and p["workflow_run"]["id"]==45719840837 and not p["expired"]
          assert p["digest"]=="sha256:38b33b7c91b32360646a8b6a757c0c289feca9228ad533965ddc253fb711a474"
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15072268968/zip" > /tmp/stage0-runtime.zip
          echo '38b33b7c91b32360646a8b6a757c0c289feca9228ad533965ddc253fb711a474  /tmp/stage0-runtime.zip' | sha256sum -c
          unzip -q /tmp/stage0-runtime.zip -d /tmp/stage0-runtime-reference
          (cd /tmp/stage0-runtime-reference && sha256sum -c SHA256SUMS) | tee "$OUT/archive_checks.txt"
      - name: Bounded comparison on one host; no accepted evolution
        working-directory: source
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          python ../probe/research/control_tests/stage0c4a_runtime_discriminator.py parent /tmp/stage0-runtime-reference "$OUT" | tee "$OUT/run.log"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Checksum all outputs including blockers
        if: always()
        run: |
          if test -d "$OUT"; then
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage0c4a-runtime-discriminator
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90
