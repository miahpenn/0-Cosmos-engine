name: CMC boundary scaffold admission checks

on:
  push:
    branches:
      - diag/independent-metric-ricci-audit
    paths:
      - engine/cmc_gauge.py
      - engine/production_kernel.py
      - diagnostics/curvature_consistency/r160_alpha_boundary_r79_75.json
      - diagnostics/curvature_consistency/boundary_alpha_series.py
      - diagnostics/curvature_consistency/boundary-matched-cmc-scaffolding-2026-10-11.md
      - tests/test_boundary_alpha_series.py
      - .github/workflows/cmc-boundary-scaffold.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download exact admitted R80 state-capture artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r80-reference
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/miahpenn/0-Cosmos-engine/actions/artifacts/11706797173/zip" \
            -o /tmp/r80-reference/artifact.zip
          unzip -q /tmp/r80-reference/artifact.zip -d /tmp/r80-reference/unpacked
          find /tmp/r80-reference/unpacked -type f -name 'rmax080_N160_production_full_state_profiles.jsonl' -print -quit > /tmp/r80-reference/profile_path.txt
          test -s /tmp/r80-reference/profile_path.txt
      - name: Exact initialization state match against archived R80 capture
        env:
          PYTHONPATH: .
          REFERENCE_PROFILE_PATH: /tmp/r80-reference/profile_path.txt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import numpy as np
          from engine.production_kernel import V55ProductionKernel
          def assert_state_roundoff_equal(actual, expected, label, evolved=False):
              """Compare each state array using a 512-epsilon field-scale bound."""
              eps = np.finfo(float).eps
              failures = []
              worst_ratio, worst_name = 0.0, None
              def check(name, a, e):
                  nonlocal worst_ratio, worst_name
                  a = np.asarray(a, dtype=float)
                  e = np.asarray(e, dtype=float)
                  if a.shape != e.shape:
                      failures.append({"field": name, "shape_actual": a.shape, "shape_expected": e.shape})
                      return
                  scale = max(float(np.max(np.abs(e))) if e.size else 0.0, np.finfo(float).tiny)
                  tolerance = 512.0 * eps * scale
                  # Aa and Lambda can be tiny cancellation-derived quantities;
                  # bound their absolute roundoff without loosening other fields.
                  if name in ("geometry.Aa", "geometry.Lambda"):
                      tolerance = max(tolerance, 2.0e-15)
                  if evolved:
                      # One-step replay includes propagated initialization/LAPACK noise.
                      tolerance = max(tolerance, 1.0e-10 * scale, 1.0e-14)
                  error = float(np.max(np.abs(a - e))) if a.size else 0.0
                  ratio = error / tolerance
                  if ratio > worst_ratio:
                      worst_ratio, worst_name = ratio, name
                  if not np.all(np.isfinite(a)) or error > tolerance:
                      failures.append({"field": name, "max_abs": error, "scale": scale,
                                       "tolerance": tolerance, "ratio": ratio})
              for group in ("geometry", "scalars"):
                  for name in actual[group]:
                      check(f"{group}.{name}", actual[group][name], expected[group][name])
              for species in actual["matter"]:
                  for field in actual["matter"][species]:
                      check(f"matter.{species}.{field}",
                            actual["matter"][species][field],
                            expected["matter"][species][field])
              if failures:
                  raise AssertionError(
                      f"{label} exceeds a 512-epsilon field-scale envelope: "
                      + json.dumps(failures[:24], sort_keys=True)
                  )
              mode = "evolved replay rtol=1e-10/atol=1e-14" if evolved else "512 eps of field scale, with 2e-15 Aa/Lambda floor"
              print(f"PASS: {label} within {mode}; worst ratio={worst_ratio:.6g} ({worst_name}).")
          p = Path(Path(os.environ["REFERENCE_PROFILE_PATH"]).read_text().strip())
          with p.open() as f:
              reference = json.loads(next(f))
          assert reference["schema"] == "strong_D_evolved_state_r80_capture_v1"
          assert reference["label"] == "t=0"
          kernel = V55ProductionKernel()
          state = kernel.initialize(
              resolution=160, r_max=80.0, amplitude=0.01, width=7.0,
              D_amplitude=1.0e-4, include_radiation=True,
          )
          snapshot = {
              "geometry": {name: [float(x) for x in np.asarray(getattr(state.geometry, name), dtype=float)]
                           for name in ("a", "b", "X", "alpha", "beta", "Aa", "K", "Lambda", "B")},
              "scalars": {name: [float(x) for x in np.asarray(getattr(state.scalars, name), dtype=float)]
                          for name in ("S", "PS", "D", "PD", "phi", "Pi")},
              "matter": {
                  species_name: {
                      name: [float(x) for x in np.asarray(getattr(getattr(state.matter, species_name), name), dtype=float)]
                      for name in ("rest", "energy_t", "momentum_r")
                  }
                  for species_name in ("dark_matter", "baryons", "radiation")
              },
          }
          assert_state_roundoff_equal(snapshot, reference["state_snapshot"], "diagnostic-off t=0 initialization")
          PY
      - name: Exact short evolution match against archived R80 t=0.25 state
        env:
          PYTHONPATH: .
          REFERENCE_PROFILE_PATH: /tmp/r80-reference/profile_path.txt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import numpy as np
          from engine.production_kernel import V55ProductionKernel
          def assert_state_roundoff_equal(actual, expected, label, evolved=False):
              """Compare each state array using a 512-epsilon field-scale bound."""
              eps = np.finfo(float).eps
              failures = []
              worst_ratio, worst_name = 0.0, None
              def check(name, a, e):
                  nonlocal worst_ratio, worst_name
                  a = np.asarray(a, dtype=float)
                  e = np.asarray(e, dtype=float)
                  if a.shape != e.shape:
                      failures.append({"field": name, "shape_actual": a.shape, "shape_expected": e.shape})
                      return
                  scale = max(float(np.max(np.abs(e))) if e.size else 0.0, np.finfo(float).tiny)
                  tolerance = 512.0 * eps * scale
                  # Aa and Lambda can be tiny cancellation-derived quantities;
                  # bound their absolute roundoff without loosening other fields.
                  if name in ("geometry.Aa", "geometry.Lambda"):
                      tolerance = max(tolerance, 2.0e-15)
                  if evolved:
                      # One-step replay includes propagated initialization/LAPACK noise.
                      tolerance = max(tolerance, 1.0e-10 * scale, 1.0e-14)
                  error = float(np.max(np.abs(a - e))) if a.size else 0.0
                  ratio = error / tolerance
                  if ratio > worst_ratio:
                      worst_ratio, worst_name = ratio, name
                  if not np.all(np.isfinite(a)) or error > tolerance:
                      failures.append({"field": name, "max_abs": error, "scale": scale,
                                       "tolerance": tolerance, "ratio": ratio})
              for group in ("geometry", "scalars"):
                  for name in actual[group]:
                      check(f"{group}.{name}", actual[group][name], expected[group][name])
              for species in actual["matter"]:
                  for field in actual["matter"][species]:
                      check(f"matter.{species}.{field}",
                            actual["matter"][species][field],
                            expected["matter"][species][field])
              if failures:
                  raise AssertionError(
                      f"{label} exceeds a 512-epsilon field-scale envelope: "
                      + json.dumps(failures[:24], sort_keys=True)
                  )
              mode = "evolved replay rtol=1e-10/atol=1e-14" if evolved else "512 eps of field scale, with 2e-15 Aa/Lambda floor"
              print(f"PASS: {label} within {mode}; worst ratio={worst_ratio:.6g} ({worst_name}).")
          profile = Path(Path(os.environ["REFERENCE_PROFILE_PATH"]).read_text().strip())
          with profile.open() as f:
              rows = [json.loads(line) for line in f if line.strip()]
          reference = next(row for row in rows if row["label"] == "target=0.25")
          kernel = V55ProductionKernel()
          state = kernel.initialize(
              resolution=160, r_max=80.0, amplitude=0.01, width=7.0,
              D_amplitude=1.0e-4, include_radiation=True,
          )
          dt = 0.0075 * float(state.grid.dr)
          while True:
              state = kernel.step(state, dt)
              if state.t + 0.5 * dt >= 0.25 or abs(state.t - 0.25) < 1.0e-12:
                  break
          snapshot = {
              "geometry": {name: [float(x) for x in np.asarray(getattr(state.geometry, name), dtype=float)]
                           for name in ("a", "b", "X", "alpha", "beta", "Aa", "K", "Lambda", "B")},
              "scalars": {name: [float(x) for x in np.asarray(getattr(state.scalars, name), dtype=float)]
                          for name in ("S", "PS", "D", "PD", "phi", "Pi")},
              "matter": {
                  species_name: {
                      name: [float(x) for x in np.asarray(getattr(getattr(state.matter, species_name), name), dtype=float)]
                      for name in ("rest", "energy_t", "momentum_r")
                  }
                  for species_name in ("dark_matter", "baryons", "radiation")
              },
          }
          assert_state_roundoff_equal(
              snapshot, reference["state_snapshot"],
              f"diagnostic-off state at requested t=0.25 (computed t={state.t:.17g})",
              evolved=True,
          )
          PY
      - name: Unit tests — boundary series and CMC optional-argument contract
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_boundary_alpha_series.py
