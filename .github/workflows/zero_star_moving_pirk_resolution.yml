name: "[0star] Moving-gauge strong-field resolution audit"

on:
  workflow_dispatch:
  push:
    branches:
      - 0star-central-clock

env:
  PYTHONPATH: .

jobs:
  moving-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        resolution: [40, 60, 80]
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run repository tests
        run: python -m pytest -q
      - name: Run moving-gauge resolution campaign
        run: |
          python - <<'PY'
          from engine.campaign import CampaignConfig
          from engine.moving_pirk_kernel import V55MovingPIRKKernel
          from engine.run_production import run_campaign

          resolution = int("${{ matrix.resolution }}")
          config = CampaignConfig(
              resolutions=(resolution,),
              r_max=40.0,
              cfl=0.015,
              final_time=30.0,
              checkpoint_interval=0.10,
              output_dir=f'runs/0star-moving-resolution/N{resolution}',
          )
          results = run_campaign(
              kernel=V55MovingPIRKKernel(),
              config=config,
          )
          for result in results:
              print(result)
          failures = [r for r in results if r.status != "completed"]
          if failures:
              raise SystemExit(
                  "Moving-gauge resolution audit reported numerical failure(s): "
                  + "; ".join(f"N{r.resolution}: {r.status}" for r in failures)
              )
          PY
      - name: Upload resolution output
        uses: actions/upload-artifact@v4
        with:
          name: 0star-moving-resolution-N${{ matrix.resolution }}
          path: runs/0star-moving-resolution/N${{ matrix.resolution }}/
          if-no-files-found: error
