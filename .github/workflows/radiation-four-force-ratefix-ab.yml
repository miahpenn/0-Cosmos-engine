name: Radiation four-force rate-fixed A/B gate

on:
  push:
    branches:
      - diag/radiation-four-force-ratefix-ab-2026-10-12
    paths:
      - engine/matter_rhs.py
      - engine/matter_system.py
      - engine/production_kernel.py
      - tests/test_radiation_rhs_admissibility_contract.py
      - tests/test_radiation_four_force_null_identity.py
      - tools/diag_radiation_four_force_counterfactual.py
      - .github/workflows/radiation-four-force-ratefix-ab.yml

permissions:
  contents: read

concurrency:
  group: radiation-four-force-ratefix-ab
  cancel-in-progress: false

jobs:
  regression-and-counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout corrected diagnostic branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Verify pinned vendor
        run: |
          expected="d6052d605673ce9d82cdc99b0df79855fa2ea215"
          actual="$(git rev-parse HEAD:vendor/bb-palatini-unified-r0)"
          test "$actual" = "$expected"
      - name: Compile changed modules and tests
        run: |
          python -m py_compile engine/matter_rhs.py engine/matter_system.py engine/production_kernel.py
          python -m py_compile tests/test_radiation_rhs_admissibility_contract.py tests/test_radiation_four_force_null_identity.py
          python -m py_compile tools/diag_radiation_four_force_counterfactual.py
      - name: Radiation RHS guard-repair regressions
        run: python -m pytest -q tests/test_radiation_rhs_admissibility_contract.py
      - name: Radiation four-force null-identity regressions
        run: python -m pytest -q tests/test_radiation_four_force_null_identity.py
      - name: Full repository regression suite
        run: python -m pytest -q tests
      - name: Four one-step counterfactual comparisons on corrected RHS contract
        env:
          PYTHONPATH: .
        run: python tools/diag_radiation_four_force_counterfactual.py
      - name: Preserve JSON and SHA-256
        if: always()
        run: |
          if [ -f artifacts/radiation_four_force_counterfactual.json ]; then
            sha256sum artifacts/radiation_four_force_counterfactual.json | tee artifacts/radiation_four_force_counterfactual.sha256
          else
            echo "Counterfactual artifact not produced; see earlier failed step logs." > artifacts-run-status.txt
          fi
      - name: Upload four-case outputs regardless of case result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radiation-four-force-ratefix-ab
          path: |
            artifacts/radiation_four_force_counterfactual.json
            artifacts/radiation_four_force_counterfactual.sha256
            artifacts-run-status.txt
          if-no-files-found: warn
          retention-days: 90
