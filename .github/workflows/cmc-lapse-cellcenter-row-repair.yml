name: "[DIAG] CMC lapse cell-centred parity row repair"

on:
  push:
    branches:
      - diag/cmc-lapse-cellcenter-row-repair-2026-10-12
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  bounded-cmc-row-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run focused row-closure regression
        run: python -m pytest -q tests/test_cmc_lapse_cellcenter_row_repair.py
      - name: Run N=40/60/80/120/160 frozen-state report
        run: python tools/audit_cmc_lapse_cellcenter_row_repair.py
      - name: Upload frozen-state audit
        uses: actions/upload-artifact@v4
        with:
          name: cmc-lapse-cellcenter-row-repair
          path: results/cmc-lapse-cellcenter-row-repair/report.json
          if-no-files-found: error
          retention-days: 90
