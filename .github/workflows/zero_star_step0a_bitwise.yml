name: "[0star] Step 0a diagnostic bookkeeping bitwise check"

on:
  push:
    branches: [0star-central-clock]
  workflow_dispatch:

jobs:
  bitwise_state_check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-step0a]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate revision with history
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check parent and candidate at repeated intermediate states
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "\${BASE_SHA}" ] || [ "\${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable push parent SHA; skipping old/new comparison."
            exit 0
          fi
          git worktree add --detach /tmp/step0a-old "\${BASE_SHA}"
          trap 'git worktree remove --force /tmp/step0a-old' EXIT
          python engine/step0a_bitwise_state_check.py /tmp/step0a-old "\${GITHUB_WORKSPACE}"
