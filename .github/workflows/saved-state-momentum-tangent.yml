name: Diagnostic - saved accepted-state momentum tangent

on:
  pull_request:
    paths:
      - tools/audit_saved_state_momentum_tangent.py
      - tools/audit_current_source_momentum_constraint_tangent.py
      - tests/test_saved_state_momentum_tangent.py
      - docs/research/pr415_native_operator_contract_2026-10-24.md
      - .github/workflows/saved-state-momentum-tangent.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: saved-state-momentum-tangent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  accepted-state-tangent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: 120
            baseline_artifact: evolved-origin-aa-regularity-N120-t0.6-2026-10-24
            candidate_artifact: origin-half-cell-candidate-N120-t0.6-2026-10-24
          - resolution: 240
            baseline_artifact: evolved-origin-aa-regularity-N240-t0.6-2026-10-24
            candidate_artifact: origin-half-cell-candidate-N240-t0.6-2026-10-24

    steps:
      - name: Check out diagnostic branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download existing complete baseline checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.baseline_artifact }}
          path: baseline-reference/N${{ matrix.resolution }}
          github-token: ${{ github.token }}
          run-id: 40127716287

      - name: Download existing complete origin-half-cell checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.candidate_artifact }}
          path: candidate-reference/N${{ matrix.resolution }}
          github-token: ${{ github.token }}
          run-id: 40128647367

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install declared requirements
        run: python -m pip install -r requirements.txt

      - name: Compile saved-state observer
        run: python -m py_compile tools/audit_saved_state_momentum_tangent.py

      - name: Test exact-kernel tangent interface and closure
        run: python -m pytest -q tests/test_saved_state_momentum_tangent.py

      - name: Audit complete t=0.6 saved checkpoints
        run: >-
          python tools/audit_saved_state_momentum_tangent.py
          --resolution ${{ matrix.resolution }}
          --baseline baseline-reference/N${{ matrix.resolution }}
          --candidate candidate-reference/N${{ matrix.resolution }}
          --out results/saved-state-momentum-tangent/N${ matrix.resolution }}/report.json

      - name: Upload signed accepted-state tangent ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-state-momentum-tangent-N${{ matrix.resolution }}
          path: results/saved-state-momentum-tangent/N${ matrix.resolution }}/
          if-no-files-found: warn
          retention-days: 90
