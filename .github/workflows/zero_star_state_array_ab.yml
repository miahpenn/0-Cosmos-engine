name: "[0star] repair ON/OFF full state-array comparison"
on:
  push:
    branches: [0star-central-clock]
permissions:
  contents: read
jobs:
  state-array-ab:
    if: contains(github.event.head_commit.message, '[run-state-array-ab]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Repository tests
        run: python -m pytest -q
      - name: Run sequential state-array A/B audit
        run: python -m engine.state_array_ab_audit
      - name: Upload full state-array comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-array-ab-comparison
          path: runs/state-array-ab/state-array-ab.json
          if-no-files-found: error
