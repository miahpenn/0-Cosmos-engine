name: Matter RHS rate extraction regression gate

on:
  push:
    branches:
      - fix/matter-rhs-rate-extraction-main-2026-10-12
    paths:
      - engine/matter_system.py
      - engine/matter_rhs.py
      - tests/test_species_rhs_rate_contract.py
      - .github/workflows/matter-rhs-rate-extraction.yml
  pull_request:
    branches:
      - main
    paths:
      - engine/matter_system.py
      - engine/matter_rhs.py
      - tests/test_species_rhs_rate_contract.py
      - .github/workflows/matter-rhs-rate-extraction.yml

permissions:
  contents: read

concurrency:
  group: matter-rhs-rate-extraction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify pinned geometry/PIRK vendor
        run: |
          expected="d6052d605673ce9d82cdc99b0df79855fa2ea215"
          actual="$(git rev-parse HEAD:vendor/bb-palatini-unified-r0)"
          test "$actual" = "$expected"

      - name: Compile changed modules and regression tests
        run: |
          python -m py_compile engine/matter_system.py engine/matter_rhs.py
          python -m py_compile tests/test_species_rhs_rate_contract.py

      - name: Run focused matter RHS contract tests
        run: python -m pytest -q tests/test_species_rhs_rate_contract.py

      - name: Run complete repository test suite
        run: python -m pytest -q
