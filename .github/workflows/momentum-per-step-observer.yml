name: Diagnostic - per-step signed momentum observer at N80

on:
  push:
    branches:
      - diag/lambda-connection-budget-2026-10-12
    paths:
      - tools/momentum_per_step_observer.py
      - tools/momentum_constraint_stage_budget.py
      - .github/workflows/momentum-per-step-observer.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: momentum-per-step-observer-n80
  cancel-in-progress: false

jobs:
  per-step-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout diagnostic observer
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact production source and pinned vendor
        uses: actions/checkout@v4
        with:
          ref: 6d8b3f2790644591326df57c55908863f994cb0c
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Download original admitted t=12 production artifact
        uses: actions/download-artifact@v4
        with:
          name: v55-production-t12-n40-n60-n80
          run-id: 38208253687
          github-token: ${{ github.token }}
          path: source-artifact

      - name: Compile the observer and exact momentum budget helper
        run: python -m py_compile tools/momentum_per_step_observer.py tools/momentum_constraint_stage_budget.py

      - name: Replay one N80 trajectory and record every accepted-step momentum budget
        run: |
          PYTHONPATH=source python tools/momentum_per_step_observer.py \
            --campaign-artifact source-artifact \
            --output-dir results/momentum-per-step-observer

      - name: Upload per-step fixed-radius terms and endpoint reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-per-step-observer-n80
          path: results/momentum-per-step-observer/
          if-no-files-found: warn
          retention-days: 90
