name: "[0star] discrete-consistent initializer matched full-kernel A/B"

on:
  push:
    branches:
      - diag/discrete-consistent-initial-review

permissions:
  contents: read

jobs:
  matched-full-kernel-ab:
    if: contains(github.event.head_commit.message, '[run-discrete-consistent-ab]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Re-run discrete-consistent initializer tests
        run: python -m pytest -q tests/test_discrete_consistent_initial.py

      - name: Run sequential matched-settings full-kernel A/B at N=40,80,160
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python -m engine.discrete_consistent_initial_ab

      - name: Upload baseline/candidate comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discrete-consistent-initial-full-kernel-ab
          path: runs/discrete-consistent-initial-ab/report.json
          if-no-files-found: warn
