name: Diagnostic - signed momentum constraint stage budget

on:
  push:
    branches:
      - diag/lambda-connection-budget-2026-10-12
    paths:
      - tools/momentum_constraint_stage_budget.py
      - .github/workflows/momentum-constraint-stage-budget.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: momentum-constraint-stage-budget
  cancel-in-progress: false

jobs:
  momentum-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout diagnostic launcher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact production source and pinned vendor
        uses: actions/checkout@v4
        with:
          ref: 6d8b3f2790644591326df57c55908863f994cb0c
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Download the exact admitted t=12 production checkpoints
        uses: actions/download-artifact@v4
        with:
          name: v55-production-t12-n40-n60-n80
          run-id: 38208253687
          github-token: ${{ github.token }}
          path: source-artifact

      - name: Compile the diagnostic
        run: python -m py_compile tools/momentum_constraint_stage_budget.py

      - name: Decompose signed momentum constraint at all one-step stages
        run: |
          PYTHONPATH=source python tools/momentum_constraint_stage_budget.py \
            --campaign-artifact source-artifact \
            --output-dir results/momentum-constraint-stage-budget

      - name: Upload signed stage budgets and profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-constraint-stage-budget
          path: results/momentum-constraint-stage-budget/
          if-no-files-found: warn
          retention-days: 90
