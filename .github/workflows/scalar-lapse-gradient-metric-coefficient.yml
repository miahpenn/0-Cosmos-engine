name: Diagnostic - scalar lapse-gradient inverse-metric coefficient

on:
  push:
    branches:
      - diag/scalar-inverse-metric-audit-2026-10-12
    paths:
      - tools/test_scalar_lapse_gradient_metric_coefficient.py
      - .github/workflows/scalar-lapse-gradient-metric-coefficient.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: scalar-lapse-gradient-inverse-metric-audit
  cancel-in-progress: false

jobs:
  one-step-counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout diagnostic code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact production source and pinned vendor
        uses: actions/checkout@v4
        with:
          ref: 6d8b3f2790644591326df57c55908863f994cb0c
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Download bounded V5.5 t=12 campaign checkpoints
        uses: actions/download-artifact@v4
        with:
          name: v55-production-t12-n40-n60-n80
          run-id: 38208253687
          github-token: ${{ github.token }}
          path: campaign-artifact

      - name: Download exact N40/N60/N80/N120 t=2.16 checkpoints
        uses: actions/download-artifact@v4
        with:
          name: lambda-spatial-refinement-t2p16
          run-id: 38212879394
          github-token: ${{ github.token }}
          path: spatial-artifact

      - name: Arrange frozen checkpoint paths expected by the audit
        run: |
          mkdir -p runs/t12
          cp -a campaign-artifact/N40 runs/t12/
          cp -a campaign-artifact/N60 runs/t12/
          cp -a campaign-artifact/N80 runs/t12/

      - name: Compile diagnostic
        run: python -m py_compile tools/test_scalar_lapse_gradient_metric_coefficient.py

      - name: Compare baseline with inverse-metric scalar lapse-gradient counterfactual
        run: python tools/test_scalar_lapse_gradient_metric_coefficient.py

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalar-lapse-gradient-metric-coefficient
          path: results/scalar-lapse-gradient-metric-coefficient/
          if-no-files-found: warn
          retention-days: 90
