name: Diagnostic - discrete-consistent initial constraint time series

on:
  push:
    branches:
      - diag/discrete-consistent-initial-production-test-2026-10-12
    paths:
      - tools/audit_discrete_consistent_initial_time_series.py
      - .github/workflows/discrete-consistent-initial-time-series.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: discrete-consistent-initial-time-series-2026-10-12
  cancel-in-progress: false

jobs:
  checkpoint-time-series:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout diagnostic branch and pinned kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Download matched production A/B checkpoints
        uses: actions/download-artifact@v4
        with:
          name: discrete-consistent-initial-production-ab-t2p16
          repository: miahpenn/0-Cosmos-engine
          run-id: 38284401548
          github-token: ${{ github.token }}
          path: production-ab-artifact

      - name: Compile and run saved-checkpoint timeline audit
        run: |
          python -m py_compile tools/audit_discrete_consistent_initial_time_series.py
          python tools/audit_discrete_consistent_initial_time_series.py

      - name: Upload constraint time-series report and CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discrete-consistent-initial-constraint-time-series
          path: results/discrete-consistent-initial-time-series/
          if-no-files-found: warn
          retention-days: 90
