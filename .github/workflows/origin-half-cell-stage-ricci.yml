name: Diagnostic - origin-half-cell A/B at actual PIRK Ricci stages

on:
  push:
    branches:
      - diag/origin-half-cell-stage-ricci-2026-10-13
    paths:
      - engine/v55_initial.py
      - tools/audit_origin_half_cell_stage_ricci.py
      - tests/test_origin_half_cell_stage_ricci.py
      - .github/workflows/origin-half-cell-stage-ricci.yml

permissions:
  contents: read

concurrency:
  group: origin-half-cell-stage-ricci-2026-10-13
  cancel-in-progress: false

jobs:
  paired-stage-ricci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "c01f2467347e8aebd57d220374fd7bc4e93045bc"
      BASE_INITIAL_BLOB: "4cfbfe4be6ac3ce6ed492f4e435186997d94116a"
      CANDIDATE_INITIAL_BLOB: "3be4ec52490bcab9f1d71c5b21c347367c0b89f6"
      SOURCE_KERNEL_BLOB: "2954e7a79656849b5f088053ea0f4ac97d4bb443"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
    steps:
      - name: Check out candidate, pinned production baseline, and vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository requirements
        run: python -m pip install -r requirements.txt

      - name: Compile observer and analytic Ricci control
        run: |
          python -m py_compile tools/audit_origin_half_cell_stage_ricci.py
          python -m py_compile tests/test_origin_half_cell_stage_ricci.py

      - name: Fail closed on production source, vendor, and dependency drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT:engine/v55_initial.py")" = "$BASE_INITIAL_BLOB"
          test "$(git rev-parse "HEAD:engine/v55_initial.py")" = "$CANDIDATE_INITIAL_BLOB"
          test "$(git rev-parse "$SOURCE_COMMIT:engine/production_kernel.py")" = "$SOURCE_KERNEL_BLOB"
          test "$(git rev-parse "HEAD:engine/production_kernel.py")" = "$SOURCE_KERNEL_BLOB"
          test "$(git rev-parse "HEAD:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          changed_engine="$(git diff --name-only "$SOURCE_COMMIT" HEAD -- engine)"
          if [ "$changed_engine" != "engine/v55_initial.py" ]; then
            printf 'Unexpected engine changes relative to exact current-main source:\n%s\n' "$changed_engine"
            exit 1
          fi
          changed_forbidden="$(git diff --name-only "$SOURCE_COMMIT" HEAD -- vendor .gitmodules requirements.txt pyproject.toml)"
          if [ -n "$changed_forbidden" ]; then
            printf 'Forbidden vendor/dependency changes:\n%s\n' "$changed_forbidden"
            exit 1
          fi
          printf 'SOURCE_COMMIT=%s\nBASE_INITIAL_BLOB=%s\nCANDIDATE_INITIAL_BLOB=%s\nKERNEL_BLOB=%s\nVENDOR_COMMIT=%s\n' \
            "$SOURCE_COMMIT" "$BASE_INITIAL_BLOB" "$CANDIDATE_INITIAL_BLOB" "$SOURCE_KERNEL_BLOB" "$VENDOR_COMMIT"

      - name: Run full repository regression suite
        run: python -m pytest -q

      - name: Capture signed Ricci/lapse split at actual PIRK stage inputs
        run: python tools/audit_origin_half_cell_stage_ricci.py

      - name: Upload source-pinned signed stage profiles and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origin-half-cell-pirk-stage-ricci
          path: results/origin-half-cell-stage-ricci/
          if-no-files-found: warn
          retention-days: 90
