name: Diagnostic - strong-D fixed-domain Hamiltonian ridge refinement

on:
  push:
    branches:
      - diag/independent-metric-ricci-audit
    paths:
      - diagnostics/curvature_consistency/strong_D_ridge_fixed_domain_refinement.py
      - .github/workflows/strong-D-ridge-fixed-domain-refinement.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and verify admitted N=160, R=80 full-state reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ridge-reference/unpacked
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/miahpenn/0-Cosmos-engine/actions/artifacts/11706797173/zip" \
            -o /tmp/ridge-reference/reference.zip
          echo "8b118d1f81e01f2a5d291d160b8bac42abc6a11051d8453efd9c19d0826d6d8b  /tmp/ridge-reference/reference.zip" | sha256sum -c -
          unzip -q /tmp/ridge-reference/reference.zip -d /tmp/ridge-reference/unpacked
          find /tmp/ridge-reference/unpacked -type f \
            -name 'rmax080_N160_production_full_state_profiles.jsonl' \
            -print -quit > /tmp/ridge-reference/profile_path.txt
          test -s /tmp/ridge-reference/profile_path.txt
          REF_PROFILE="$(cat /tmp/ridge-reference/profile_path.txt)"
          test "$(wc -l < "$REF_PROFILE")" -eq 49
      - name: Compile new diagnostic
        run: python -m py_compile diagnostics/curvature_consistency/strong_D_ridge_fixed_domain_refinement.py
      - name: Validate frozen experiment settings
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path("diagnostics/curvature_consistency/strong_D_ridge_fixed_domain_refinement.py")
          tree = ast.parse(p.read_text())
          values = {}
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              try:
                  value = ast.literal_eval(node.value)
              except Exception:
                  continue
              for target in node.targets:
                  if isinstance(target, ast.Name):
                      values[target.id] = value
                  elif isinstance(target, ast.Tuple) and isinstance(value, (tuple, list)):
                      for name, item in zip(target.elts, value):
                          if isinstance(name, ast.Name):
                              values[name.id] = item
          assert values["N"] == 320
          assert values["RMAX"] == 80.0
          assert values["RMAX"] / values["N"] == 0.25
          assert values["CFL"] == 0.0075
          assert values["DAMP"] == 1e-4
          assert values["TFINAL"] == 12.0
          assert values["SAMPLE"] == 0.25
          print("Frozen configuration admitted: N=320, R=80, dr=0.25, CFL=0.0075, D=1e-4, t=12.")
          PY
      - name: Run one N=320 production trajectory and matched profile comparison
        run: |
          python diagnostics/curvature_consistency/strong_D_ridge_fixed_domain_refinement.py \
            "$(cat /tmp/ridge-reference/profile_path.txt)"
      - name: Upload trajectory profiles, checkpoints and comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strong-D-ridge-fixed-domain-refinement
          path: runs/strong-D-ridge-fixed-domain-refinement/
          if-no-files-found: warn
          retention-days: 90
