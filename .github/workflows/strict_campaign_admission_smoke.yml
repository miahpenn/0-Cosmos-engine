name: Strict campaign admission smoke

on:
  pull_request:
    paths:
      - "engine/run_production.py"
      - "engine/campaign.py"
      - "tests/**"
      - ".github/workflows/strict_campaign_admission_smoke.yml"

permissions:
  contents: read

jobs:
  strict-admission-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full repository regression suite
        run: python -m pytest -q

      - name: Run bounded production smoke
        run: |
          python - <<'PY'
          from engine.campaign import CampaignConfig
          from engine.run_production import run_campaign

          config = CampaignConfig(
              resolutions=(40,),
              r_max=40.0,
              cfl=0.03,
              final_time=1.0,
              checkpoint_interval=0.5,
              output_dir="runs/strict-admission-smoke",
          )
          results = run_campaign(config=config)
          assert len(results) == 1
          assert results[0].status == "completed"
          assert abs(results[0].t_final - config.final_time) <= 1.0e-10
          print("STRICT_CAMPAIGN_ADMISSION_SMOKE_PASS")
          PY

      - name: Upload strict admission smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-campaign-admission-smoke
          path: runs/strict-admission-smoke/
          if-no-files-found: warn
          retention-days: 30
