name: Diagnostic - full matter-coupled propagation candidate (reuse #420 evidence)

on:
  push:
    branches:
      - diag/full-matter-coupled-candidate-under-421-422-2026-10-25
    paths:
      - tools/audit_full_matter_coupled_propagation_candidate_v1.py
      - .github/workflows/full-matter-coupled-propagation-candidate.yml
  pull_request:
    branches:
      - diag/matter-coupled-identity-derivation-2026-10-25
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/audit_full_matter_coupled_propagation_candidate_v1.py
      - .github/workflows/full-matter-coupled-propagation-candidate.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: full-matter-coupled-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  assemble-candidate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "4aec88d0e3ff028e0a65a8ac36b30948625df792"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
      ACCEPTED_STATE_RUN_ID: "40156226086"
      CANDIDATE_OUTPUT_RUN_ID: "40156795380"
    steps:
      - name: Check out diagnostic branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fail closed if protected production/vendor/dependency paths drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT")" = "$SOURCE_COMMIT"
          test "$(git rev-parse "HEAD:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          protected_diff="$(git diff --name-only "$SOURCE_COMMIT" HEAD -- engine vendor .gitmodules requirements.txt)"
          if [[ -n "$protected_diff" ]]; then
            echo "Unexpected changes to protected production/vendor/dependency paths:"
            echo "$protected_diff"
            exit 1
          fi
          echo "SOURCE_COMMIT=$SOURCE_COMMIT"
          echo "VENDOR_COMMIT=$VENDOR_COMMIT"
          echo "PROTECTED_SOURCE_DIFF=empty"

      - name: Verify source and existing candidate artifact identities and GitHub ZIP digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          owner_repo = "miahpenn/0-Cosmos-engine"
          accepted_run = 40156226086
          candidate_run = 40156795380
          expected = [
              (60, "accepted_state", 12584064724, "origin-full-continuous-metric-evolved-N60-t0.6-2026-10-24", "9730fa5ae4977050c24e43299ecbe4f2c9636add1a6d24912a38628d2be840d7", accepted_run),
              (120, "accepted_state", 12584164579, "origin-full-continuous-metric-evolved-N120-t0.6-2026-10-24", "ebaebb8ee8cead10d4f49bbdd6970eac15d869ed22f251be48afd9ffece30b01", accepted_run),
              (240, "accepted_state", 12584980156, "origin-full-continuous-metric-evolved-N240-t0.6-2026-10-24", "72a043b778cbb9efe6e433565b34c5b92f9a4ab306e35a8a54855025778d6a8f", accepted_run),
              (60, "candidate_output", 12585305634, "full-profile-propagation-candidate-N60-2026-10-25", "474f63f53c3b9337b8e700e6b83a9fc331bcddcdef9c69db374e0b1d85dd5f88", candidate_run),
              (120, "candidate_output", 12585325663, "full-profile-propagation-candidate-N120-2026-10-25", "39c0afb5829e9bd8b39830dcfa13c777fb5f616535b2e89a932fb4321ee26e39", candidate_run),
              (240, "candidate_output", 12585585288, "full-profile-propagation-candidate-N240-2026-10-25", "ddf9031ee09c4aad39561a11bc22580320a939660e344336cbd1fc8e2dbb872b", candidate_run),
          ]
          token = os.environ["GH_TOKEN"]
          rows = []
          for resolution, kind, artifact_id, name, expected_zip_sha, expected_run in expected:
              url = f"https://api.github.com/repos/{owner_repo}/actions/artifacts/{artifact_id}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  item = json.load(response)
              digest = str(item.get("digest", ""))
              actual_sha = digest.removeprefix("sha256:")
              workflow_run_id = int(item.get("workflow_run", {}).get("id", -1))
              if int(item.get("id", -1)) != artifact_id:
                  raise SystemExit(f"artifact ID mismatch for N={resolution} {kind}")
              if item.get("name") != name:
                  raise SystemExit(f"artifact name mismatch for N={resolution} {kind}: {item.get('name')!r}")
              if workflow_run_id != expected_run:
                  raise SystemExit(f"workflow run mismatch for N={resolution} {kind}: {workflow_run_id}")
              if actual_sha != expected_zip_sha or not digest.startswith("sha256:"):
                  raise SystemExit(f"GitHub ZIP digest mismatch for N={resolution} {kind}: {digest}")
              if item.get("expired") is not False:
                  raise SystemExit(f"artifact expired or unknown for N={resolution} {kind}")
              rows.append({
                  "resolution": resolution,
                  "kind": kind,
                  "artifact_id": artifact_id,
                  "artifact_name": name,
                  "workflow_run_id": workflow_run_id,
                  "zip_sha256": actual_sha,
                  "github_digest": digest,
                  "api_digest_match": True,
              })
          out = {
              "schema": "github-actions-artifact-digest-verification/v1",
              "status": "verified",
              "verified": True,
              "accepted_state_run_id": accepted_run,
              "candidate_output_run_id": candidate_run,
              "artifacts": rows,
          }
          Path("reference/artifact_api_verification.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps({"status": out["status"], "verified_artifacts": len(rows)}, indent=2))
          PY

      - name: Download SHA-verified full continuous-profile accepted state N60
        uses: actions/download-artifact@v4
        with:
          repository: miahpenn/0-Cosmos-engine
          name: origin-full-continuous-metric-evolved-N60-t0.6-2026-10-24
          path: reference/full/N60
          github-token: ${{ github.token }}
          run-id: 40156226086

      - name: Download SHA-verified full continuous-profile accepted state N120
        uses: actions/download-artifact@v4
        with:
          repository: miahpenn/0-Cosmos-engine
          name: origin-full-continuous-metric-evolved-N120-t0.6-2026-10-24
          path: reference/full/N120
          github-token: ${{ github.token }}
          run-id: 40156226086

      - name: Download SHA-verified full continuous-profile accepted state N240
        uses: actions/download-artifact@v4
        with:
          repository: miahpenn/0-Cosmos-engine
          name: origin-full-continuous-metric-evolved-N240-t0.6-2026-10-24
          path: reference/full/N240
          github-token: ${{ github.token }}
          run-id: 40156226086

      - name: Download existing #420 candidate output N60 (no recomputation)
        uses: actions/download-artifact@v4
        with:
          repository: miahpenn/0-Cosmos-engine
          name: full-profile-propagation-candidate-N60-2026-10-25
          path: reference/candidate/N60
          github-token: ${{ github.token }}
          run-id: 40156795380

      - name: Download existing #420 candidate output N120 (no recomputation)
        uses: actions/download-artifact@v4
        with:
          repository: miahpenn/0-Cosmos-engine
          name: full-profile-propagation-candidate-N120-2026-10-25
          path: reference/candidate/N120
          github-token: ${{ github.token }}
          run-id: 40156795380

      - name: Download existing #420 candidate output N240 (no recomputation)
        uses: actions/download-artifact@v4
        with:
          repository: miahpenn/0-Cosmos-engine
          name: full-profile-propagation-candidate-N240-2026-10-25
          path: reference/candidate/N240
          github-token: ${{ github.token }}
          run-id: 40156795380

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository requirements without changing dependency pins
        run: python -m pip install -r requirements.txt

      - name: Compile the report assembler only
        run: python -m py_compile tools/audit_full_matter_coupled_propagation_candidate_v1.py

      - name: Assemble candidate report from verified existing evidence (no RHS evaluation)
        run: python tools/audit_full_matter_coupled_propagation_candidate_v1.py

      - name: Emit fail-closed report if an earlier workflow step stopped execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="results/full-matter-coupled-propagation-candidate/summary.json"
          if [[ ! -f "$report" ]]; then
            mkdir -p "$(dirname "$report")"
            cat > "$report" <<'JSON'
          {
            "schema": "full-matter-coupled-propagation-candidate/v1",
            "status": "failed_closed",
            "reason": "Workflow failed before the report assembler produced a result.",
            "flags": {
              "full_matter_coupled_propagation_identity_closed": false,
              "matter_source_sign_and_normalization_reviewed": false,
              "reference_metric_connection_coupling_convention_frozen": false,
              "total_stress_energy_sector_conservation_closed": false,
              "scientific_admission": false
            },
            "scientific_admission": false
          }
          JSON
            python - <<'PY'
          import hashlib
          from pathlib import Path
          report = Path("results/full-matter-coupled-propagation-candidate/summary.json")
          digest = hashlib.sha256(report.read_bytes()).hexdigest()
          Path("results/full-matter-coupled-propagation-candidate/SHA256SUMS.txt").write_text(f"{digest}  summary.json\n")
          PY
          fi

      - name: Upload candidate report and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-matter-coupled-propagation-candidate-report-2026-10-25
          path: results/full-matter-coupled-propagation-candidate/
          if-no-files-found: warn
          retention-days: 90
