name: Diagnostic - independent Ricci time-step refinement

on:
  push:
    branches:
      - diag/independent-metric-ricci-audit
    paths:
      - diagnostics/curvature_consistency/independent_metric_ricci_time_refine.py
      - .github/workflows/independent-metric-ricci-time-refine.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-metric-ricci-time-refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile time-refinement diagnostic
        run: python -m py_compile diagnostics/curvature_consistency/independent_metric_ricci_time_refine.py
      - name: Run fixed-grid timestep comparison (N=80, CFL=0.03/0.015/0.0075)
        run: python diagnostics/curvature_consistency/independent_metric_ricci_time_refine.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-metric-ricci-time-refine
          path: runs/independent-metric-ricci-time-refine/report.json
          if-no-files-found: error
          retention-days: 90
