name: PIRK Lambda predictor stage-order contract

on:
  push:
    branches:
      - diag/pirk-lambda-predictor-stage-order-2026-10-12
    paths:
      - engine/production_kernel.py
      - tests/test_pirk_lambda_predictor_stage_order.py
      - tools/diag_pirk_lambda_predictor_stage_order_ab.py
      - .github/workflows/pirk-lambda-predictor-stage-order.yml
  pull_request:
    branches:
      - main
    paths:
      - engine/production_kernel.py
      - tests/test_pirk_lambda_predictor_stage_order.py
      - tools/diag_pirk_lambda_predictor_stage_order_ab.py
      - .github/workflows/pirk-lambda-predictor-stage-order.yml

permissions:
  contents: read

concurrency:
  group: pirk-lambda-predictor-stage-order
  cancel-in-progress: false

jobs:
  stage-order:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic candidate and pinned vendor
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Verify exact pinned geometry/PIRK vendor
        run: |
          expected="d6052d605673ce9d82cdc99b0df79855fa2ea215"
          actual="$(git rev-parse HEAD:vendor/bb-palatini-unified-r0)"
          test "$actual" = "$expected"
      - name: Compile and run stage-order regression
        run: |
          python -m py_compile engine/production_kernel.py tests/test_pirk_lambda_predictor_stage_order.py
          python -m pytest -q tests/test_pirk_lambda_predictor_stage_order.py
      - name: Run full repository tests
        run: python -m pytest -q tests
      - name: Run bounded N=80/160 stale-vs-sequential Lambda A/B
        run: PYTHONPATH=. python tools/diag_pirk_lambda_predictor_stage_order_ab.py
      - name: Preserve bounded A/B JSON and checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pirk-lambda-predictor-stage-order-ab
          path: artifacts/pirk-lambda-predictor-stage-order-ab/
          if-no-files-found: warn
