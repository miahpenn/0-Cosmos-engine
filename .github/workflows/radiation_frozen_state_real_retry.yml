name: Radiation frozen-state real adaptive retry

on:
  push:
    branches:
      - diag/radiation-frozen-state-real-retry-2026-10-12
    paths:
      - tools/audit_radiation_frozen_state_real_retry.py
      - .github/workflows/radiation_frozen_state_real_retry.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: radiation-frozen-state-real-retry-2026-10-12
  cancel-in-progress: false

jobs:
  frozen-state-real-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate and pinned vendor
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fail closed on source/vendor scope
        env:
          BASE_SOURCE_COMMIT: "cdcec8282bff0443f2fe4674b15929822ff38736"
          VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
        run: |
          git fetch --no-tags origin "$BASE_SOURCE_COMMIT"
          unexpected="$(git diff --name-only "$BASE_SOURCE_COMMIT" HEAD | grep -v -E '^(engine/adaptive_step\\.py|engine/matter_system\\.py|engine/run_production\\.py|tests/test_adaptive_step_retry\\.py|tests/test_radiation_rhs_admissibility_contract\\.py|\\.github/workflows/radiation_adaptive_step_gate\\.yml|tools/audit_radiation_frozen_state_real_retry\\.py|\\.github/workflows/radiation_frozen_state_real_retry\\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected changed paths relative to exact source base:\\n%s\\n' "$unexpected"
            exit 1
          fi
          actual_vendor="$(git rev-parse HEAD:vendor/bb-palatini-unified-r0)"
          test "$actual_vendor" = "$VENDOR_COMMIT"
          printf 'Source base: %s\\nVendor: %s\\n' "$BASE_SOURCE_COMMIT" "$actual_vendor"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned-source dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile diagnostic and run repository regression suite
        run: |
          python -m py_compile tools/audit_radiation_frozen_state_real_retry.py
          python -m pytest -q

      - name: Download already-captured rejected full state (no lead-in replay)
        uses: actions/download-artifact@v4
        with:
          name: boundary-cmc-radiation-audit
          path: runs/source-artifact
          repository: ${{ github.repository }}
          run-id: 38322337250
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact frozen state and source metadata
        run: |
          echo 'ccd1fa0fbabe65c51c3dd7ac2c9227d6d25aa680c169eef1afd3fca4326294cf  runs/source-artifact/boundary_failure_accepted_state.npz' | sha256sum -c -
          grep -q '"rate_fix_source_commit": "cdcec8282bff0443f2fe4674b15929822ff38736"' runs/source-artifact/boundary_failure_accepted_state.json
          grep -q '"pinned_vendor_commit": "d6052d605673ce9d82cdc99b0df79855fa2ea215"' runs/source-artifact/boundary_failure_accepted_state.json

      - name: Exercise actual retry helper from dt=0.03 on the frozen production state
        run: PYTHONPATH=. python tools/audit_radiation_frozen_state_real_retry.py --input-dir runs/source-artifact

      - name: Upload attempt ledger, diagnostics, and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radiation-frozen-state-real-retry
          path: artifacts/radiation-frozen-state-real-retry/
          if-no-files-found: warn
          retention-days: 90
