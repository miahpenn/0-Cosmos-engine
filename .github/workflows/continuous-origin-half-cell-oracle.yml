name: Research - continuous origin half-cell integral oracle

on:
  push:
    branches:
      - research/continuous-origin-half-cell-oracle-2026-10-15
    paths:
      - tools/audit_continuous_origin_half_cell_oracle.py
      - tests/test_continuous_origin_half_cell_oracle.py
      - .github/workflows/continuous-origin-half-cell-oracle.yml

permissions:
  contents: read

concurrency:
  group: continuous-origin-half-cell-oracle-2026-10-15
  cancel-in-progress: false

jobs:
  continuous-half-cell-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "285a2ee0c1a3b97cddeb4519d8e749109b115aab"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
      ORACLE_RESOLUTIONS: "160,240,320"
      ORACLE_R_MAX: "80.0"
      ORACLE_OUT: "results/continuous-origin-half-cell-oracle-2026-10-15"
    steps:
      - name: Check out research branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository requirements
        run: python -m pip install -r requirements.txt

      - name: Verify engine/vendor source pins
        run: |
          python - <<'PY'
          import json
          from tools.audit_current_main_centre_proper_radial_ricci import _verify_source_pins
          print(json.dumps(_verify_source_pins(), indent=2))
          PY

      - name: Compile audit and tests
        run: |
          python -m py_compile tools/audit_continuous_origin_half_cell_oracle.py
          python -m py_compile tests/test_continuous_origin_half_cell_oracle.py

      - name: Run continuous-source and estimator regression tests
        run: python -m pytest -q tests/test_continuous_origin_half_cell_oracle.py

      - name: Run zero-evolution continuous half-cell integral oracle
        run: python tools/audit_continuous_origin_half_cell_oracle.py

      - name: Upload report and checksum manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-origin-half-cell-oracle-2026-10-15
          path: results/continuous-origin-half-cell-oracle-2026-10-15/
          if-no-files-found: warn
          retention-days: 90
