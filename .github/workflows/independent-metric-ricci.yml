name: Diagnostic - independent metric-derived Ricci

on:
  push:
    branches:
      - diag/independent-metric-ricci-audit
    paths:
      - diagnostics/curvature_consistency/independent_metric_ricci.py
      - .github/workflows/independent-metric-ricci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-metric-ricci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile diagnostic
        run: python -m py_compile diagnostics/curvature_consistency/independent_metric_ricci.py
      - name: Run independent metric-derived Ricci audit (N=40, t=0 to 3)
        run: python diagnostics/curvature_consistency/independent_metric_ricci.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-metric-ricci-audit
          path: runs/independent-metric-ricci-audit/report.json
          if-no-files-found: error
          retention-days: 90
