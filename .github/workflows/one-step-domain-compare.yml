name: Diagnostic - one-step domain comparison

on:
  push:
    branches:
      - diag/independent-metric-ricci-audit
    paths:
      - diagnostics/curvature_consistency/one_step_domain_compare.py
      - .github/workflows/one-step-domain-compare.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile diagnostic
        run: python -m py_compile diagnostics/curvature_consistency/one_step_domain_compare.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run one-step comparison only
        run: python diagnostics/curvature_consistency/one_step_domain_compare.py
