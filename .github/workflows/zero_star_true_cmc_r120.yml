# Matched-spacing domain test: R120 with dr=1,2/3,1/2.
# Trigger the long domain gate only when this token is present.
# Latest-head launch marker.
name: "[0star] True-CMC R120 domain-independence gate"

on:
  workflow_dispatch:
  push:
    branches:
      - 0star-central-clock

env:
  PYTHONPATH: .

jobs:
  true-cmc-r120:
    concurrency:
      group: zero-star-true-cmc-r120-${{ matrix.resolution }}
      cancel-in-progress: true
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-domain-120]')
    runs-on: ubuntu-latest
    timeout-minutes: 900
    strategy:
      fail-fast: false
      matrix:
        resolution: [120, 180, 240]
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run repository tests
        run: python -m pytest -q

      - name: Run matched-spacing R120 campaign
        run: |
          python - <<'PY'
          from engine.campaign import CampaignConfig
          from engine.true_cmc_pirk_kernel import V55TrueCMCPIRKKernel
          from engine.run_production import run_campaign

          resolution = int("${{ matrix.resolution }}")
          config = CampaignConfig(
              resolutions=(resolution,),
              r_max=120.0,
              cfl=0.06,
              final_time=100.0,
              checkpoint_interval=0.20,
              output_dir=f'runs/0star-true-cmc-r120/N{resolution}',
          )
          results = run_campaign(kernel=V55TrueCMCPIRKKernel(), config=config)
          for result in results:
              print(result)
          failures = [r for r in results if r.status != "completed"]
          missing_turnaround = [r for r in results if r.turnaround_events < 1]
          if failures:
              raise SystemExit(
                  "R120 campaign reported numerical failure(s): "
                  + "; ".join(
                      f"N{r.resolution}: {r.status}" for r in failures
                  )
              )
          if missing_turnaround:
              raise SystemExit(
                  "R120 campaign did not observe H_eff=0 for "
                  + ", ".join(f"N{r.resolution}" for r in missing_turnaround)
              )
          PY

      - name: Upload R120 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0star-true-cmc-r120-N${{ matrix.resolution }}
          path: runs/0star-true-cmc-r120/N${{ matrix.resolution }}/
          if-no-files-found: error
