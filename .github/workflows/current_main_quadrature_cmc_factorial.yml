name: Current-main initial quadrature + CMC row factorial evaluation

on:
  push:
    branches:
      - diag/current-main-quadrature-cmc-factorial-2026-10-13
    paths:
      - "tools/compare_current_main_quadrature_cmc_factorial.py"
      - ".github/workflows/current_main_quadrature_cmc_factorial.yml"

permissions:
  contents: read

concurrency:
  group: current-main-quadrature-cmc-factorial-2026-10-13
  cancel-in-progress: false

jobs:
  four-arm-factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      BASE_SOURCE_COMMIT: d7e1eaa6639588a50483d4c9b3ff8cf951ae57ea
      CANDIDATE_SOURCE_COMMIT: 59dabf0dbd380f2c05636ad4efae7ca979e592c0
      VENDOR_COMMIT: d6052d605673ce9d82cdc99b0df79855fa2ea215
    steps:
      - name: Checkout current-main diagnostic harness and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned-source dependencies
        run: python -m pip install -r requirements.txt

      - name: Fail closed on current-main baseline, candidate and vendor identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SOURCE_COMMIT" "$CANDIDATE_SOURCE_COMMIT"
          test "$(git rev-parse HEAD:engine/production_kernel.py)" = "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/production_kernel.py")"
          test "$(git rev-parse HEAD:engine/matter_system.py)" = "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/matter_system.py")"
          test "$(git rev-parse HEAD:engine/valencia.py)" = "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/valencia.py")"
          test "$(git rev-parse HEAD:engine/v55_initial.py)" = "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/v55_initial.py")"
          test "$(git rev-parse HEAD:engine/cmc_gauge.py)" = "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/cmc_gauge.py")"
          test "$(git rev-parse "$BASE_SOURCE_COMMIT:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          test "$(git rev-parse "$CANDIDATE_SOURCE_COMMIT:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          test "$(git rev-parse "$BASE_SOURCE_COMMIT:requirements.txt")" = "$(git rev-parse "$CANDIDATE_SOURCE_COMMIT:requirements.txt")"
          changed_engine="$(git diff --name-only "$BASE_SOURCE_COMMIT" "$CANDIDATE_SOURCE_COMMIT" -- engine/ | sort)"
          expected_engine="$(printf '%s\n' engine/cmc_gauge.py engine/v55_initial.py | sort)"
          test "$changed_engine" = "$expected_engine"
          test "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/v55_initial.py")" = "4cfbfe4be6ac3ce6ed492f4e435186997d94116a"
          test "$(git rev-parse "$BASE_SOURCE_COMMIT:engine/cmc_gauge.py")" = "b1e6b3e95ff37702509e1b38ec6401d10e2482c3"
          test "$(git rev-parse "$CANDIDATE_SOURCE_COMMIT:engine/v55_initial.py")" = "2e5c41c10d4bbb53df3d7299b898e97f3239c120"
          test "$(git rev-parse "$CANDIDATE_SOURCE_COMMIT:engine/cmc_gauge.py")" = "5ac1b1ba5cc4b840e485b74841ceb2c2b0b6b69b"
          printf 'BASE_SOURCE_COMMIT=%s\nCANDIDATE_SOURCE_COMMIT=%s\nVENDOR_COMMIT=%s\n' "$BASE_SOURCE_COMMIT" "$CANDIDATE_SOURCE_COMMIT" "$VENDOR_COMMIT"
          printf 'ONLY_ENGINE_DIFFERENCES_BEGIN\n%s\nONLY_ENGINE_DIFFERENCES_END\n' "$changed_engine"
          python -m py_compile tools/compare_current_main_quadrature_cmc_factorial.py

      - name: Prepare isolated baseline worktree and compile diagnostic
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/results/current-main-quadrature-cmc-factorial"
          mkdir -p "$OUT"
          git worktree add --detach "$RUNNER_TEMP/cosmos-current-main-baseline" "$BASE_SOURCE_COMMIT"
          git -C "$RUNNER_TEMP/cosmos-current-main-baseline" submodule update --init --recursive
          mkdir -p "$RUNNER_TEMP/cosmos-current-main-baseline/tools"
          cp tools/compare_current_main_quadrature_cmc_factorial.py "$RUNNER_TEMP/cosmos-current-main-baseline/tools/compare_current_main_quadrature_cmc_factorial.py"
          python -m py_compile "$RUNNER_TEMP/cosmos-current-main-baseline/tools/compare_current_main_quadrature_cmc_factorial.py"
          test "$(git -C "$RUNNER_TEMP/cosmos-current-main-baseline" rev-parse HEAD)" = "$BASE_SOURCE_COMMIT"

      - name: Run four matched-source arms to t=0.12
        shell: bash
        run: |
          set -euo pipefail
          WORKTREE="$RUNNER_TEMP/cosmos-current-main-baseline"
          OUT="$GITHUB_WORKSPACE/results/current-main-quadrature-cmc-factorial"

          run_arm() {
            local arm="$1"
            local source_label="$2"
            local initial_variant="$3"
            local cmc_variant="$4"
            local rc=0

            git -C "$WORKTREE" checkout -- engine/v55_initial.py engine/cmc_gauge.py
            if [[ "$initial_variant" == "candidate" ]]; then
              git -C "$WORKTREE" show "$CANDIDATE_SOURCE_COMMIT:engine/v55_initial.py" > "$WORKTREE/engine/v55_initial.py"
            fi
            if [[ "$cmc_variant" == "candidate" ]]; then
              git -C "$WORKTREE" show "$CANDIDATE_SOURCE_COMMIT:engine/cmc_gauge.py" > "$WORKTREE/engine/cmc_gauge.py"
            fi
            printf '%s SOURCE_BLOBS initial=%s cmc=%s\n' "$arm" \
              "$(git -C "$WORKTREE" hash-object engine/v55_initial.py)" \
              "$(git -C "$WORKTREE" hash-object engine/cmc_gauge.py)"
            (
              cd "$WORKTREE"
              set +e
              ARM_SOURCE_COMMIT="$source_label" PYTHONPATH=. \
                python tools/compare_current_main_quadrature_cmc_factorial.py \
                --mode arm --arm "$arm" --output "$OUT/$arm.json"
              rc=$?
              printf '%s\t%s\n' "$arm" "$rc" >> "$OUT/ARM_EXIT_CODES.tsv"
              exit 0
            )
          }

          run_arm baseline "$BASE_SOURCE_COMMIT" baseline baseline
          run_arm quadrature_only "hybrid:baseline-plus-candidate-initializer" candidate baseline
          run_arm cmc_row_only "hybrid:baseline-plus-candidate-cmc-row" baseline candidate
          run_arm combined "$CANDIDATE_SOURCE_COMMIT" candidate candidate

      - name: Pair factorial arms and calculate main effects plus interaction
        shell: bash
        run: |
          set -euo pipefail
          WORKTREE="$RUNNER_TEMP/cosmos-current-main-baseline"
          OUT="$GITHUB_WORKSPACE/results/current-main-quadrature-cmc-factorial"
          cd "$WORKTREE"
          PYTHONPATH=. python tools/compare_current_main_quadrature_cmc_factorial.py \
            --mode factorial \
            --baseline-report "$OUT/baseline.json" \
            --quadrature-report "$OUT/quadrature_only.json" \
            --cmc-row-report "$OUT/cmc_row_only.json" \
            --combined-report "$OUT/combined.json" \
            --output "$OUT/factorial_report.json"

      - name: Record provenance and artifact digests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/results/current-main-quadrature-cmc-factorial"
          mkdir -p "$OUT"
          printf '%s\n' "$BASE_SOURCE_COMMIT" > "$OUT/BASE_SOURCE_COMMIT.txt"
          printf '%s\n' "$CANDIDATE_SOURCE_COMMIT" > "$OUT/CANDIDATE_SOURCE_COMMIT.txt"
          printf '%s\n' "$VENDOR_COMMIT" > "$OUT/VENDOR_COMMIT.txt"
          git rev-parse HEAD > "$OUT/DIAGNOSTIC_COMMIT.txt"
          git rev-parse HEAD:tools/compare_current_main_quadrature_cmc_factorial.py > "$OUT/FACTORIAL_TOOL_BLOB.txt"
          if test -f "$OUT/factorial_report.json"; then
            (cd "$OUT" && sha256sum baseline.json quadrature_only.json cmc_row_only.json combined.json factorial_report.json > SHA256SUMS.txt)
          fi

      - name: Upload factorial evidence even if an arm fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-quadrature-cmc-factorial
          path: results/current-main-quadrature-cmc-factorial/
          if-no-files-found: warn
          retention-days: 90
