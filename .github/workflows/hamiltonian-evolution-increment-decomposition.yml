name: "[0star] Hamiltonian evolution increment decomposition (diagnostic only)"

on:
  push:
    branches:
      - diag/hamiltonian-evolution-increment-decomposition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hamiltonian-increment-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run decomposition invariants and non-interference test
        run: python -m pytest -q tests/test_hamiltonian_evolution_increment_decomposition.py

      - name: Run short baseline trajectory and per-step decomposition
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python -m engine.hamiltonian_evolution_increment_decomposition

      - name: Upload per-step Hamiltonian decomposition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamiltonian-evolution-increment-decomposition
          path: runs/hamiltonian-evolution-increment-decomposition/report.json
          if-no-files-found: warn
