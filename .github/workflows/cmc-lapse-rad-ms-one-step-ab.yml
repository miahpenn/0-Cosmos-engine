name: Diagnostic - CMC row radiation cone and Misner-Sharp A/B

on:
  push:
    branches:
      - fix/matter-rhs-generator-2026-10-12
    paths:
      - tools/audit_cmc_lapse_radiation_ms_one_step_ab.py
      - tools/audit_cmc_lapse_cellcenter_one_step_ab.py
      - tests/test_cmc_lapse_radiation_ms_one_step_ab.py
      - .github/workflows/cmc-lapse-rad-ms-one-step-ab.yml

permissions:
  contents: read

concurrency:
  group: matter-rhs-generator-radiation-ms-audit-2026-10-12
  cancel-in-progress: false

jobs:
  regression-and-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "d7f964657df2cb8aabe4bd30c04eaff9e65d635d"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fail closed unless the candidate engine/vendor are unchanged
        run: |
          git fetch --no-tags origin "$SOURCE_COMMIT"
          changed="$(git diff --name-only "$SOURCE_COMMIT" HEAD -- engine vendor .gitmodules requirements.txt)"
          if [ -n "$changed" ]; then
            printf 'Unexpected engine/vendor/dependency changes relative to candidate source:\n%s\n' "$changed"
            exit 1
          fi
          test "$(git rev-parse HEAD:vendor/bb-palatini-unified-r0)" = "$VENDOR_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen-source dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile audit and tests
        run: |
          python -m py_compile tools/audit_cmc_lapse_radiation_ms_one_step_ab.py
          python -m py_compile tools/audit_cmc_lapse_cellcenter_one_step_ab.py
          python -m py_compile tests/test_cmc_lapse_radiation_ms_one_step_ab.py

      - name: Run diagnostic helper unit tests
        run: python -m pytest -q tests/test_cmc_lapse_radiation_ms_one_step_ab.py

      - name: Run complete repository regression suite
        run: python -m pytest -q

      - name: Run matched one-step old-vs-candidate CMC A/B with cone and MS witnesses
        run: python tools/audit_cmc_lapse_radiation_ms_one_step_ab.py

      - name: Record provenance and checksums
        if: always()
        run: |
          mkdir -p results/cmc-lapse-radiation-ms-one-step-ab
          printf '%s\n' "$SOURCE_COMMIT" > results/cmc-lapse-radiation-ms-one-step-ab/CANDIDATE_SOURCE_COMMIT.txt
          printf '%s\n' "$VENDOR_COMMIT" > results/cmc-lapse-radiation-ms-one-step-ab/VENDOR_COMMIT.txt
          git rev-parse HEAD > results/cmc-lapse-radiation-ms-one-step-ab/AUDIT_COMMIT.txt
          if test -f results/cmc-lapse-radiation-ms-one-step-ab/report.json; then
            sha256sum results/cmc-lapse-radiation-ms-one-step-ab/report.json > results/cmc-lapse-radiation-ms-one-step-ab/SHA256SUMS.txt
          fi

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmc-lapse-radiation-ms-one-step-ab
          path: results/cmc-lapse-radiation-ms-one-step-ab/
          if-no-files-found: warn
          retention-days: 90
