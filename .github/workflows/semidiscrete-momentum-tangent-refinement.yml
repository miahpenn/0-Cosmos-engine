name: Diagnostic - spatial refinement of momentum-constraint tangent

on:
  push:
    branches:
      - diag/lambda-connection-budget-2026-10-12
    paths:
      - tools/semidiscrete_momentum_tangent_refinement.py
      - .github/workflows/semidiscrete-momentum-tangent-refinement.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: semidiscrete-momentum-tangent-refinement
  cancel-in-progress: true

jobs:
  tangent-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout diagnostic code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact production source and pinned vendor
        uses: actions/checkout@v4
        with:
          ref: 6d8b3f2790644591326df57c55908863f994cb0c
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Download exact N40/N60/N80/N120 t=2.16 checkpoints
        uses: actions/download-artifact@v4
        with:
          name: lambda-spatial-refinement-t2p16
          run-id: 38212879394
          github-token: ${{ github.token }}
          path: spatial-artifact

      - name: Compile diagnostic
        run: python -m py_compile tools/semidiscrete_momentum_tangent_refinement.py

      - name: Compute matched-radius momentum tangent at t=0 and t=2.16
        run: python tools/semidiscrete_momentum_tangent_refinement.py

      - name: Upload signed tangent profiles and convergence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semidiscrete-momentum-tangent-refinement
          path: results/semidiscrete-momentum-tangent-refinement/
          if-no-files-found: warn
          retention-days: 90
