name: Diagnostic - origin quadrature signed initial H budget

on:
  push:
    branches:
      - diag/discrete-consistent-initial-production-test-2026-10-12
    paths:
      - tools/audit_origin_quadrature_initial_h_budget.py
      - tools/origin_half_cell_quadrature_regularity_ab.py
      - .github/workflows/origin-quadrature-initial-h-budget.yml

permissions:
  contents: read

concurrency:
  group: origin-quadrature-initial-h-budget-2026-10-12
  cancel-in-progress: false

jobs:
  frozen-initial-h-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact production source and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          ref: 6d8b3f2790644591326df57c55908863f994cb0c
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact production dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Compile signed initial H budget diagnostic
        run: |
          python -m py_compile tools/audit_origin_quadrature_initial_h_budget.py
          python -m py_compile tools/origin_half_cell_quadrature_regularity_ab.py

      - name: Compare geometric H term and total matter source on frozen t=0 slices
        run: python tools/audit_origin_quadrature_initial_h_budget.py

      - name: Upload signed H budget profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origin-quadrature-initial-h-budget
          path: results/origin-quadrature-initial-h-budget/
          if-no-files-found: warn
          retention-days: 90
