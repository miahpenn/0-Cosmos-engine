name: Research - origin-anchored half-cell Ricci response

on:
  push:
    branches:
      - research/origin-half-cell-fit-order-audit-2026-10-15
    paths:
      - tools/audit_origin_anchored_half_cell_ricci_response.py
      - tests/test_origin_anchored_half_cell_ricci_response.py
      - .github/workflows/origin-anchored-half-cell-ricci-response.yml

permissions:
  contents: read

concurrency:
  group: origin-anchored-half-cell-ricci-response-2026-10-15
  cancel-in-progress: false

jobs:
  anchored-response:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out research branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository requirements
        run: python -m pip install -r requirements.txt

      - name: Compile anchored audit and tests
        run: |
          python -m py_compile tools/audit_origin_anchored_half_cell_ricci_response.py
          python -m py_compile tests/test_origin_anchored_half_cell_ricci_response.py

      - name: Run manufactured anchored-fit regression controls
        run: python -m pytest -q tests/test_origin_anchored_half_cell_ricci_response.py

      - name: Run source-pinned copied-initializer and signed Ricci counterfactuals
        run: |
          python tools/audit_origin_anchored_half_cell_ricci_response.py \
            --output-dir results/origin-anchored-half-cell-ricci-response-2026-10-15

      - name: Upload report and signed profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origin-anchored-half-cell-ricci-response-2026-10-15
          path: results/origin-anchored-half-cell-ricci-response-2026-10-15/
          if-no-files-found: warn
          retention-days: 90
