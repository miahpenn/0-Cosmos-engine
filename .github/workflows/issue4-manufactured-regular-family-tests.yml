name: Issue 4 manufactured regular-family constructor tests

on:
  push:
    branches:
      - research/issue4-zero-step-bianchi-observer-2026-11-04
    paths:
      - tools/issue4_manufactured_regular_family.py
      - tests/test_issue4_manufactured_regular_family.py
      - .github/workflows/issue4-manufactured-regular-family-tests.yml

permissions:
  contents: read

concurrency:
  group: issue4-manufactured-regular-family-tests
  cancel-in-progress: false

jobs:
  constructor-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out research branch and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up the accepted-observer Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"

      - name: Install the exact accepted-observer numerical environment
        run: |
          python -m pip install \
            numpy==2.5.4 \
            scipy==1.18.1 \
            sympy==1.14.0 \
            mpmath==1.3.0 \
            pytest==9.1.1 \
            threadpoolctl

      - name: Capture runtime and dependency provenance
        run: |
          mkdir -p constructor-test-results
          python - <<'PY'
          import json, platform, sys
          from importlib.metadata import version
          import numpy, scipy, sympy, mpmath, pytest
          report = {
              "python": sys.version,
              "platform": platform.platform(),
              "packages": {
                  name: version(name)
                  for name in ("numpy", "scipy", "sympy", "mpmath", "pytest", "threadpoolctl")
              },
              "runner": {
                  "os": __import__("os").environ.get("RUNNER_OS"),
                  "arch": __import__("os").environ.get("RUNNER_ARCH"),
                  "run_id": __import__("os").environ.get("GITHUB_RUN_ID"),
                  "sha": __import__("os").environ.get("GITHUB_SHA"),
              },
          }
          with open("constructor-test-results/runtime.json", "w") as f:
              json.dump(report, f, indent=2, sort_keys=True)
              f.write("\\n")
          PY
          python -m pip freeze > constructor-test-results/pip-freeze.txt
          git rev-parse HEAD > constructor-test-results/runner-commit.txt
          git -C vendor/bb-palatini-unified-r0 rev-parse HEAD > constructor-test-results/vendor-commit.txt

      - name: Compile and run constructor tests only
        run: |
          python -m py_compile tools/issue4_manufactured_regular_family.py
          python -m py_compile tests/test_issue4_manufactured_regular_family.py
          python -m pytest -q tests/test_issue4_manufactured_regular_family.py

      - name: Hash test provenance
        if: always()
        run: |
          find constructor-test-results -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > constructor-test-results/SHA256SUMS.txt

      - name: Upload constructor test provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue4-manufactured-regular-family-tests-${{ github.run_id }}
          path: constructor-test-results/
          if-no-files-found: warn
          retention-days: 90
