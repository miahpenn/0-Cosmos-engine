name: Research - joined EM/matter/Misner-Sharp ledger

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/audit_em_total_energy_budget.py
      - tests/test_research_em_total_energy_budget_contract.py
      - .github/workflows/em_total_energy_budget.yml

permissions:
  contents: read

concurrency:
  group: joined-em-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  joined-energy-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: 5c51bf509504365df394e6cca96bf1d117f4614d
      VENDOR_COMMIT: d6052d605673ce9d82cdc99b0df79855fa2ea215
    steps:
      - name: Check out candidate with vendor submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked repository dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify production source and vendor boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_COMMIT"
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          git diff --exit-code "$SOURCE_COMMIT" HEAD -- engine vendor requirements.txt .gitmodules
          actual_vendor="$(git rev-parse "HEAD:vendor/bb-palatini-unified-r0")"
          test "$actual_vendor" = "$VENDOR_COMMIT"
          printf 'SOURCE_ANCHOR=%s\nCHECKOUT_HEAD=%s\nVENDOR=%s\n' \
            "$SOURCE_COMMIT" "$(git rev-parse HEAD)" "$actual_vendor"

      - name: Run complete repository tests
        run: python -m pytest -q

      - name: Run joined neutral/charged EM energy ledger
        run: python tools/audit_em_total_energy_budget.py --output "$RUNNER_TEMP/em_total_energy_budget.json"

      - name: Upload signed joined-ledger JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: em-total-energy-budget-${{ github.sha }}
          path: ${{ runner.temp }}/em_total_energy_budget.json
          if-no-files-found: ignore
          retention-days: 90
