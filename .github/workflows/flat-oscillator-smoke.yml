name: Diagnostic - flat-space oscillator smoke test

on:
  push:
    branches:
      - "diag/bond-sweep-self-consistent"
    paths:
      - "diagnostics/flat_oscillator_smoke.py"
      - ".github/workflows/flat-oscillator-smoke.yml"

permissions:
  contents: read

jobs:
  flat-oscillator:
    if: contains(github.event.head_commit.message, '[flat-oscillator-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run known-physics oscillator test
        run: python diagnostics/flat_oscillator_smoke.py
      - name: Upload diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: flat-oscillator-smoke
          path: runs/flat_oscillator_smoke/flat_oscillator_smoke.json
          if-no-files-found: error
