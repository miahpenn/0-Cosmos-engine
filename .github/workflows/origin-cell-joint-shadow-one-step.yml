name: Diagnostic - joint regular-origin shadow one-step

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/audit_origin_cell_joint_shadow_one_step.py
      - .github/workflows/origin-cell-joint-shadow-one-step.yml

permissions:
  contents: read

concurrency:
  group: origin-cell-joint-shadow-one-step
  cancel-in-progress: false

jobs:
  one-step-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: "4aec88d0e3ff028e0a65a8ac36b30948625df792"
      VENDOR_COMMIT: "d6052d605673ce9d82cdc99b0df79855fa2ea215"
      ORIGIN_STEP_OUT: "results/origin-cell-joint-shadow-one-step-2026-10-24"
    steps:
      - name: Check out diagnostic PR and pinned vendor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fail closed if production source, vendor, or dependencies drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT")" = "$SOURCE_COMMIT"
          test "$(git rev-parse "HEAD:vendor/bb-palatini-unified-r0")" = "$VENDOR_COMMIT"
          test "$(git -C vendor/bb-palatini-unified-r0 rev-parse HEAD)" = "$VENDOR_COMMIT"
          protected_diff="$(git diff --name-only "$SOURCE_COMMIT" HEAD -- engine vendor .gitmodules requirements.txt)"
          if [[ -n "$protected_diff" ]]; then
            echo "Unexpected changes to protected production/vendor/dependency paths:"
            echo "$protected_diff"
            exit 1
          fi
          echo "SOURCE_COMMIT=$SOURCE_COMMIT"
          echo "VENDOR_COMMIT=$VENDOR_COMMIT"
          echo "PROTECTED_SOURCE_DIFF=empty"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository requirements
        run: python -m pip install -r requirements.txt

      - name: Compile diagnostic observer
        run: python -m py_compile tools/audit_origin_cell_joint_shadow_one_step.py

      - name: Run baseline, metric-only, CMC-row-only, and joint-shadow one-step arms
        run: python tools/audit_origin_cell_joint_shadow_one_step.py

      - name: Upload signed one-step report and profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origin-cell-joint-shadow-one-step-2026-10-24
          path: results/origin-cell-joint-shadow-one-step-2026-10-24/
          if-no-files-found: warn
          retention-days: 90
