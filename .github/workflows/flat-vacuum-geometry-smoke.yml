name: Diagnostic - flat-vacuum production geometry RHS smoke test

on:
  push:
    branches:
      - "diag/bond-sweep-self-consistent"
    paths:
      - "diagnostics/flat_vacuum_geometry_smoke.py"
      - ".github/workflows/flat-vacuum-geometry-smoke.yml"

permissions:
  contents: read

jobs:
  flat-vacuum-geometry:
    if: contains(github.event.head_commit.message, '[flat-vacuum-geometry-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout engine and pinned numerical kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run flat-vacuum geometry RHS test
        run: python diagnostics/flat_vacuum_geometry_smoke.py
      - name: Upload diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: flat-vacuum-geometry-smoke
          path: runs/flat_vacuum_geometry_smoke/flat_vacuum_geometry_smoke.json
          if-no-files-found: error
