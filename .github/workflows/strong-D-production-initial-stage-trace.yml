name: Diagnostic - strong-D production initial stage trace

on:
  push:
    branches:
      - diag/independent-metric-ricci-audit
    paths:
      - diagnostics/curvature_consistency/strong_D_production_initial_stage_trace.py
      - .github/workflows/strong-D-production-initial-stage-trace.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout diagnostic branch and pinned vendor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile initialization stage trace
        run: python -m py_compile diagnostics/curvature_consistency/strong_D_production_initial_stage_trace.py
      - name: Run production initialization stage trace (strong D, N=160)
        run: python diagnostics/curvature_consistency/strong_D_production_initial_stage_trace.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strong-D-production-initial-stage-trace
          path: runs/strong-D-production-initial-stage-trace/report.json
          if-no-files-found: error
          retention-days: 90
